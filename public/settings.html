<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeShift — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/js/password-policy.js"></script>
  <script>
    // Apply theme immediately to avoid flash
    (function(){
      var t = localStorage.getItem('fs-theme') || 'system'
      if (t === 'system') {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark')
      } else if (t !== 'light') {
        document.documentElement.setAttribute('data-theme', t)
      }
    })()
  </script>
  <style>
    .settings-tabs-wrap { flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border); overflow:hidden; }
    .settings-tabs { display:flex; overflow-x:auto; scrollbar-width:none; padding:0 16px; }
    .settings-tabs::-webkit-scrollbar { display:none; }
    .settings-tab {
      display:flex; align-items:center; gap:6px; padding:11px 14px;
      background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
      font-family:var(--font); font-size:13px; font-weight:500; color:var(--text-3);
      cursor:pointer; white-space:nowrap; flex-shrink:0;
      transition:color var(--t-fast), border-color var(--t-fast);
    }
    .settings-tab:hover { color:var(--text); }
    .settings-tab.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
    .settings-tab svg { width:14px; height:14px; flex-shrink:0; }
    /* Backup panel */
    .backup-section { margin-bottom: 28px; }
    .backup-section:last-child { margin-bottom: 0; }
    .backup-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .backup-meta-item { background: var(--gray-50); border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 10px 12px; }
    .backup-meta-item .bm-val { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--text); line-height: 1; }
    .backup-meta-item .bm-lbl { font-size: 11px; color: var(--text-3); margin-top: 3px; }
    .restore-preview { background: var(--gray-50); border: 1px solid var(--border-2); border-radius: var(--r-lg); padding: 16px; margin-bottom: 16px; }
    .restore-preview h5 { font-size: 12px; font-weight: 700; color: var(--text-2); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; }
    .restore-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--border-2); }
    .restore-row:last-child { border-bottom: none; }
    .restore-row span:first-child { color: var(--text-2); }
    .restore-row span:last-child { font-family: var(--mono); font-weight: 600; color: var(--text); }
    .backup-drop-zone { border: 2px dashed var(--border); border-radius: var(--r-lg); padding: 32px 24px; text-align: center; cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); background: var(--gray-50); }
    .backup-drop-zone:hover, .backup-drop-zone.drag-over { border-color: var(--brand); background: var(--brand-light); }
    .backup-drop-zone svg { color: var(--text-3); margin-bottom: 8px; }
    .backup-drop-zone p { margin: 0; font-size: 13px; color: var(--text-2); }
    .backup-drop-zone small { font-size: 11px; color: var(--text-3); }
    .backup-progress { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--brand-light); border: 1px solid var(--brand); border-radius: var(--r-lg); font-size: 13px; color: var(--brand); }
    .backup-result-ok  { padding: 12px 16px; background: rgba(0,135,90,.08); border: 1px solid rgba(0,135,90,.3); border-radius: var(--r-lg); font-size: 13px; }
    .backup-result-err { padding: 12px 16px; background: rgba(222,53,11,.06); border: 1px solid rgba(222,53,11,.25); border-radius: var(--r-lg); font-size: 13px; color: var(--red,#de350b); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
    /* 2FA */
    .twofa-status { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--gray-50); border:1px solid var(--border-2); border-radius:var(--r-lg); margin-bottom:16px; }
    .twofa-enabled  { color: var(--green); }
    .twofa-disabled { color: var(--text-3); }
    .qr-wrap { display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-bottom:16px; padding:16px; background:var(--gray-50); border:1px solid var(--border-2); border-radius:var(--r-lg); }
    .qr-wrap canvas, .qr-wrap img { border-radius:var(--r-md); }
    .settings-panel { display:none; padding:24px; max-width:700px; }
    .settings-panel.active { display:block; }
    .section-card { margin-bottom:20px; }
    .pref-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); gap:16px; }
    .pref-row:last-child { border-bottom:none; }
    .pref-info { flex:1; min-width:0; }
    .pref-info strong { display:block; font-size:13px; font-weight:600; margin-bottom:2px; }
    .pref-info span { display:block; font-size:12px; color:var(--text-3); line-height:1.4; }
    .member-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .member-row:last-child { border-bottom:none; }
    .member-info { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
    .member-actions { display:flex; gap:6px; flex-wrap:wrap; padding-top:6px; padding-left:48px; width:100%; }
    .theme-grid { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
    .theme-option {
      display:flex; flex-direction:column; align-items:center; gap:8px;
      padding:12px 16px; border:2px solid var(--border); border-radius:var(--r-lg);
      background:var(--surface-2); cursor:pointer; min-width:80px;
      transition:border-color var(--t-fast), background var(--t-fast);
    }
    .theme-option:hover { border-color:var(--brand); }
    .theme-option.active { border-color:var(--brand); background:var(--brand-light); }
    .theme-option span { font-size:12px; font-weight:600; color:var(--text-2); }
    .theme-option.active span { color:var(--brand); }
    .theme-swatch { width:44px; height:30px; border-radius:6px; border:1px solid var(--border); }
    .policy-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); gap:12px; }
    .policy-row:last-child { border-bottom:none; }
    .copy-url-row { display:flex; gap:8px; }
    .copy-url-row input { flex:1; font-size:11px; font-family:var(--mono); }
    /* Mobile select — hidden on desktop, shown on mobile */
    .settings-mobile-select {
      display: none;
    }
    @media(max-width:600px){
      .settings-tabs { display: none; }
      .settings-mobile-select {
        display: block;
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 500;
        font-family: var(--font);
        color: var(--text);
        background: var(--surface);
        border: none;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        outline: none;
        cursor: pointer;
        -webkit-appearance: auto;
        appearance: auto;
      }
      .settings-tab { padding: 10px 10px; font-size: 12px; }
      .member-actions { padding-left:0; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <div class="app-body" style="flex:1;min-height:0;flex-direction:column;overflow:hidden">
    <div class="settings-tabs-wrap">
      <!-- Desktop: horizontal tab bar -->
      <div class="settings-tabs" id="settingsTabs"></div>
      <!-- Mobile: native select picker -->
      <select class="settings-mobile-select" id="settingsMobileSelect" onchange="showTab(this.value)"></select>
    </div>
    <div style="flex:1;overflow-y:auto" id="settingsPanelsWrap">
      <!-- Panels injected by JS -->
    </div>
  </div>
</div>

<!-- Invite User Modal -->
<div class="modal-overlay" id="inviteModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="inviteModalTitle">Create User</h3>
      <button class="modal-close" onclick="closeInviteModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Full name</label><input type="text" class="form-input" id="iName"></div>
      <div class="form-group"><label class="form-label">Email address</label><input type="email" class="form-input" id="iEmail"></div>
      <div class="form-group"><label class="form-label">Role</label>
        <select class="form-select" id="iRole"><option value="member">Member</option><option value="admin">Admin</option></select>
      </div>
      <div id="inviteResult" style="display:none;padding:12px 14px;border-radius:var(--r-md);font-size:13px;margin-top:4px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeInviteModal()">Close</button>
      <button class="btn btn-primary" id="inviteSubmitBtn" onclick="doInvite()">Create account</button>
    </div>
  </div>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editUserModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Edit User</h3>
      <button class="modal-close" onclick="document.getElementById('editUserModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Full name</label><input type="text" class="form-input" id="euName"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="euEmail"></div>
      <div class="form-group"><label class="form-label">Role</label>
        <select class="form-select" id="euRole"><option value="member">Member</option><option value="admin">Admin</option></select>
      </div>
      <div class="form-group">
        <div style="display:flex;align-items:center;gap:10px">
          <label class="toggle"><input type="checkbox" id="euActive" checked><span class="toggle-slider"></span></label>
          <span class="form-label" style="margin:0">Account active</span>
        </div>
      </div>
      <!-- Set Password toggle -->
      <div class="form-group" style="border-top:1px solid var(--border);padding-top:14px;margin-top:4px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <label class="toggle"><input type="checkbox" id="euSetPwToggle" onchange="toggleEuSetPw()"><span class="toggle-slider"></span></label>
          <span class="form-label" style="margin:0">Set new password for this user</span>
        </div>
        <div id="euSetPwFields" style="display:none">
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label">New password</label>
            <div style="position:relative">
              <input type="password" class="form-input" id="euNewPw" placeholder="••••••••" style="padding-right:40px" oninput="updatePasswordIndicator(euPwIndicator, this.value)">
              <button type="button" onclick="(function(){var i=document.getElementById('euNewPw');i.type=i.type==='text'?'password':'text'})()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px">
                <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
              </button>
            </div>
            <div id="euPwIndicatorWrap" style="margin-top:8px"></div>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label">Confirm password</label>
            <input type="password" class="form-input" id="euNewPw2" placeholder="••••••••">
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('editUserModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditUser()">Save</button>
    </div>
  </div>
</div>

<!-- Location Modal -->
<div class="modal-overlay" id="locModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="locModalTitle">Add Location</h3>
      <button class="modal-close" onclick="closeLocModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" id="lName" placeholder="e.g. Head Office"></div>
      <div class="form-group"><label class="form-label">Address (optional)</label><input type="text" class="form-input" id="lAddress" placeholder="e.g. 123 Main St, London"></div>
      <div class="form-group"><label class="form-label">Colour</label><div id="locColourPicker"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeLocModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveLoc()">Save</button>
    </div>
  </div>
</div>

<script src="/js/shell.js"></script>
<script src="/js/prefs.js"></script>
<script>
'use strict'

let cfg = null, users = [], locations = []
let editingUserId = null, editingLocId = null, locColour = '#4f46e5'
let euPwIndicator = null

async function init() {
  cfg = await loadConfig()
  if (!cfg) return
  renderShell(cfg, 'settings')
  // Load user prefs so the Preferences panel can show current values
  await loadPrefs()

  const isAdmin = cfg.user.role === 'admin'

  const ALL_TABS = [
    { id: 'appearance', label: 'Appearance', adminOnly: false,
      icon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>' },
    { id: 'ical', label: 'Calendar Feed', adminOnly: false,
      icon: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' },
    { id: 'preferences', label: 'Preferences', adminOnly: false,
      icon: '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="10" cy="18" r="2" fill="currentColor" stroke="none"/>' },

    { id: 'team', label: 'Team', adminOnly: true,
      icon: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>' },
    { id: 'locations', label: 'Locations', adminOnly: true,
      icon: '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>' },
    { id: 'security', label: 'Security', adminOnly: true,
      icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' },
    { id: 'email', label: 'Email', adminOnly: true,
      icon: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>' },
    { id: 'audit', label: 'Audit Log', adminOnly: true,
      icon: '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>' },
    { id: 'backup', label: 'Backup', adminOnly: true,
      icon: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4.03 3-9 3S3 13.66 3 12"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>' },
    { id: 'buildinfo', label: 'Build Info', adminOnly: true,
      icon: '<rect x="2" y="3" width="20" height="14" rx="2" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="12" cy="10" r="2"/>' },
    { id: 'account', label: 'Account', adminOnly: false,
      icon: '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>' },
    { id: 'about', label: 'About', adminOnly: false,
      icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' },
  ]

  const tabs = ALL_TABS.filter(t => !t.adminOnly || isAdmin)

  // Render tab bar
  const tabBar = document.getElementById('settingsTabs')
  tabBar.innerHTML = tabs.map(t => `
    <button class="settings-tab" id="tab-btn-${t.id}" onclick="showTab('${t.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
      <span>${t.label}</span>
    </button>`).join('')

  // Populate mobile select picker
  const mobileSelect = document.getElementById('settingsMobileSelect')
  if (mobileSelect) {
    mobileSelect.innerHTML = tabs.map(t => `<option value="${t.id}">${t.label}</option>`).join('')
  }

  // Render panels container
  const wrap = document.getElementById('settingsPanelsWrap')
  wrap.innerHTML = tabs.map(t => `<div class="settings-panel" id="panel-${t.id}"></div>`).join('')

  // Load data then populate
  if (isAdmin) await Promise.all([loadUsers(), loadLocations()])
  // Apply password policy to client-side validator
  try { if (cfg.passwordPolicy) setPasswordPolicy(cfg.passwordPolicy) } catch {}
  // Wire password indicator for Edit User modal
  euPwIndicator = document.getElementById('euPwIndicatorWrap')
  await Promise.all([
    renderAppearancePanel(),
    renderIcalPanel(),
    renderPreferencesPanel(),
    isAdmin ? renderTeamPanel() : Promise.resolve(),
    isAdmin ? renderLocationsPanel() : Promise.resolve(),
    isAdmin ? renderSecurityPanel() : Promise.resolve(),
    isAdmin ? renderEmailPanel() : Promise.resolve(),
    isAdmin ? renderAuditPanel() : Promise.resolve(),
    isAdmin ? renderBackupPanel() : Promise.resolve(),
    isAdmin ? renderBuildInfoPanel() : Promise.resolve(),
    renderAccountPanel(),
    renderAboutPanel(),
  ])

  // Show first tab (or hash)
  const hash = window.location.hash.slice(1)
  const validTab = tabs.find(t => t.id === hash)
  showTab(validTab ? hash : tabs[0].id)
}

function showTab(id) {
  document.querySelectorAll('.settings-panel').forEach(p => p.classList.remove('active'))
  document.querySelectorAll('.settings-tab').forEach(b => b.classList.remove('active'))
  const panel = document.getElementById('panel-' + id)
  const btn   = document.getElementById('tab-btn-' + id)
  if (panel) panel.classList.add('active')
  if (btn)   btn.classList.add('active')
  // Keep mobile select in sync
  const sel = document.getElementById('settingsMobileSelect')
  if (sel) sel.value = id
  window.location.hash = id
}

async function loadUsers() { users = await api('/api/users') }
async function loadLocations() { locations = await api('/api/locations') }

// ── Appearance panel ───────────────────────────────────────────────────────────
async function renderAppearancePanel() {
  const el = document.getElementById('panel-appearance')
  const currentTheme = localStorage.getItem('fs-theme') || 'system'
  el.innerHTML = `
    <h2 style="font-size:18px;font-weight:800;margin-bottom:20px">Appearance</h2>
    <div class="card section-card">
      <div class="card-header"><h3 class="card-title">Theme</h3></div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--text-3);margin-bottom:16px">
          Choose how ForgeShift looks. System mode follows your OS light/dark preference automatically.
        </p>
        <div class="theme-grid" id="themeGrid">
          ${[
            { id:'system', label:'System',    emoji:'🖥️', bg:'linear-gradient(135deg,#fff 50%,#1e293b 50%)', border:'var(--border)' },
            { id:'light',  label:'Light',     emoji:'☀️', bg:'#f3f4f6',  border:'#e5e7eb' },
            { id:'dark',   label:'Dark',      emoji:'🌙', bg:'#0f172a',  border:'#1e293b' },
            { id:'oled',   label:'OLED Black',emoji:'⬛', bg:'#000000',  border:'#0d0d0d' },
          ].map(t => `
            <div class="theme-option${currentTheme===t.id?' active':''}" id="themeOpt-${t.id}" onclick="pickTheme('${t.id}')">
              <div class="theme-swatch" style="background:${t.bg};border-color:${t.border}"></div>
              <span>${t.emoji} ${t.label}</span>
            </div>`).join('')}
        </div>
        <p style="font-size:12px;color:var(--text-3);margin-top:12px">
          Current: <strong id="currentThemeName">${currentTheme}</strong>
        </p>
      </div>
    </div>`
}

function pickTheme(theme) {
  // Apply immediately
  if (theme === 'system') {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : '')
    if (!prefersDark) document.documentElement.removeAttribute('data-theme')
  } else if (theme === 'light') {
    document.documentElement.removeAttribute('data-theme')
  } else {
    document.documentElement.setAttribute('data-theme', theme)
  }
  localStorage.setItem('fs-theme', theme)
  // Update UI
  document.querySelectorAll('.theme-option').forEach(el => el.classList.remove('active'))
  document.getElementById('themeOpt-' + theme)?.classList.add('active')
  document.getElementById('currentThemeName').textContent = theme
  toast('Theme set to ' + theme, 'success', 1500)
}

// ── Preferences panel ──────────────────────────────────────────────────────────
async function renderPreferencesPanel() {
  const el = document.getElementById('panel-preferences')
  if (!el) return
  const p = getPrefs()

  el.innerHTML = `
    <h2 style="font-size:18px;font-weight:800;margin-bottom:20px">Preferences</h2>
    <p style="font-size:13px;color:var(--text-3);margin-bottom:20px;margin-top:-12px">
      These preferences only affect your view — they don't change anything for other users.
    </p>

    <!-- Calendar display -->
    <div class="card section-card">
      <div class="card-header">
        <h3 class="card-title">Calendar</h3>

        <p style="font-size:13px;color:var(--text-3);margin-bottom:16px;line-height:1.5">

        </p>
      </div>
    </div>`
}

function pickWeekStart(day) {
  document.getElementById('wsd-mon')?.classList.toggle('active', day === 1)
  document.getElementById('wsd-sun')?.classList.toggle('active', day === 0)
  window._pendingWeekStart = day
}

function pickDefaultView(v) {
  document.getElementById('dv-month')?.classList.toggle('active', v === 'month')
  document.getElementById('dv-week')?.classList.toggle('active', v === 'week')
  window._pendingDefaultView = v
}

async function savePrefsPanel() {
  // Read all controls
  const wsd = window._pendingWeekStart !== undefined
    ? window._pendingWeekStart
    : (document.getElementById('wsd-sun')?.classList.contains('active') ? 0 : 1)
  const dv = window._pendingDefaultView !== undefined
    ? window._pendingDefaultView
    : (document.getElementById('dv-week')?.classList.contains('active') ? 'week' : 'month')

  const holidays = HOLIDAY_SETS
    .filter(s => document.getElementById('hol-' + s.id)?.checked)
    .map(s => s.id)

  const updates = {
    weekStartDay:      wsd,
    defaultView:       dv,
    showWeekNumbers:   document.getElementById('prefShowWkNums')?.checked ?? false,
    compactChips:      document.getElementById('prefCompact')?.checked ?? false,
    defaultShiftStart: document.getElementById('prefDefaultStart')?.value || '',
    defaultShiftEnd:   document.getElementById('prefDefaultEnd')?.value || '',
    holidays,
  }

  // Clear pending
  delete window._pendingWeekStart
  delete window._pendingDefaultView

  await savePrefs(updates)
  toast('Preferences saved', 'success')
}

async function loadIcal() {
  try {
    const data = await api('/api/ical/token')
    document.getElementById('icalLoading').style.display = 'none'
    document.getElementById('icalContent').style.display = 'block'
    document.getElementById('icalUrl').value = data.feedUrl
    document.getElementById('icalDownload').href = data.feedUrl
  } catch {
    document.getElementById('icalLoading').textContent = 'Failed to load iCal token'
  }
}

function copyIcal() {
  navigator.clipboard.writeText(document.getElementById('icalUrl').value).then(() => toast('URL copied!', 'success'))
}
async function regenerateIcal() {
  if (!confirm('Regenerate iCal token? Your current calendar subscription will stop working and you will need to re-subscribe.')) return
  await api('/api/ical/token', { method: 'DELETE' })
  await loadIcal()
  toast('Token regenerated', 'success')
}

async function saveEditUser() {

async function getResetLink(id, name) {
  function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
  const existing = document.getElementById('reset-link-modal')
  if (existing) existing.remove()
  const modal = document.createElement('div')
  modal.className = 'modal-overlay'
  modal.id = 'reset-link-modal'
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(9,30,66,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px'
  modal.innerHTML = `
    <div style="background:var(--surface);border-radius:var(--r-xl);padding:24px;width:100%;max-width:440px;box-shadow:0 24px 80px rgba(9,30,66,.3)">
      <div style="font-size:16px;font-weight:700;margin-bottom:4px">Password Reset Link</div>
      <div style="font-size:13px;color:var(--text-2);margin-bottom:16px">Generating a secure reset link for <strong>${escHtml(name)}</strong>. The link expires in <strong>15 minutes</strong>.</div>
      <div id="reset-link-result" style="margin:14px 0;font-size:13px;color:var(--text-2)">
        <div style="display:flex;align-items:center;gap:8px;color:var(--text-3)">
          <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".25"/><path d="M21 12a9 9 0 00-9-9"/></svg>
          Generating…
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-secondary" id="reset-link-close">Close</button>
        <button class="btn btn-primary" id="reset-link-copy" style="display:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy Link
        </button>
      </div>
    </div>`
  document.body.appendChild(modal)
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove() })
  document.getElementById('reset-link-close').addEventListener('click', () => modal.remove())
  try {
    const r = await api(`/api/auth/admin/reset-link/${id}`)
    const resultEl = document.getElementById('reset-link-result')
    resultEl.innerHTML = `
      <div style="background:var(--gray-50);border:1px solid var(--border-2);border-radius:var(--r-md);padding:10px;word-break:break-all;font-family:var(--mono);font-size:11px;user-select:all;margin-bottom:8px">${escHtml(r.resetUrl)}</div>
      <div style="font-size:12px;color:var(--orange)">⚠ Share this link securely — it expires in 15 minutes and can only be used once.</div>`
    const copyBtn = document.getElementById('reset-link-copy')
    copyBtn.style.display = 'flex'
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(r.resetUrl).then(() => {
        copyBtn.textContent = '✓ Copied!'
        setTimeout(() => {
          copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy Link`
        }, 2000)
      })
    })
  } catch (err) {
    document.getElementById('reset-link-result').innerHTML = `<span style="color:var(--red)">${escHtml(err.message)}</span>`
  }
}

async function renderTwoFA() {
  const area = document.getElementById('twofa-area')
  if (!area) return
  let twofaSetupData = null
  function twEsc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
  try {
    const status = await api('/api/auth/2fa/status')
    if (status.enabled) {
      area.innerHTML = `
        <div class="twofa-status">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="var(--green)" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div>
            <div style="font-weight:600;font-size:14px;" class="twofa-enabled">Two-factor authentication is enabled</div>
            <div style="font-size:12px;color:var(--text-3);margin-top:2px">Your account is protected with an authenticator app.</div>
          </div>
        </div>
        <button class="btn btn-danger btn-sm" id="disable-2fa-btn">Disable 2FA</button>`
      document.getElementById('disable-2fa-btn').addEventListener('click', () => {
        area.innerHTML = `
          <div style="padding:16px;background:var(--gray-50);border:1px solid var(--border-2);border-radius:var(--r-lg);margin-bottom:12px">
            <p style="font-size:13px;font-weight:600;margin:0 0 12px">Enter your current 6-digit authenticator code to confirm.</p>
            <input class="form-input" type="text" inputmode="numeric" id="disable-2fa-code" placeholder="000000" maxlength="6" style="max-width:160px;margin-bottom:10px;font-family:var(--mono);letter-spacing:.1em" />
            <div id="disable-2fa-err" style="color:var(--red);font-size:13px;display:none;margin-bottom:10px"></div>
            <div style="display:flex;gap:10px">
              <button class="btn btn-danger btn-sm" id="confirm-disable-2fa">Disable 2FA</button>
              <button class="btn btn-secondary btn-sm" id="cancel-disable-2fa">Cancel</button>
            </div>
          </div>`
        document.getElementById('cancel-disable-2fa').addEventListener('click', renderTwoFA)
        document.getElementById('confirm-disable-2fa').addEventListener('click', async () => {
          const code = document.getElementById('disable-2fa-code').value.trim()
          const errEl = document.getElementById('disable-2fa-err')
          errEl.style.display = 'none'
          try {
            await api('/api/auth/2fa/disable', { method: 'POST', body: { code } })
            toast('2FA disabled', 'success')
            renderTwoFA()
          } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block' }
        })
      })
    } else {
      area.innerHTML = `
        <div class="twofa-status">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="var(--text-3)" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <div>
            <div style="font-weight:600;font-size:14px" class="twofa-disabled">Two-factor authentication is off</div>
            <div style="font-size:12px;color:var(--text-3);margin-top:2px">Enable it to protect your account with an authenticator app.</div>
          </div>
        </div>
        <button class="btn btn-primary btn-sm" id="enable-2fa-btn">Set up 2FA</button>`
      document.getElementById('enable-2fa-btn').addEventListener('click', async () => {
        const btn = document.getElementById('enable-2fa-btn')
        btn.disabled = true; btn.textContent = 'Generating…'
        try {
          twofaSetupData = await api('/api/auth/2fa/setup', { method: 'POST', body: {} })
          const isDark = document.documentElement.dataset.theme === 'dark' || document.documentElement.dataset.theme === 'oled'
          area.innerHTML = `
            <p style="font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.6">
              Scan this QR code with your authenticator app (Google Authenticator, Authy, 1Password, etc.), then enter the 6-digit code to verify.
            </p>
            <div class="qr-wrap">
              <div id="qr-canvas"></div>
              <p style="font-size:12px;color:var(--text-3);margin:0">Or enter this key manually:</p>
              <code style="font-size:13px;letter-spacing:.1em;color:var(--text-2);word-break:break-all">${twEsc(twofaSetupData.secret)}</code>
            </div>
            <div class="form-group">
              <label class="form-label">Verification code</label>
              <input class="form-input" type="text" inputmode="numeric" id="verify-2fa-code" placeholder="000000" maxlength="6" style="max-width:160px;font-family:var(--mono);letter-spacing:.1em" />
            </div>
            <div id="verify-2fa-err" style="color:var(--red);font-size:13px;display:none;margin-bottom:10px"></div>
            <div style="display:flex;gap:10px">
              <button class="btn btn-primary btn-sm" id="verify-2fa-btn">Verify &amp; Enable</button>
              <button class="btn btn-secondary btn-sm" id="cancel-2fa-setup">Cancel</button>
            </div>`
          new QRCode(document.getElementById('qr-canvas'), {
            text: twofaSetupData.otpauth,
            width: 160, height: 160,
            colorDark:  isDark ? '#c7d1e0' : '#111827',
            colorLight: 'transparent',
          })
          document.getElementById('cancel-2fa-setup').addEventListener('click', renderTwoFA)
          document.getElementById('verify-2fa-btn').addEventListener('click', async () => {
            const code  = document.getElementById('verify-2fa-code').value.trim()
            const errEl = document.getElementById('verify-2fa-err')
            errEl.style.display = 'none'
            try {
              await api('/api/auth/2fa/verify', { method: 'POST', body: { secret: twofaSetupData.secret, code } })
              toast('2FA enabled — your account is now protected', 'success')
              renderTwoFA()
            } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block' }
          })
        } catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Set up 2FA' }
      })
    }
  } catch { area.innerHTML = `<p style="font-size:13px;color:var(--text-3)">Could not load 2FA status.</p>` }
}

  // Load current config
  try {
    const cfg = await api('/api/config/email')
    document.getElementById('smtpHost').value     = cfg.smtpHost
    document.getElementById('smtpPort').value     = cfg.smtpPort || '587'
    document.getElementById('smtpSecure').checked = cfg.smtpSecure
    document.getElementById('smtpUser').value     = cfg.smtpUser
    document.getElementById('smtpPass').value     = cfg.hasPassword ? '••••••••' : ''
    document.getElementById('smtpFromName').value = cfg.smtpFromName
    document.getElementById('smtpFromAddr').value = cfg.smtpFromAddr

    const bar = document.getElementById('smtpStatusBar')
    bar.style.display = 'flex'
    if (cfg.enabled) {
      bar.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:16px;background:rgba(5,150,105,.1);border:1px solid rgba(5,150,105,.3);color:#065f46'
      bar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> SMTP configured — password reset emails and invitations are active.'
    } else {
      bar.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:16px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-3)'
      bar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> No SMTP configured — password reset links are shown on-screen via admin panel instead of being emailed.'
    }
  } catch {}

  // Load signup toggle state
  try {
    const appCfg = await api('/api/config')
    const signupToggle = document.getElementById('allowSignupToggle')
    if (signupToggle) signupToggle.checked = appCfg.allowSignup !== false
  } catch {}
}

function toggleSmtpPw() {
  const inp = document.getElementById('smtpPass')
  inp.type = inp.type === 'text' ? 'password' : 'text'
}

function smtpMsg(text, ok) {
  const el = document.getElementById('smtpMsg')
  el.style.cssText = `display:block;font-size:13px;padding:10px 12px;border-radius:var(--r-md);margin-top:12px;` +
    (ok ? 'background:rgba(5,150,105,.1);border:1px solid rgba(5,150,105,.3);color:#065f46'
        : 'background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);color:var(--red)')
  el.textContent = text
  setTimeout(() => { el.style.display = 'none' }, 6000)
}

async function saveSmtp() {
  const pass = document.getElementById('smtpPass').value
  try {
    await api('/api/config/email', { method: 'PATCH', body: {
      smtpHost:     document.getElementById('smtpHost').value.trim(),
      smtpPort:     document.getElementById('smtpPort').value,
      smtpSecure:   document.getElementById('smtpSecure').checked,
      smtpUser:     document.getElementById('smtpUser').value.trim(),
      smtpPass:     pass === '••••••••' ? undefined : pass,
      smtpFromName: document.getElementById('smtpFromName').value.trim(),
      smtpFromAddr: document.getElementById('smtpFromAddr').value.trim(),
    }})
    smtpMsg('✓ SMTP configuration saved.', true)
    toast('SMTP saved', 'success')
    // Refresh the status bar
    renderEmailPanel()
  } catch (err) { smtpMsg(err.message, false) }
}

async function testSmtp() {
  smtpMsg('Sending test email…', true)
  try {
    const r = await api('/api/config/email/test', { method: 'POST' })
    smtpMsg(`✓ Test email sent to ${r.sentTo}`, true)
    toast('Test email sent!', 'success')
  } catch (err) { smtpMsg(`✗ ${err.message}`, false) }
}

async function clearSmtp() {
  if (!confirm('Clear all SMTP configuration? Password reset emails will stop working.')) return
  await api('/api/config/email', { method: 'PATCH', body: { smtpHost: '', smtpUser: '', smtpPass: '', smtpFromName: '', smtpFromAddr: '' }})
  toast('SMTP configuration cleared', 'success')
  renderEmailPanel()
}

async function renderAuditPanel() {
  const el = document.getElementById('panel-audit')
  el.innerHTML = `
    <h2 style="font-size:18px;font-weight:800;margin-bottom:20px">Audit Log</h2>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Subject</th></tr></thead>
          <tbody id="auditBody"><tr><td colspan="4" style="text-align:center;color:var(--text-3);padding:24px">Loading…</td></tr></tbody>
        </table>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px" id="auditPager"></div>

let auditOffset = 0
async function loadAudit(offset) {
  auditOffset = offset
  try {
    const data = await api(`/api/audit?limit=30&offset=${offset}`)
    const tbody = document.getElementById('auditBody')
    if (!data.entries.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-3);padding:24px">No audit entries yet</td></tr>'; return
    }
    tbody.innerHTML = data.entries.map(e => {
      const dt = new Date(e.created_at)
      const ts = dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
      return `<tr>
        <td style="font-size:11px;color:var(--text-3);white-space:nowrap">${ts}</td>
        <td>${e.actor_name ? `<div style="display:flex;align-items:center;gap:6px"><div class="avatar" style="width:20px;height:20px;font-size:9px;background:${e.actor_color||'#4f46e5'}">${e.actor_initials||'?'}</div><span style="font-size:12px">${e.actor_name}</span></div>` : '<span style="color:var(--text-3)">—</span>'}</td>
        <td><code style="font-size:11px;background:var(--bg);padding:1px 5px;border-radius:3px">${e.action}</code></td>
        <td style="font-size:12px;color:var(--text-3)">${e.entity_name||e.entity_id||'—'}</td>
      </tr>`
    }).join('')
    // Pager
    const pager = document.getElementById('auditPager')
    pager.innerHTML = `
      <button class="btn btn-secondary btn-sm" onclick="loadAudit(${Math.max(0,offset-30)})" ${offset===0?'disabled':''}>← Prev</button>
      <span style="font-size:12px;color:var(--text-3);align-self:center">${offset+1}–${Math.min(offset+30,data.total)} of ${data.total}</span>
      <button class="btn btn-secondary btn-sm" onclick="loadAudit(${offset+30})" ${offset+30>=data.total?'disabled':''}>Next →</button>`
  } catch (err) {
    document.getElementById('auditBody').innerHTML = `<tr><td colspan="4" style="color:var(--red);padding:24px;text-align:center">${err.message}</td></tr>`
  }
}

// ── Backup panel ──────────────────────────────────────────────────────────────
async function renderBackupPanel() {
  const el = document.getElementById('panel-backup')
  if (!el) return

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  // Fetch live counts for the export summary
  let counts = { users: '…', locations: '…', shifts: '…', templates: '…' }
  try {
    const [u, l, s, t] = await Promise.all([
      api('/api/users'),
      api('/api/locations'),
      api('/api/shifts'),
      api('/api/templates'),
    ])
    counts = {
      users:     Array.isArray(u) ? u.length : '?',
      locations: Array.isArray(l) ? l.length : '?',
      shifts:    Array.isArray(s) ? s.length : '?',
      templates: Array.isArray(t) ? t.length : '?',
    }
  } catch {}

  el.innerHTML = `
    <h2 style="font-size:18px;font-weight:800;margin-bottom:20px">Backup &amp; Restore</h2>

    <div class="card section-card">
      <div class="card-header"><h3 class="card-title">Export Backup</h3></div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.6">
          Downloads a single <code style="font-family:var(--mono);font-size:11px;padding:1px 5px;background:var(--gray-100);border-radius:3px">.fsbackup</code>
          file containing your entire database — users, locations, shift templates, shifts, iCal tokens, and preferences.
        </p>
        <div class="backup-meta">
          <div class="backup-meta-item"><div class="bm-val">${counts.users}</div><div class="bm-lbl">Users</div></div>
          <div class="backup-meta-item"><div class="bm-val">${counts.locations}</div><div class="bm-lbl">Locations</div></div>
          <div class="backup-meta-item"><div class="bm-val">${counts.shifts}</div><div class="bm-lbl">Shifts</div></div>
          <div class="backup-meta-item"><div class="bm-val">${counts.templates}</div><div class="bm-lbl">Templates</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" id="backupExportBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download Backup
          </button>
          <span id="backupExportStatus" style="font-size:12px;color:var(--text-3)">Includes all data</span>
        </div>
      </div>
    </div>

    <div class="card section-card">
      <div class="card-header"><h3 class="card-title">Restore from Backup</h3></div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--text-2);margin-bottom:8px;line-height:1.6">
          Upload a <code style="font-family:var(--mono);font-size:11px;padding:1px 5px;background:var(--gray-100);border-radius:3px">.fsbackup</code> file to restore data.
          Restore is <strong>additive</strong> — existing records are updated with backup values and records not in the backup are left untouched.
        </p>
        <div style="padding:10px 14px;background:rgba(255,152,0,.07);border:1px solid rgba(255,152,0,.3);border-radius:var(--r-md);font-size:12px;color:var(--orange,#e07b00);margin-bottom:16px;display:flex;gap:10px;align-items:flex-start">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Passwords are included in the backup. Restoring on a new instance will allow users to log in with their original credentials immediately. If the new instance uses a different <code style="font-family:var(--mono);font-size:11px">PASSWORD_PEPPER</code>, users will need to reset their passwords.</span>
        </div>
        <div class="backup-drop-zone" id="backupDropZone">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>Drop a <strong>.fsbackup</strong> file here, or click to browse</p>
          <small>Maximum 256 MB</small>
          <input type="file" id="backupFileInput" accept=".fsbackup,application/octet-stream" style="display:none" />
        </div>
        <div id="backupPreviewArea" style="margin-top:16px;display:none"></div>
        <div id="backupResultArea"  style="margin-top:16px;display:none"></div>
      </div>
    </div>`

  // ── Export button ───────────────────────────────────────────────────────────
  document.getElementById('backupExportBtn').addEventListener('click', async () => {
    const btn    = document.getElementById('backupExportBtn')
    const status = document.getElementById('backupExportStatus')
    btn.disabled = true
    btn.innerHTML = `<svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".25"/><path d="M21 12a9 9 0 00-9-9"/></svg> Generating…`
    status.textContent = 'Building backup…'
    status.style.color = 'var(--text-3)'
    try {
      const resp = await fetch('/api/backup/export', { credentials: 'include' })
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ error: 'Export failed' }))
        throw new Error(err.error || 'Export failed')
      }
      const blob = await resp.blob()
      const cd   = resp.headers.get('Content-Disposition') || ''
      const fnMatch = cd.match(/filename="([^"]+)"/)
      const filename = fnMatch ? fnMatch[1] : 'forgeshift-backup.fsbackup'
      const url  = URL.createObjectURL(blob)
      const a    = document.createElement('a')
      a.href = url; a.download = filename
      document.body.appendChild(a); a.click()
      document.body.removeChild(a)
      URL.revokeObjectURL(url)
      const kb = (blob.size / 1024).toFixed(0)
      const mb = (blob.size / 1024 / 1024).toFixed(2)
      status.textContent = `✓ Downloaded ${blob.size > 1024*1024 ? mb + ' MB' : kb + ' KB'} — ${filename}`
      status.style.color = 'var(--green,#0a7c41)'
    } catch (err) {
      status.textContent = '✗ ' + err.message
      status.style.color = 'var(--red,#de350b)'
    } finally {
      btn.disabled = false
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Backup`
    }
  })

  // ── Drop zone & file picker ─────────────────────────────────────────────────
  const dropZone  = document.getElementById('backupDropZone')
  const fileInput = document.getElementById('backupFileInput')

  dropZone.addEventListener('click', () => fileInput.click())
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over') })
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'))
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over')
    const file = e.dataTransfer.files[0]
    if (file) handleRestoreFile(file)
  })
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0]
    if (file) handleRestoreFile(file)
  })

  // ── Parse backup file and show preview ─────────────────────────────────────
  function handleRestoreFile(file) {
    const previewArea = document.getElementById('backupPreviewArea')
    const resultArea  = document.getElementById('backupResultArea')
    resultArea.style.display = 'none'
    resultArea.innerHTML = ''

    if (!file.name.endsWith('.fsbackup') && file.type !== 'application/octet-stream' && file.type !== '') {
      previewArea.style.display = 'block'
      previewArea.innerHTML = `<div class="backup-result-err">Not a valid backup file. Please select a <code>.fsbackup</code> file.</div>`
      return
    }

    previewArea.style.display = 'block'
    previewArea.innerHTML = `<div class="backup-progress"><svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".25"/><path d="M21 12a9 9 0 00-9-9"/></svg> Reading backup file…</div>`

    const reader = new FileReader()
    reader.onerror = () => { previewArea.innerHTML = `<div class="backup-result-err">Failed to read file.</div>` }
    reader.onload = ev => {
      let manifest
      try { manifest = JSON.parse(ev.target.result) } catch {
        previewArea.innerHTML = `<div class="backup-result-err">File could not be parsed. Make sure it is a valid <code>.fsbackup</code> file and has not been modified.</div>`
        return
      }

      if (manifest.format !== 'forgeshift-backup') {
        previewArea.innerHTML = `<div class="backup-result-err">Not a ForgeShift backup file.</div>`
        return
      }
      if (manifest.version > 1) {
        previewArea.innerHTML = `<div class="backup-result-err">This backup was created with a newer version of ForgeShift (format v${manifest.version}). Please upgrade first.</div>`
        return
      }

      const t = manifest.tables || {}
      const exportedAt = manifest.exported_at ? new Date(manifest.exported_at).toLocaleString() : 'unknown'
      const instance   = manifest.instance || 'unknown'
      const fileSizeMB = (file.size / 1024 / 1024).toFixed(2)

      previewArea.innerHTML = `
        <div class="restore-preview">
          <h5>Backup Details</h5>
          <div class="restore-row"><span>Exported at</span><span>${esc(exportedAt)}</span></div>
          <div class="restore-row"><span>Source instance</span><span>${esc(instance)}</span></div>
          <div class="restore-row"><span>File size</span><span>${fileSizeMB} MB</span></div>
        </div>
        <div class="restore-preview">
          <h5>Contents</h5>
          <div class="restore-row"><span>Users</span><span>${(t.users||[]).length}</span></div>
          <div class="restore-row"><span>Locations</span><span>${(t.locations||[]).length}</span></div>
          <div class="restore-row"><span>Shift Templates</span><span>${(t.shift_templates||[]).length}</span></div>
          <div class="restore-row"><span>Template Days</span><span>${(t.template_days||[]).length}</span></div>
          <div class="restore-row"><span>Shifts</span><span>${(t.shifts||[]).length}</span></div>
          <div class="restore-row"><span>Preferences</span><span>${(t.app_preferences||[]).length}</span></div>
        </div>
        <div style="padding:10px 14px;background:rgba(0,82,204,.06);border:1px solid rgba(0,82,204,.2);border-radius:var(--r-md);font-size:12px;color:var(--brand);margin-bottom:16px">
          Restore is <strong>additive</strong>: existing records will be updated with values from the backup, and records not present in the backup will not be touched. No data will be deleted.
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-primary" id="backupRestoreConfirmBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.73"/></svg>
            Restore Now
          </button>
          <button class="btn btn-secondary" id="backupRestoreCancelBtn">Cancel</button>
          <span style="font-size:12px;color:var(--text-3)">Export a fresh backup first if unsure</span>
        </div>`

      document.getElementById('backupRestoreCancelBtn').addEventListener('click', () => {
        previewArea.style.display = 'none'
        previewArea.innerHTML = ''
        fileInput.value = ''
      })
      document.getElementById('backupRestoreConfirmBtn').addEventListener('click', () => {
        doRestore(ev.target.result)
      })
    }
    reader.readAsText(file)
  }

  // ── Send restore to server ──────────────────────────────────────────────────
  async function doRestore(rawJson) {
    const previewArea = document.getElementById('backupPreviewArea')
    const resultArea  = document.getElementById('backupResultArea')

    previewArea.innerHTML = `<div class="backup-progress">
      <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".25"/><path d="M21 12a9 9 0 00-9-9"/></svg>
      Restoring — writing to database. Do not close this page…
    </div>`

    try {
      const resp = await fetch('/api/backup/restore', {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain' },
        body:    rawJson,
        credentials: 'include',
      })
      const data = await resp.json()
      if (!resp.ok) throw new Error(data.error || 'Restore failed')

      const s = data.stats || {}
      previewArea.style.display = 'none'
      resultArea.style.display  = 'block'
      resultArea.innerHTML = `
        <div class="backup-result-ok">
          <div style="font-weight:700;color:var(--green,#0a7c41);margin-bottom:10px;font-size:13px">✓ Restore complete</div>
          <div class="restore-preview" style="margin-bottom:0">
            <h5>Restored</h5>
            <div class="restore-row"><span>Users</span><span>${s.users ?? 0}</span></div>
            <div class="restore-row"><span>Locations</span><span>${s.locations ?? 0}</span></div>
            <div class="restore-row"><span>Shift Templates</span><span>${s.templates ?? 0}</span></div>
            <div class="restore-row"><span>Template Days</span><span>${s.templateDays ?? 0}</span></div>
            <div class="restore-row"><span>Shifts</span><span>${s.shifts ?? 0}</span></div>
          </div>
          <div style="margin-top:12px;font-size:12px;color:var(--text-2)">
            Source: ${esc(data.instance || 'unknown')} · Exported ${data.exported_at ? new Date(data.exported_at).toLocaleString() : ''}
          </div>
          <button class="btn btn-secondary btn-sm" onclick="location.reload()" style="margin-top:12px">Reload page</button>
        </div>`
    } catch (err) {
      previewArea.style.display = 'none'
      resultArea.style.display  = 'block'
      resultArea.innerHTML = `<div class="backup-result-err"><strong>Restore failed</strong><br>${esc(err.message)}</div>`
    }
  }
}

async function signOutEverywhere() {
  if (!confirm('This will sign you out on this browser. Continue?')) return
  try {
    await api('/api/auth/logout-all', { method: 'POST' })
    window.location.href = '/login.html'
  } catch (err) { toast(err.message, 'error') }
}

function openDeleteAccountModal() {
  const existing = document.getElementById('deleteAccountModal')
  if (existing) existing.remove()
  const modal = document.createElement('div')
  modal.id = 'deleteAccountModal'
  modal.className = 'modal-overlay'
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" style="color:var(--red)">Delete My Account</h3>
        <button class="modal-close" onclick="document.getElementById('deleteAccountModal').remove()">✕</button>
      </div>
      <div class="modal-body">
        <div style="padding:12px 14px;background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.25);border-radius:var(--r-md);font-size:13px;color:var(--red);margin-bottom:16px;line-height:1.5">
          <strong>This action is permanent and cannot be undone.</strong> Your account, all shifts, and calendar tokens will be deleted immediately.
        </div>
        <div class="form-group">
          <label class="form-label">Confirm your password</label>
          <input type="password" class="form-input" id="deleteAccountPw" placeholder="Enter your password to confirm" autocomplete="current-password">
        </div>
        <div id="deleteAccountErr" style="display:none;color:var(--red);font-size:12px;margin-top:4px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="document.getElementById('deleteAccountModal').remove()">Cancel</button>
        <button class="btn btn-sm" style="background:var(--red);color:#fff;border-color:var(--red)" onclick="doDeleteAccount()">Delete my account</button>
      </div>
    </div>`
  document.body.appendChild(modal)
  modal.classList.add('open')
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove() })
  setTimeout(() => document.getElementById('deleteAccountPw')?.focus(), 50)
}

async function doDeleteAccount() {
  const pw  = document.getElementById('deleteAccountPw').value
  const err = document.getElementById('deleteAccountErr')
  if (!pw) { err.style.display = 'block'; err.textContent = 'Password is required.'; return }
  err.style.display = 'none'
  try {
    await api('/api/auth/account', { method: 'DELETE', body: { password: pw } })
    window.location.href = '/login.html'
  } catch (e) { err.style.display = 'block'; err.textContent = e.message }
}
