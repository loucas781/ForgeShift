<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ForgeShift — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/js/password-policy.js"></script>
  <script>
    // Apply theme immediately to avoid flash
    (function(){
      var t = localStorage.getItem('fs-theme') || 'system'
      if (t === 'system') {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark')
      } else if (t !== 'light') {
        document.documentElement.setAttribute('data-theme', t)
      }
    })()
  </script>
  <style>
    .settings-tabs-wrap { flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border); overflow:hidden; }
    .settings-tabs { display:flex; overflow-x:auto; scrollbar-width:none; padding:0 16px; }
    .settings-tabs::-webkit-scrollbar { display:none; }
    .settings-tab {
      display:flex; align-items:center; gap:6px; padding:11px 14px;
      background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
      font-family:var(--font); font-size:13px; font-weight:500; color:var(--text-3);
      cursor:pointer; white-space:nowrap; flex-shrink:0;
      transition:color var(--t-fast), border-color var(--t-fast);
    }
    .settings-tab:hover { color:var(--text); }
    .settings-tab.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
    .settings-tab svg { width:14px; height:14px; flex-shrink:0; }
    /* Backup panel */
    .backup-section { margin-bottom: 28px; }
    .backup-section:last-child { margin-bottom: 0; }
    .backup-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .backup-meta-item { background: var(--gray-50); border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 10px 12px; }
    .backup-meta-item .bm-val { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--text); line-height: 1; }
    .backup-meta-item .bm-lbl { font-size: 11px; color: var(--text-3); margin-top: 3px; }
    .restore-preview { background: var(--gray-50); border: 1px solid var(--border-2); border-radius: var(--r-lg); padding: 16px; margin-bottom: 16px; }
    .restore-preview h5 { font-size: 12px; font-weight: 700; color: var(--text-2); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; }
    .restore-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--border-2); }
    .restore-row:last-child { border-bottom: none; }
    .restore-row span:first-child { color: var(--text-2); }
    .restore-row span:last-child { font-family: var(--mono); font-weight: 600; color: var(--text); }
    .backup-drop-zone { border: 2px dashed var(--border); border-radius: var(--r-lg); padding: 32px 24px; text-align: center; cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); background: var(--gray-50); }
    .backup-drop-zone:hover, .backup-drop-zone.drag-over { border-color: var(--brand); background: var(--brand-light); }
    .backup-drop-zone svg { color: var(--text-3); margin-bottom: 8px; }
    .backup-drop-zone p { margin: 0; font-size: 13px; color: var(--text-2); }
    .backup-drop-zone small { font-size: 11px; color: var(--text-3); }
    .backup-progress { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--brand-light); border: 1px solid var(--brand); border-radius: var(--r-lg); font-size: 13px; color: var(--brand); }
    .backup-result-ok  { padding: 12px 16px; background: rgba(0,135,90,.08); border: 1px solid rgba(0,135,90,.3); border-radius: var(--r-lg); font-size: 13px; }
    .backup-result-err { padding: 12px 16px; background: rgba(222,53,11,.06); border: 1px solid rgba(222,53,11,.25); border-radius: var(--r-lg); font-size: 13px; color: var(--red,#de350b); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
    /* 2FA */
    .twofa-status { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--gray-50); border:1px solid var(--border-2); border-radius:var(--r-lg); margin-bottom:16px; }
    .twofa-enabled  { color: var(--green); }
    .twofa-disabled { color: var(--text-3); }
    .qr-wrap { display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-bottom:16px; padding:16px; background:var(--gray-50); border:1px solid var(--border-2); border-radius:var(--r-lg); }
    .qr-wrap canvas, .qr-wrap img { border-radius:var(--r-md); }
    .settings-panel { display:none; width:100%; max-width:960px; min-width:0; padding:24px; }
    #panel-team { width:100%; max-width:960px; min-width:0; }
    #settingsPanelsWrap { width:100%; min-width:0; overflow-x:hidden; padding-bottom:calc(var(--mobile-ui-clearance) + var(--safe-bottom)); }
    .settings-panel.active { display:block; }
    .section-card { margin-bottom:20px; }
    .pref-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); gap:16px; }
    .pref-row:last-child { border-bottom:none; }
    .pref-info { flex:1; min-width:0; }
    .pref-info strong { display:block; font-size:13px; font-weight:600; margin-bottom:2px; }
    .pref-info span { display:block; font-size:12px; color:var(--text-3); line-height:1.4; }
    .member-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .member-row:last-child { border-bottom:none; }
    .member-info { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
    .member-actions { display:flex; gap:6px; flex-wrap:wrap; padding-top:6px; padding-left:48px; width:100%; }
    .team-member-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .team-member-name { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-weight:600; font-size:13px; }
    .team-member-email,
    .team-modal-user-email { font-size:12px; color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .team-section-actions { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .team-export-grid { display:grid; grid-template-columns:1fr 1fr auto auto; gap:12px; align-items:end; }
    .team-export-grid > div { min-width:0; }
    #panel-team .team-export-card input[type="date"] {
      min-height: 44px;
      line-height: 1.4;
      -webkit-appearance: none;
      appearance: none;
    }
    #panel-team .team-export-card input[type="date"]::-webkit-date-and-time-value {
      min-height: 1.4em;
      text-align: left;
    }
    #panel-team .team-export-card input[type="date"]::-webkit-datetime-edit {
      display: inline-flex;
      align-items: center;
      min-height: 1.4em;
      padding: 0;
    }
    .team-role-tab { display:inline-flex; align-items:center; gap:6px; min-width:max-content; }
    .team-layout-grid,
    .team-layout-grid > div,
    #panel-team .card,
    #panel-team .card-body,
    #panel-team #roleTabBar,
    #panel-team #teamList,
    #panel-team #teamsListEl,
    #panel-team #tmplGroupsListEl {
      width:100%;
      max-width:100%;
      min-width:0;
      box-sizing:border-box;
    }
    #roleTabBar {
      overflow-y: hidden;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
      overscroll-behavior-y: none;
    }
    @media(max-width:820px){
      #panel-team { max-width: 100%; }
      #panel-team .team-layout-grid { grid-template-columns: minmax(0, 1fr) !important; }
      #panel-team .team-permissions-panel { position: static !important; top: auto !important; }
      #panel-team .team-member-header {
        flex-direction: row;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      #panel-team .member-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 10px 12px;
      }
      #panel-team .member-info { width: 100%; min-width: 0; }
      #panel-team .team-member-status {
        width: auto;
        min-width: max-content;
        justify-content: flex-end !important;
        align-self: start;
      }
      #panel-team .member-actions {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        padding-left: 0;
        padding-top: 0;
        width: 100%;
        grid-column: 1 / -1;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      #panel-team .member-actions .btn {
        flex: 0 0 auto;
        min-width: 0;
        padding: 5px 8px;
        font-size: 11px;
        white-space: nowrap;
        text-align: left;
      }
      #panel-team .member-actions::-webkit-scrollbar { display: none; }
      #panel-team .team-export-grid { grid-template-columns: minmax(0, 1fr) !important; }
      #panel-team .team-export-action { padding-bottom: 0 !important; }
      #panel-team .team-export-card .card-body { padding: 20px; }
      #panel-team .team-export-card .form-input,
      #panel-team .team-export-card .form-select {
        padding: 8px 12px;
        min-height: 40px;
      }
      #panel-team .team-member-email,
      #panel-team .team-modal-user-email { white-space: normal; overflow-wrap: anywhere; }
      #panel-team .card-body { padding: 16px; }
    }
    .theme-grid { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
    .theme-option {
      display:flex; flex-direction:column; align-items:center; gap:8px;
      padding:12px 16px; border:2px solid var(--border); border-radius:var(--r-lg);
      background:var(--surface-2); cursor:pointer; min-width:80px;
      transition:border-color var(--t-fast), background var(--t-fast);
    }
    .theme-option:hover { border-color:var(--brand); }
    .theme-option.active { border-color:var(--brand); background:var(--brand-light); }
    .theme-option span { font-size:12px; font-weight:600; color:var(--text-2); }
    .theme-option.active span { color:var(--brand); }
    .theme-swatch { width:44px; height:30px; border-radius:6px; border:1px solid var(--border); }
    .policy-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); gap:12px; }
    .policy-row:last-child { border-bottom:none; }
    .copy-url-row { display:flex; gap:8px; }
    .copy-url-row input { flex:1; font-size:11px; font-family:var(--mono); }
    /* Mobile select — hidden on desktop, shown on mobile */
    .settings-mobile-select {
      display: none;
    }
    @media(max-width:600px){
      .settings-tabs { display: none; }
      .settings-mobile-select {
        display: block;
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 500;
        font-family: var(--font);
        color: var(--text);
        background: var(--surface);
        border: none;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        outline: none;
        cursor: pointer;
        -webkit-appearance: auto;
        appearance: auto;
      }
      .settings-tab { padding: 10px 10px; font-size: 12px; }
      .member-actions { padding-left:0; }

      /* Settings panels get proper padding on mobile */
      .settings-panel { width: 100%; max-width: 100%; padding: 16px; }
      #panel-team { max-width: 100%; }

      /* Pref rows — stack label and control vertically on very small screens */
      .pref-row { flex-wrap: wrap; gap: 10px; }
      .pref-row .pref-info { min-width: 0; width: 100%; }

      /* Member rows — keep horizontal but allow wrapping gracefully */
      .member-row { align-items: flex-start; }
      #panel-team .team-section-actions .btn { width: 100%; justify-content: center; }

      /* Copy URL row — stack on mobile so the input + button don't get crushed */
      .copy-url-row { flex-direction: column; gap: 8px; }
      .copy-url-row input { width: 100%; font-size: 12px; }
      .copy-url-row .btn { width: 100%; justify-content: center; }

      /* 2-column grids collapse to single column */
      [style*="grid-template-columns:1fr 1fr"],
      [style*="grid-template-columns: 1fr 1fr"] {
        grid-template-columns: 1fr !important;
      }

      /* Invite form grid — stack name + email */
      #panel-team .form-group[style*="grid-column:1/-1"] { grid-column: unset; }
      /* Stack team layout to single column on narrow screens */
      #panel-team .team-layout-grid { grid-template-columns: minmax(0, 1fr) !important; }
      #panel-team { overflow-x: hidden; }

      /* Role tab bar: scroll horizontally instead of clipping on narrow screens */
      #roleTabBar { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      #roleTabBar::-webkit-scrollbar { display: none; }

      /* Export Shifts grid — stack all fields to single column */
      #panel-team [style*="grid-template-columns:1fr 1fr auto auto"] { grid-template-columns: 1fr !important; }

      /* Card headers with buttons — allow wrapping */
      .card-header { flex-wrap: wrap; gap: 8px; }

      /* Backup meta grid — 2 columns max on mobile */
      .backup-meta { grid-template-columns: repeat(2, 1fr) !important; }

      /* Prevent long monospace strings (URLs, tokens) from overflowing */
      .form-input[readonly], code { word-break: break-all; }

      /* Theme grid — 2 cols on mobile */
      .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .theme-option { min-width: 0; }

      /* Button groups in settings — wrap and full width where needed */
      .policy-row { flex-wrap: wrap; }

      /* Audit log table — allow horizontal scroll */
      #panel-audit .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

      /* iCal action buttons — stack on mobile */
      #icalContent [style*="display:flex;gap:8px;flex-wrap:wrap"] { flex-direction: column; }
      #icalContent [style*="display:flex;gap:8px;flex-wrap:wrap"] .btn { width: 100%; justify-content: center; }

      /* SMTP grid — full width on mobile */
      #panel-email [style*="display:grid"] { grid-template-columns: 1fr !important; }
      #panel-email [style*="grid-column:1/-1"] { grid-column: unset !important; }

      /* Security / features pref rows with choice buttons — wrap the button group */
      [style*="display:flex;gap:4px"] .pref-choice-btn,
      [style*="display:flex;gap:6px"] .pref-choice-btn { padding: 5px 10px; font-size: 11px; }

      /* Ensure modal footer buttons don't overflow */
      .modal-footer { flex-wrap: wrap; }
      .modal-footer .btn { flex: 1; min-width: 0; justify-content: center; }
    }
    .tl-desc-toolbar {
      display: flex; gap: 2px; padding: 4px 6px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-bottom: none; border-radius: var(--r-md) var(--r-md) 0 0;
    }
    .tl-desc-toolbar button {
      padding: 3px 8px; border: none; background: none; cursor: pointer;
      border-radius: 4px; font-family: inherit; font-size: 12px;
      color: var(--text-2); transition: background .1s, color .1s;
    }
    .tl-desc-toolbar button:hover { background: var(--border); color: var(--text-1); }
    .tl-desc-toolbar button.active { background: var(--brand); color: #fff; }
    .tl-desc-toolbar .tl-desc-divider { width: 1px; background: var(--border); margin: 3px 2px; }
    .tl-desc-editor {
      width: 100%; min-height: 80px; max-height: 220px; overflow-y: auto;
      padding: 8px 12px; font-size: 13px; font-family: inherit; line-height: 1.6;
      border: 1px solid var(--border); border-radius: 0 0 var(--r-md) var(--r-md);
      background: var(--surface); color: var(--text-1); outline: none;
      box-sizing: border-box;
    }
    .tl-desc-editor:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .tl-desc-editor:empty::before {
      content: attr(data-placeholder); color: var(--text-3); pointer-events: none;
    }
    .tl-desc-editor ul { margin: 4px 0; padding-left: 20px; }
    .tl-desc-editor li { margin: 2px 0; }
    .tl-desc-editor p { margin: 0 0 4px; }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <div class="app-body" style="flex:1;min-height:0;flex-direction:column;overflow:hidden">
    <div class="settings-tabs-wrap">
      <!-- Desktop: horizontal tab bar -->
      <div class="settings-tabs" id="settingsTabs"></div>
      <!-- Mobile: native select picker -->
      <select class="settings-mobile-select" id="settingsMobileSelect" onchange="showTab(this.value)"></select>
    </div>
    <div style="flex:1;overflow-y:auto" id="settingsPanelsWrap">
      <!-- Panels injected by JS -->
    </div>
  </div>
</div>


<!-- Edit User Modal -->
<div class="modal-overlay" id="editUserModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Edit User</h3>
      <button class="modal-close" onclick="document.getElementById('editUserModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Full name</label><input type="text" class="form-input" id="euName"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="euEmail"></div>
      <div class="form-group"><label class="form-label">Role</label>
        <select class="form-select" id="euRole"><option value="member">Member</option><option value="shift_lead">Shift Lead</option><option value="manager">Manager</option><option value="admin">Admin</option></select>
      </div>
      <div class="form-group">
        <div style="display:flex;align-items:center;gap:10px">
          <label class="toggle"><input type="checkbox" id="euActive" checked><span class="toggle-slider"></span></label>
          <span class="form-label" style="margin:0">Account active</span>
        </div>
      </div>
      <!-- Set Password toggle -->
      <div class="form-group" style="border-top:1px solid var(--border);padding-top:14px;margin-top:4px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <label class="toggle"><input type="checkbox" id="euSetPwToggle" onchange="toggleEuSetPw()"><span class="toggle-slider"></span></label>
          <span class="form-label" style="margin:0">Set new password for this user</span>
        </div>
        <div id="euSetPwFields" style="display:none">
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label">New password</label>
            <div style="position:relative">
              <input type="password" class="form-input" id="euNewPw" placeholder="••••••••" style="padding-right:40px" oninput="updatePasswordIndicator(euPwIndicator, this.value)">
              <button type="button" onclick="(function(){var i=document.getElementById('euNewPw');i.type=i.type==='text'?'password':'text'})()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px">
                <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
              </button>
            </div>
            <div id="euPwIndicatorWrap" style="margin-top:8px"></div>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label">Confirm password</label>
            <input type="password" class="form-input" id="euNewPw2" placeholder="••••••••">
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('editUserModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditUser()">Save</button>
    </div>
  </div>
</div>

<!-- Location Modal -->
<!-- Task List Modal -->
<div class="modal-overlay" id="taskListModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="taskListModalTitle">Add Task List</h3>
      <button class="modal-close" onclick="closeTaskListModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" id="tlName" placeholder="e.g. Monitoring Round"></div>
      <div class="form-group">
        <label class="form-label">Description <span style="color:var(--text-3);font-weight:400">(optional)</span></label>
        <div class="tl-desc-toolbar">
          <button type="button" id="tlDescBold" onclick="_tlDescCmd('bold')" title="Bold"><b>B</b></button>
          <button type="button" id="tlDescUnderline" onclick="_tlDescCmd('underline')" title="Underline"><u>U</u></button>
          <div class="tl-desc-divider"></div>
          <button type="button" id="tlDescList" onclick="_tlDescCmd('insertUnorderedList')" title="Bullet list">• List</button>
        </div>
        <div id="tlDescEditor" class="tl-desc-editor" contenteditable="true"
          data-placeholder="Describe what this task list involves…"
          oninput="_tlDescUpdateToolbar()" onkeyup="_tlDescUpdateToolbar()" onmouseup="_tlDescUpdateToolbar()"></div>
      </div>
      <div class="form-group"><label class="form-label">Organisation <span style="color:var(--text-3);font-weight:400">(optional)</span></label><select class="form-select" id="tlOrg"><option value="">— None (visible to all) —</option></select></div>
      <div class="form-group"><label class="form-label">Linked location <span style="color:var(--text-3);font-weight:400">(optional)</span></label><select class="form-select" id="tlLocation"><option value="">— None —</option></select></div>
      <div class="form-group"><label class="form-label">Label <span style="color:var(--text-3);font-weight:400">(optional — e.g. new, old, archived)</span></label><input type="text" class="form-input" id="tlLabel" placeholder="e.g. new, old, archived"></div>
      <div class="form-group"><label class="form-label">Colour</label><div id="tlColourPicker"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeTaskListModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTaskList()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="locModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="locModalTitle">Add Location</h3>

// ── Avatar helper — mirrors shell.js avatarEl ─────────────────────────────────
// Returns an outerHTML string for an avatar element that shows the photo if
// available, or falls back to an initials badge.
// size: '' = default (32px), 'sm' = 22px, 'xs' = 20px, 'md' = 28px
function _avatarHTML(user, size) {
  const dims = { sm: 22, xs: 20, md: 28, lg: 40 }
  const px   = dims[size] || 32
  const fs   = Math.round(px * 0.38)
  const base = `border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:${px}px;height:${px}px;font-size:${fs}px;font-weight:700;color:#fff`
  if (user && user.avatar) {
    return `<div class="avatar" style="${base};background:${user.color||'#4f46e5'}"><img src="${user.avatar}" alt="${user.name||''}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit"></div>`
  }
  const initials = user ? (user.initials || (user.name||'?').slice(0,2).toUpperCase()) : '?'
  return `<div class="avatar" style="${base};background:${(user&&user.color)||'#4f46e5'}">${initials}</div>`
}

function showTab(id) {
  document.querySelectorAll('.settings-panel').forEach(p => p.classList.remove('active'))
  document.querySelectorAll('.settings-tab').forEach(b => b.classList.remove('active'))
  const panel = document.getElementById('panel-' + id)
  const btn   = document.getElementById('tab-btn-' + id)
  if (panel) panel.classList.add('active')
  if (btn)   btn.classList.add('active')
  // Keep mobile select in sync
  const sel = document.getElementById('settingsMobileSelect')
  if (sel) sel.value = id
  window.location.hash = id
}

function pickTheme(theme) {
  // Apply immediately
  if (theme === 'system') {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : '')
    if (!prefersDark) document.documentElement.removeAttribute('data-theme')
  } else if (theme === 'light') {
    document.documentElement.removeAttribute('data-theme')
  } else {
    document.documentElement.setAttribute('data-theme', theme)
  }
  localStorage.setItem('fs-theme', theme)
  // Update UI
  document.querySelectorAll('.theme-option').forEach(el => el.classList.remove('active'))
  document.getElementById('themeOpt-' + theme)?.classList.add('active')
  document.getElementById('currentThemeName').textContent = theme
  toast('Theme set to ' + theme, 'success', 1500)
}

// ── Holiday live fetch ────────────────────────────────────────────────────────
async function loadHolidayStatus() {
  if (cfg?.user?.role !== 'admin') return
  const el = document.getElementById('holidayFetchStatus')
  if (!el) return
  try {
    const data = await api('/api/holidays/status')
    const ts   = data.lastFetched ? new Date(data.lastFetched) : null
    const tsStr = ts
      ? ts.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) +
        ' at ' + ts.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' })
      : null
    el.innerHTML = tsStr
      ? `Last fetched: <strong>${tsStr}</strong> &mdash; ${data.storedDates.toLocaleString()} dates stored offline`
      : `No data fetched yet &mdash; built-in calculations active (covers up to 2035)`
  } catch (_) { /* non-critical */ }
}

async function fetchHolidayData() {
  const btn = document.getElementById('fetchHolidaysBtn')
  const el  = document.getElementById('holidayFetchStatus')
  if (!btn || !el) return
  btn.disabled = true
  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;animation:spin 1s linear infinite"><path d="M1 8a7 7 0 1 0 7-7"/><path d="M1 3v5h5"/></svg> Fetching…`
  el.innerHTML = '<span style="color:var(--text-3)">Contacting official sources…</span>'
  try {
    const data = await api('/api/holidays/fetch', { method: 'POST' })
    const ts   = new Date(data.lastFetched)
    const tsStr = ts.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) +
      ' at ' + ts.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' })
    const msg = data.newEvents > 0
      ? `Added ${data.newEvents} new date${data.newEvents !== 1 ? 's' : ''}`
      : 'Already up to date'
    el.innerHTML = `<span style="color:var(--success,#22c55e)">✓ ${msg}</span> &mdash; ${data.storedDates.toLocaleString()} dates stored &mdash; Last fetched: <strong>${tsStr}</strong>`
    if (data.errors?.length) {
      el.innerHTML += `<br><span style="color:var(--warning,#f59e0b);font-size:11px">⚠ Some sources could not be reached: ${data.errors.map(e=>escHtml(e.source)).join(', ')}</span>`
    }
    toast(`Holiday data updated — ${msg.toLowerCase()}`, 'success')
  } catch (err) {
    el.innerHTML = `<span style="color:var(--danger,#ef4444)">✗ Fetch failed: ${escHtml(err.message)}</span>`
    toast('Failed to fetch holiday data', 'error')
  } finally {
    btn.disabled = false
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M1 8a7 7 0 1 0 7-7"/><path d="M1 3v5h5"/></svg> Fetch latest data`
  }
}

async function clearHolidayData() {
  if (!confirm('Remove all fetched holiday data? The built-in calculated data will continue to work, but any real dates from official sources will be cleared.')) return
  try {
    await api('/api/holidays/overrides', { method: 'DELETE' })
    document.getElementById('holidayFetchStatus').innerHTML = 'Fetched data cleared &mdash; built-in calculations active'
    toast('Fetched holiday data cleared', 'success')
  } catch (err) {
    toast('Failed to clear data', 'error')
  }
}

function pickWeekStart(day) {
  document.getElementById('wsd-mon')?.classList.toggle('active', day === 1)
  document.getElementById('wsd-sun')?.classList.toggle('active', day === 0)
  window._pendingWeekStart = day
}

function pickDefaultView(v) {
  document.getElementById('dv-month')?.classList.toggle('active', v === 'month')
  document.getElementById('dv-week')?.classList.toggle('active', v === 'week')
  window._pendingDefaultView = v
}

async function savePrefsPanel() {
  // Read all controls
  const wsd = window._pendingWeekStart !== undefined
    ? window._pendingWeekStart
    : (document.getElementById('wsd-sun')?.classList.contains('active') ? 0 : 1)
  const dv = window._pendingDefaultView !== undefined
    ? window._pendingDefaultView
    : (document.getElementById('dv-week')?.classList.contains('active') ? 'week' : 'month')

  const holidays = HOLIDAY_SETS
    .filter(s => document.getElementById('hol-' + s.id)?.checked)
    .map(s => s.id)

  const updates = {
    weekStartDay:      wsd,
    defaultView:       dv,
    showWeekNumbers:   document.getElementById('prefShowWkNums')?.checked ?? false,
    compactChips:      document.getElementById('prefCompact')?.checked ?? false,
    defaultShiftStart: document.getElementById('prefDefaultStart')?.value || '',
    defaultShiftEnd:   document.getElementById('prefDefaultEnd')?.value || '',
    holidays,
  }

  // Clear pending
  delete window._pendingWeekStart
  delete window._pendingDefaultView

  await savePrefs(updates)
  toast('Preferences saved', 'success')
}

async function loadIcal() {
  try {
    const data = await api('/api/ical/token')
    document.getElementById('icalLoading').style.display = 'none'
    document.getElementById('icalContent').style.display = 'block'
    document.getElementById('icalUrl').value = data.feedUrl
    document.getElementById('icalDownload').href = data.feedUrl
  } catch {
    document.getElementById('icalLoading').textContent = 'Failed to load iCal token'
  }
}

function copyIcal() {
  navigator.clipboard.writeText(document.getElementById('icalUrl').value).then(() => toast('URL copied!', 'success'))
}
async function regenerateIcal() {
  if (!confirm('Regenerate iCal token? Your current calendar subscription will stop working and you will need to re-subscribe.')) return
  await api('/api/ical/token', { method: 'DELETE' })
  await loadIcal()
  toast('Token regenerated', 'success')
}

async function openCreateMyTeam() {
  const name = prompt('Team name:')
  if (!name?.trim()) return
  try {
    await api('/api/teams', { method: 'POST', body: { name: name.trim() } })
    await loadMyTeams()
    toast('Team created', 'success')
  } catch (err) { toast(err.message, 'error') }
}

async function openEditMyTeam(id) {
  const t = myTeams.find(x => x.id === id); if (!t) return
  const name = prompt('Rename team:', t.name)
  if (!name?.trim() || name.trim() === t.name) return
  try {
    await api(`/api/teams/${id}`, { method: 'PATCH', body: { name: name.trim() } })
    await loadMyTeams()
    toast('Team renamed', 'success')
  } catch (err) { toast(err.message, 'error') }
}

async function deleteMyTeam(id, name) {
  if (!confirm(`Delete team "${name}"?`)) return
  try {
    await api(`/api/teams/${id}`, { method: 'DELETE' })
    await loadMyTeams()
    toast('Team deleted', 'success')
  } catch (err) { toast(err.message, 'error') }
}

function openAddMember(teamId) {
  const t = myTeams.find(x => x.id === teamId); if (!t) return
  const currentIds = new Set((t.members || []).map(m => m.id))
  const available = users.filter(u => u.is_active && (u.role === 'member' || u.role === 'shift_lead') && !currentIds.has(u.id) && (!isShiftLead || !u.team_id))
  if (!available.length) { toast('No eligible members to add', 'error'); return }
  const existing = document.getElementById('addMemberModal')
  if (existing) existing.remove()
  const modal = document.createElement('div')
  modal.id = 'addMemberModal'
  modal.className = 'modal-overlay'
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Add Member to "${t.name}"</h3>
        <button class="modal-close" onclick="document.getElementById('addMemberModal').remove()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Member</label>
          <select class="form-input" id="addMemberSelect">
            <option value="">Select a member…</option>
            ${available.map(u => `<option value="${u.id}">${u.name}</option>`).join('')}
          </select>
        </div>
        <div id="addMemberError" style="display:none;color:var(--red);font-size:12px;margin-top:4px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="document.getElementById('addMemberModal').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="doAddMember('${teamId}')">Add member</button>
      </div>
    </div>`
  document.body.appendChild(modal)
  modal.classList.add('open')
  setTimeout(() => document.getElementById('addMemberSelect').focus(), 50)
}

async function doAddMember(teamId) {
  const select = document.getElementById('addMemberSelect')
  const userId = select.value
  if (!userId) {
    const err = document.getElementById('addMemberError')
    err.textContent = 'Please select a member.'
    err.style.display = 'block'
    return
  }
  const userName = select.options[select.selectedIndex].text
  try {
    await api(`/api/teams/${teamId}/members/${userId}`, { method: 'POST' })
    document.getElementById('addMemberModal').remove()
    await loadMyTeams()
    toast(`${userName} added`, 'success')
  } catch (err) {
    const errEl = document.getElementById('addMemberError')
    errEl.textContent = err.message
    errEl.style.display = 'block'
  }
}

async function removeMyTeamMember(teamId, userId) {
  try {

    await loadMyTeams()
    toast('Member removed', 'success')
  } catch (err) { toast(err.message, 'error') }
}

function doAdminCSVExport() {
  const from = document.getElementById('csvFrom')?.value
  const to   = document.getElementById('csvTo')?.value
  const uid  = document.getElementById('csvUser')?.value || 'all'

  const params = new URLSearchParams({ start: from, end: to, user_id: uid })
  window.location.href = '/api/shifts/export/csv?' + params
}

      font-size:13px;font-weight:${active ? '600' : '500'};
      color:${active ? 'var(--blue)' : 'var(--text-2)'};
      border-bottom:2px solid ${active ? 'var(--blue)' : 'transparent'};
      margin-bottom:-1px;transition:color .15s,border-color .15s
    ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">${t.key === 'admin' ? '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' : t.key === 'manager' ? '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><line x1="19" y1="8" x2="23" y2="8"/><line x1="21" y1="6" x2="21" y2="10"/>' : t.key === 'shift_lead' ? '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' : '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'}
      </svg>
      ${t.label} <span class="team-role-tab-count" style="font-size:11px;padding:1px 6px;border-radius:20px;background:${active ? 'rgba(59,130,246,.15)' : 'var(--surface-2)'};color:${active ? 'var(--blue)' : 'var(--text-3)'}">${roleCounts[t.key]}</span>
    </button>`
  }).join('')

  const current = tabs.find(t => t.key === activeRoleTab)
  if (desc && current) desc.textContent = current.desc
  const total = users.length
  if (title) title.textContent = `Team Members (${total})`
}

    el.innerHTML = `<p style="color:var(--text-3);font-size:13px;padding:8px 0">No ${showInactive ? '' : 'active '}${activeRoleTab === 'shift_lead' ? 'shift leads' : activeRoleTab === 'manager' ? 'managers' : activeRoleTab + 's'} yet.</p>`

  el.innerHTML = filtered.map(u => `

      <div class="member-info">

        <div style="min-width:0">

          <div class="team-member-email">${u.email}</div>

          <div style="font-weight:600;color:var(--text);margin-bottom:6px">⚠️ Temporary Password — share securely, shown once only</div>
          <div style="display:flex;align-items:center;gap:8px">
            <code style="flex:1;font-size:14px;font-family:var(--mono);padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);word-break:break-all;color:var(--text);letter-spacing:.04em">${escHtml(r.tempPassword)}</code>
            <button id="copyTempPwBtn" class="btn btn-secondary btn-sm" style="flex-shrink:0">Copy</button>
          </div>
          <div style="font-size:11px;color:var(--text-3);margin-top:6px">The user should change this password after first login.</div>
        </div>`
      // Attach copy handler via closure — password never stored in DOM attributes
      const copyBtn = document.getElementById('copyTempPwBtn')
      if (copyBtn) {
        const pw = r.tempPassword
        copyBtn.addEventListener('click', () => {
          const reset = () => { copyBtn.textContent = 'Copy' }
          if (navigator.clipboard) {
            navigator.clipboard.writeText(pw)
              .then(() => { copyBtn.textContent = '✓ Copied'; setTimeout(reset, 2000) })
              .catch(() => { copyBtn.textContent = 'Failed'; setTimeout(reset, 2000) })
          } else {
            const t = document.createElement('textarea')
            t.value = pw; t.style.position = 'fixed'; t.style.opacity = '0'
            document.body.appendChild(t); t.focus(); t.select()
            document.execCommand('copy')
            document.body.removeChild(t)
            copyBtn.textContent = '✓ Copied'; setTimeout(reset, 2000)
          }
        })
      }
    }
    if (submitBtn) submitBtn.style.display = 'none'
    // Add "Invite another" reset
    const anotherBtn = document.createElement('button')
    anotherBtn.className = 'btn btn-secondary btn-sm'
    anotherBtn.textContent = '+ Invite another'
    anotherBtn.style.marginTop = '10px'
    anotherBtn.onclick = () => {
      resultEl.style.display = 'none'
      resultEl.innerHTML = ''
      if (submitBtn) submitBtn.style.display = ''
      anotherBtn.remove()
    }
    resultEl.appendChild(anotherBtn)
    // Clear fields
    if (document.getElementById('iName')) document.getElementById('iName').value = ''
    if (document.getElementById('iEmail')) document.getElementById('iEmail').value = ''
    toast('User created', 'success')
    await loadUsers()
    renderTeamList()
  } catch (err) { toast(err.message, 'error') }
}

let activeTaskListOrgTab = 'all'
let activeTaskListLabelTab = 'all'

async function loadTaskLists() {
  try { taskLists = await api('/api/tasks/lists') } catch { taskLists = [] }
}

function renderTaskListOrgTabs() {
  const bar = document.getElementById('taskListOrgTabBar')
  if (!bar) return
  const orgsWithLists = orgs.filter(o => taskLists.some(t => t.org_id === o.id))
  const hasUnassigned = taskLists.some(t => !t.org_id)
  if (orgsWithLists.length === 0 && !hasUnassigned) { bar.style.display = 'none'; return }
  bar.style.display = 'flex'

  const tabs = [{ key: 'all', label: 'All', count: taskLists.length }]
  if (hasUnassigned) tabs.push({ key: 'unassigned', label: 'No Organisation', count: taskLists.filter(t => !t.org_id).length })
  orgsWithLists.forEach(o => tabs.push({ key: o.id, label: o.name, count: taskLists.filter(t => t.org_id === o.id).length }))

  if (!tabs.find(t => t.key === activeTaskListOrgTab)) activeTaskListOrgTab = 'all'

  bar.innerHTML = tabs.map(t => {
    const active = t.key === activeTaskListOrgTab
    return `<button onclick="switchTaskListOrgTab('${t.key}')" style="
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 14px;border:none;background:none;cursor:pointer;
      font-size:13px;font-weight:${active ? '600' : '500'};
      color:${active ? 'var(--blue)' : 'var(--text-2)'};
      border-bottom:2px solid ${active ? 'var(--blue)' : 'transparent'};
      margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap
    ">${escHtml(t.label)} <span style="font-size:11px;padding:1px 6px;border-radius:20px;background:${active ? 'rgba(59,130,246,.15)' : 'var(--surface-2)'};color:${active ? 'var(--blue)' : 'var(--text-3)'}">${t.count}</span></button>`
  }).join('')
}

function switchTaskListOrgTab(key) {
  activeTaskListOrgTab = key
  renderTaskListOrgTabs()
  renderTaskListLabelTabs()
  renderTaskListsTable()
}

function renderTaskListLabelTabs() {
  const bar = document.getElementById('taskListLabelTabBar')
  if (!bar) return
  // Determine which lists are visible under the current org filter
  let orgFiltered = taskLists
  if (activeTaskListOrgTab === 'unassigned') orgFiltered = taskLists.filter(t => !t.org_id)
  else if (activeTaskListOrgTab !== 'all') orgFiltered = taskLists.filter(t => t.org_id === activeTaskListOrgTab)

  const labels = [...new Set(orgFiltered.map(t => t.label).filter(Boolean))].sort()
  if (labels.length === 0) { bar.style.display = 'none'; return }
  bar.style.display = 'flex'

  if (!['all', ...labels].includes(activeTaskListLabelTab)) activeTaskListLabelTab = 'all'

  const tabs = [{ key: 'all', label: 'All labels', count: orgFiltered.length }, ...labels.map(l => ({ key: l, label: l, count: orgFiltered.filter(t => t.label === l).length }))]
  bar.innerHTML = tabs.map(t => {
    const active = t.key === activeTaskListLabelTab
    return `<button onclick="switchTaskListLabelTab('${escHtml(t.key)}')" style="
      display:inline-flex;align-items:center;gap:6px;
      padding:7px 14px;border:none;background:none;cursor:pointer;
      font-size:12px;font-weight:${active ? '600' : '500'};
      color:${active ? 'var(--blue)' : 'var(--text-2)'};
      border-bottom:2px solid ${active ? 'var(--blue)' : 'transparent'};
      margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap
    ">${escHtml(t.label)} <span style="font-size:11px;padding:1px 6px;border-radius:20px;background:${active ? 'rgba(59,130,246,.15)' : 'var(--surface-3,var(--surface-2))'};color:${active ? 'var(--blue)' : 'var(--text-3)'}">${t.count}</span></button>`
  }).join('')
}

function switchTaskListLabelTab(key) {
  activeTaskListLabelTab = key
  renderTaskListLabelTabs()
  renderTaskListsTable()
}

function _renderTaskListRows(lists) {
  return lists.map(t => {
    const description = t.description
      ? `<span title="${escHtml(t.description)}">${escHtml(t.description.length > 80 ? t.description.slice(0, 80) + '…' : t.description)}</span>`
      : '<span style="color:var(--text-3)">—</span>'
    const safeName = JSON.stringify(t.name)
    return `<tr>
      <td style="font-weight:600">${escHtml(t.name)}</td>
      <td style="font-size:13px">${t.org_name ? `<span class="badge badge-gray">${escHtml(t.org_name)}</span>` : '<span style="color:var(--text-3)">—</span>'}</td>
      <td style="color:var(--text-2);font-size:13px;max-width:260px">${description}</td>
      <td>${t.location_name ? `<span style="display:inline-flex;align-items:center;gap:6px">${renderInlineColourSwatch(t.location_color, { size: 10, title: pickColourValue(t.location_color) || 'No colour' })}${escHtml(t.location_name)}</span>` : '<span style="color:var(--text-3)">—</span>'}</td>
      <td>${t.label ? `<span class="badge badge-gray">${escHtml(t.label)}</span>` : '<span style="color:var(--text-3)">—</span>'}</td>
      <td>${renderInlineColourSwatch(t.color, { size: 20, title: pickColourValue(t.color) || 'No colour' })}</td>
      <td><div style="display:flex;gap:4px">
        <button class="btn btn-ghost btn-sm" onclick="openEditTaskList('${t.id}')">Edit</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick='deleteTaskList("${t.id}", ${safeName})'>Delete</button>
      </div></td>
    </tr>`
  }).join('')
}

function renderTaskListsTable() {
  const tbody = document.getElementById('taskListsBody')
  if (!tbody) return
  if (!taskLists.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-3);padding:24px">No task lists yet — add one to get started</td></tr>'
    return
  }
  let visible = taskLists
  if (activeTaskListOrgTab === 'unassigned') visible = visible.filter(t => !t.org_id)
  else if (activeTaskListOrgTab !== 'all') visible = visible.filter(t => t.org_id === activeTaskListOrgTab)
  if (activeTaskListLabelTab !== 'all') visible = visible.filter(t => t.label === activeTaskListLabelTab)
  if (!visible.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:24px">No task lists match the selected filters</td></tr>'
    return
  }
  tbody.innerHTML = _renderTaskListRows(visible)
}

function renderLocOrgTabs() {
  const bar = document.getElementById('locOrgTabBar')
  if (!bar) return
  const orgsWithLocs = orgs.filter(o => locations.some(l => l.org_id === o.id))
  const hasUnassigned = locations.some(l => !l.org_id)
  if (orgsWithLocs.length === 0 && !hasUnassigned) { bar.style.display = 'none'; return }
  bar.style.display = 'flex'

  const tabs = [{ key: 'all', label: 'All', count: locations.length }]
  if (hasUnassigned) tabs.push({ key: 'unassigned', label: 'No Organisation', count: locations.filter(l => !l.org_id).length })
  orgsWithLocs.forEach(o => tabs.push({ key: o.id, label: o.name, count: locations.filter(l => l.org_id === o.id).length }))

  if (!tabs.find(t => t.key === activeLocOrgTab)) activeLocOrgTab = 'all'

  bar.innerHTML = tabs.map(t => {
    const active = t.key === activeLocOrgTab
    return `<button onclick="switchLocOrgTab('${t.key}')" style="
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 14px;border:none;background:none;cursor:pointer;
      font-size:13px;font-weight:${active ? '600' : '500'};
      color:${active ? 'var(--blue)' : 'var(--text-2)'};
      border-bottom:2px solid ${active ? 'var(--blue)' : 'transparent'};
      margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap
    ">${escHtml(t.label)} <span style="font-size:11px;padding:1px 6px;border-radius:20px;background:${active ? 'rgba(59,130,246,.15)' : 'var(--surface-2)'};color:${active ? 'var(--blue)' : 'var(--text-3)'}">${t.count}</span></button>`
  }).join('')
}

function switchLocOrgTab(key) {
  activeLocOrgTab = key
  renderLocOrgTabs()
  renderLocsTable()
}

function renderLocsTable() {
  const tbody = document.getElementById('locsBody')
  if (!tbody) return
  if (!locations.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:24px">No locations yet</td></tr>'; return }
  let visible = locations
  if (activeLocOrgTab === 'unassigned') visible = locations.filter(l => !l.org_id)
  else if (activeLocOrgTab !== 'all') visible = locations.filter(l => l.org_id === activeLocOrgTab)
  if (!visible.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:24px">No locations in this organisation</td></tr>'; return }
  tbody.innerHTML = visible.map(l => `<tr>
    <td style="font-weight:600">${escHtml(l.name)}</td>
    <td style="color:var(--text-3)">${l.address ? escHtml(l.address) : '—'}</td>
    <td>${renderInlineColourSwatch(l.color, { size: 20, title: pickColourValue(l.color) || 'No colour' })}</td>
    <td>${l.org_name ? `<span class="badge badge-gray" style="white-space:nowrap">${escHtml(l.org_name)}</span>` : '<span style="font-size:12px;color:var(--text-3)">Open to all</span>'}</td>
    <td><div style="display:flex;gap:4px">
      <button class="btn btn-ghost btn-sm" onclick="openEditLoc('${l.id}')">Edit</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="deleteLoc('${l.id}','${escHtml(l.name).replace(/'/g,"\\'")}')">Delete</button>
    </div></td>
  </tr>`).join('')
}

async function renderPasskeys() {
  const area = document.getElementById('passkeys-area')
  if (!area) return

  // Browser support check
  if (!window.PublicKeyCredential) {
    area.innerHTML = `
      <div style="padding:12px 14px;background:var(--gray-50);border:1px solid var(--border-2);border-radius:var(--r-lg);display:flex;gap:12px;align-items:flex-start">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="var(--orange)" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p style="margin:0;font-size:13px;color:var(--text-2);line-height:1.5">
          Passkeys require a modern browser (Chrome 108+, Safari 16+, Firefox 119+) served over HTTPS.
          Your current browser or connection does not support passkeys.
        </p>
      </div>`
    return
  }

  async function loadAndRender() {
    try {
      const keys = await api('/api/passkeys')
      const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      const fmt = d => new Date(d).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' })

      const listHtml = keys.length ? keys.map(k => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)" id="passkey-row-${escHtml(k.id)}">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="var(--brand)" stroke-width="1.5" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.78 7.78 5.5 5.5 0 017.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(k.device_name || 'Passkey')}</div>
            <div style="font-size:12px;color:var(--text-3)">Added ${fmt(k.created_at)}</div>
          </div>
          <button class="btn btn-ghost btn-sm" style="color:var(--red);flex-shrink:0" onclick="deletePasskey('${escHtml(k.id)}')">Remove</button>
        </div>`).join('') : `<p style="font-size:13px;color:var(--text-3);margin:0 0 16px">No passkeys registered yet.</p>`

      area.innerHTML = `
        <div id="passkeys-list">${listHtml}</div>
        <button class="btn btn-secondary btn-sm" style="margin-top:${keys.length ? '16px' : '0'}" onclick="addPasskey()">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:6px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add passkey
        </button>`
    } catch (err) {
      area.innerHTML = `<p style="font-size:13px;color:var(--red);margin:0">Failed to load passkeys.</p>`
    }
  }

  window.addPasskey = async function() {
    try {
      const options = await api('/api/passkeys/register-options', { method: 'POST' })

      // Convert base64url strings to ArrayBuffers
      options.challenge = _b64url(options.challenge)
      options.user.id   = _b64url(options.user.id)
      if (options.excludeCredentials) {
        options.excludeCredentials = options.excludeCredentials.map(c => ({ ...c, id: _b64url(c.id) }))
      }

      const credential = await navigator.credentials.create({ publicKey: options })
      if (!credential) return

      const deviceName = await _promptDeviceName()

      await api('/api/passkeys/register-verify', {
        method: 'POST',
        body: {
          deviceName,
          credential: {
            id:    credential.id,
            rawId: _ab2b64url(credential.rawId),
            type:  credential.type,
            response: {
              clientDataJSON:    _ab2b64url(credential.response.clientDataJSON),
              attestationObject: _ab2b64url(credential.response.attestationObject),
            },
          },
        },
      })
      toast('Passkey added', 'success')
      await loadAndRender()
    } catch (err) {
      if (err.name === 'NotAllowedError') return // user cancelled
      toast(err.message || 'Failed to add passkey', 'error')
    }
  }

  window.deletePasskey = async function(id) {
    if (!confirm('Remove this passkey? You will no longer be able to use it to sign in.')) return
    try {
      await api(`/api/passkeys/${encodeURIComponent(id)}`, { method: 'DELETE' })
      toast('Passkey removed', 'success')
      await loadAndRender()
    } catch (err) {
      toast(err.message || 'Failed to remove passkey', 'error')
    }
  }

  await loadAndRender()
}

function _b64url(val) {
  if (!val) return val
  const str = typeof val === 'string' ? val : val
  const base64 = str.replace(/-/g, '+').replace(/_/g, '/')
  const bin = atob(base64)
  const buf = new Uint8Array(bin.length)
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i)
  return buf.buffer
}
function _ab2b64url(buf) {
  const bytes = new Uint8Array(buf)
  let bin = ''
  for (const b of bytes) bin += String.fromCharCode(b)
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '')
}
async function _promptDeviceName() {
  return new Promise(resolve => {
    const name = prompt('Give this passkey a name (e.g. "MacBook Touch ID"):')
    resolve(name && name.trim() ? name.trim() : 'My passkey')
  })
}

  el.style.cssText = `display:block;font-size:13px;padding:10px 12px;border-radius:var(--r-md);margin-top:12px;` +

async function saveSmtp() {
  const pass = document.getElementById('smtpPass').value
  try {
    await api('/api/config/email', { method: 'PATCH', body: {
      smtpHost:     document.getElementById('smtpHost').value.trim(),
      smtpPort:     document.getElementById('smtpPort').value,
      smtpSecure:   document.getElementById('smtpSecure').checked,
      smtpUser:     document.getElementById('smtpUser').value.trim(),
      smtpPass:     pass === '••••••••' ? undefined : pass,
      smtpFromName: document.getElementById('smtpFromName').value.trim(),
      smtpFromAddr: document.getElementById('smtpFromAddr').value.trim(),
    }})
    smtpMsg('✓ SMTP configuration saved.', true)
    toast('SMTP saved', 'success')
    // Refresh the status bar
    renderEmailPanel()
  } catch (err) { smtpMsg(err.message, false) }
}

async function testSmtp() {
  smtpMsg('Sending test email…', true)
  try {
    const r = await api('/api/config/email/test', { method: 'POST' })
    smtpMsg(`✓ Test email sent to ${r.sentTo}`, true)
    toast('Test email sent!', 'success')
  } catch (err) { smtpMsg(`✗ ${err.message}`, false) }
}

async function clearSmtp() {
  if (!confirm('Clear all SMTP configuration? Password reset emails will stop working.')) return
  await api('/api/config/email', { method: 'PATCH', body: { smtpHost: '', smtpUser: '', smtpPass: '', smtpFromName: '', smtpFromAddr: '' }})
  toast('SMTP configuration cleared', 'success')
  renderEmailPanel()
}

function _auditRelTime(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime()
  const s = Math.floor(diff / 1000)
  if (s < 60)   return 'just now'
  const m = Math.floor(s / 60)
  if (m < 60)   return m + 'm ago'
  const h = Math.floor(m / 60)
  if (h < 24)   return h + 'h ago'
  const d = Math.floor(h / 24)
  if (d < 30)   return d + 'd ago'
  const mo = Math.floor(d / 30)
  if (mo < 12)  return mo + 'mo ago'
  return Math.floor(mo / 12) + 'y ago'
}

function _auditDetailText(entry) {
  if (!entry.meta) return ''
  let meta
  try { meta = JSON.parse(entry.meta) } catch { return '' }
  // Show changed fields if present
  if (meta.changed && Array.isArray(meta.changed)) return 'Changed: ' + meta.changed.join(', ')
  // Other notable fields
  const skip = new Set(['by', 'actorId'])
  const parts = Object.entries(meta).filter(([k]) => !skip.has(k)).map(([k, v]) => `${k}: ${v}`)
  return parts.slice(0, 2).join(' · ')
}

let auditOffset = 0
async function reloadAudit() { await loadAudit(0) }
async function loadAudit(offset) {
  auditOffset = offset
  const actionFilter = document.getElementById('auditActionFilter')?.value || ''
  const userFilter   = document.getElementById('auditUserFilter')?.value   || ''
  try {
    const params = new URLSearchParams({ limit: 30, offset })
    if (actionFilter) params.set('action',   actionFilter)
    if (userFilter)   params.set('actor_id', userFilter)
    const data = await api(`/api/audit?${params}`)

    // Populate user filter on first load
    if (offset === 0 && data.actors?.length) {
      const sel = document.getElementById('auditUserFilter')
      if (sel && sel.options.length <= 1) {
        data.actors.forEach(a => {
          const opt = document.createElement('option')
          opt.value = a.id
          opt.textContent = a.name
          sel.appendChild(opt)
        })
        if (userFilter) sel.value = userFilter
      }
    }

    const tbody = document.getElementById('auditBody')
    const COLS = 5
    if (!data.entries.length) {
      tbody.innerHTML = `<tr><td colspan="${COLS}" style="text-align:center;color:var(--text-3);padding:24px">No audit entries found</td></tr>`; return
    }
    tbody.innerHTML = data.entries.map(e => {
      const am      = AUDIT_ACTION_META[e.action] || { icon: '📄', label: e.action }
      const relTime = _auditRelTime(e.created_at)
      const absTime = new Date(e.created_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
      const detail  = _auditDetailText(e)
      return `<tr>
        <td style="font-size:11px;color:var(--text-3);white-space:nowrap" title="${escHtml(absTime)}">${escHtml(relTime)}</td>
        <td>${e.actor_name
          ? `<div style="display:flex;align-items:center;gap:6px">${_avatarHTML({name:e.actor_name,initials:e.actor_initials,color:e.actor_color||'#4f46e5',avatar:e.actor_avatar||null},'xs')}<span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px" title="${escHtml(e.actor_name)}">${escHtml(e.actor_name)}</span></div>`
          : '<span style="color:var(--text-3)">—</span>'}</td>
        <td><span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500">${am.icon} ${escHtml(am.label)}</span></td>
        <td style="font-size:12px;color:var(--text-2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(e.entity_name||e.entity_id||'')}">${escHtml(e.entity_name||e.entity_id||'—')}</td>
        <td style="font-size:11px;color:var(--text-3);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(detail)}">${escHtml(detail) || '—'}</td>
      </tr>`
    }).join('')

    const pager = document.getElementById('auditPager')
    const total = data.total
    pager.innerHTML = `
      <button class="btn btn-secondary btn-sm" onclick="loadAudit(${Math.max(0,offset-30)})" ${offset===0?'disabled':''}>← Prev</button>
      <span style="font-size:12px;color:var(--text-3);flex:1;text-align:center">${total === 0 ? '0' : offset+1}–${Math.min(offset+30,total)} of ${total}</span>
      <button class="btn btn-secondary btn-sm" onclick="loadAudit(${offset+30})" ${offset+30>=total?'disabled':''}>Next →</button>`
  } catch (err) {
    document.getElementById('auditBody').innerHTML = `<tr><td colspan="5" style="color:var(--red);padding:24px;text-align:center">${escHtml(err.message)}</td></tr>`
  }
}

        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" id="backupExportBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download Backup
          </button>
          <span id="backupExportStatus" style="font-size:12px;color:var(--text-3)">Includes all data</span>
        </div>
      </div>
    </div>

    <div class="card section-card">
      <div class="card-header"><h3 class="card-title">Restore from Backup</h3></div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--text-2);margin-bottom:8px;line-height:1.6">
          Upload a <code style="font-family:var(--mono);font-size:11px;padding:1px 5px;background:var(--gray-100);border-radius:3px">.fsbackup</code> file to restore data.
          Restore is <strong>additive</strong> — existing records are updated with backup values and records not in the backup are left untouched.
        </p>
        <div style="padding:10px 14px;background:rgba(255,152,0,.07);border:1px solid rgba(255,152,0,.3);border-radius:var(--r-md);font-size:12px;color:var(--orange,#e07b00);margin-bottom:16px;display:flex;gap:10px;align-items:flex-start">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Passwords are included in the backup. Restoring on a new instance will allow users to log in with their original credentials immediately. If the new instance uses a different <code style="font-family:var(--mono);font-size:11px">PASSWORD_PEPPER</code>, users will need to reset their passwords.</span>
        </div>
        <div class="backup-drop-zone" id="backupDropZone">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>Drop a <strong>.fsbackup</strong> file here, or click to browse</p>
          <small>Maximum 256 MB</small>
          <input type="file" id="backupFileInput" accept=".fsbackup,application/octet-stream" style="display:none" />
        </div>
        <div id="backupPreviewArea" style="margin-top:16px;display:none"></div>
        <div id="backupResultArea"  style="margin-top:16px;display:none"></div>
      </div>
    </div>`

  // ── Export button ───────────────────────────────────────────────────────────
  document.getElementById('backupExportBtn').addEventListener('click', async () => {
    const btn    = document.getElementById('backupExportBtn')
    const status = document.getElementById('backupExportStatus')
    btn.disabled = true
    btn.innerHTML = `<svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".25"/><path d="M21 12a9 9 0 00-9-9"/></svg> Generating…`
    status.textContent = 'Building backup…'
    status.style.color = 'var(--text-3)'
    try {
      const resp = await fetch('/api/backup/export', { credentials: 'include' })
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ error: 'Export failed' }))
        throw new Error(err.error || 'Export failed')
      }
      const blob = await resp.blob()
      const cd   = resp.headers.get('Content-Disposition') || ''
      const fnMatch = cd.match(/filename="([^"]+)"/)
      const filename = fnMatch ? fnMatch[1] : 'forgeshift-backup.fsbackup'
      const url  = URL.createObjectURL(blob)
      const a    = document.createElement('a')
      a.href = url; a.download = filename
      document.body.appendChild(a); a.click()
      document.body.removeChild(a)
      URL.revokeObjectURL(url)
      const kb = (blob.size / 1024).toFixed(0)
      const mb = (blob.size / 1024 / 1024).toFixed(2)
      status.textContent = `✓ Downloaded ${blob.size > 1024*1024 ? mb + ' MB' : kb + ' KB'} — ${filename}`
      status.style.color = 'var(--green,#0a7c41)'
    } catch (err) {
      status.textContent = '✗ ' + err.message
      status.style.color = 'var(--red,#de350b)'
    } finally {
      btn.disabled = false
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Backup`
    }
  })

  // ── Drop zone & file picker ─────────────────────────────────────────────────
  const dropZone  = document.getElementById('backupDropZone')
  const fileInput = document.getElementById('backupFileInput')

  dropZone.addEventListener('click', () => fileInput.click())
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over') })
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'))
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over')
    const file = e.dataTransfer.files[0]
    if (file) handleRestoreFile(file)
  })
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0]
    if (file) handleRestoreFile(file)
  })

  // ── Parse backup file and show preview ─────────────────────────────────────
  function handleRestoreFile(file) {
    const previewArea = document.getElementById('backupPreviewArea')
    const resultArea  = document.getElementById('backupResultArea')
    resultArea.style.display = 'none'
    resultArea.innerHTML = ''

    if (!file.name.endsWith('.fsbackup') && file.type !== 'application/octet-stream' && file.type !== '') {
      previewArea.style.display = 'block'
      previewArea.innerHTML = `<div class="backup-result-err">Not a valid backup file. Please select a <code>.fsbackup</code> file.</div>`
      return
    }

    previewArea.style.display = 'block'
    previewArea.innerHTML = `<div class="backup-progress"><svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".25"/><path d="M21 12a9 9 0 00-9-9"/></svg> Reading backup file…</div>`

    const reader = new FileReader()
    reader.onerror = () => { previewArea.innerHTML = `<div class="backup-result-err">Failed to read file.</div>` }
    reader.onload = ev => {
      let manifest
      try { manifest = JSON.parse(ev.target.result) } catch {
        previewArea.innerHTML = `<div class="backup-result-err">File could not be parsed. Make sure it is a valid <code>.fsbackup</code> file and has not been modified.</div>`
        return
      }

      if (manifest.format !== 'forgeshift-backup') {
        previewArea.innerHTML = `<div class="backup-result-err">Not a ForgeShift backup file.</div>`
        return
      }
      if (manifest.version > 1) {
        previewArea.innerHTML = `<div class="backup-result-err">This backup was created with a newer version of ForgeShift (format v${manifest.version}). Please upgrade first.</div>`
        return
      }

      const t = manifest.tables || {}
      const exportedAt = manifest.exported_at ? new Date(manifest.exported_at).toLocaleString() : 'unknown'
      const instance   = manifest.instance || 'unknown'
      const fileSizeMB = (file.size / 1024 / 1024).toFixed(2)

      previewArea.innerHTML = `
        <div class="restore-preview">
          <h5>Backup Details</h5>
          <div class="restore-row"><span>Exported at</span><span>${escHtml(exportedAt)}</span></div>
          <div class="restore-row"><span>Source instance</span><span>${escHtml(instance)}</span></div>
          <div class="restore-row"><span>File size</span><span>${fileSizeMB} MB</span></div>
        </div>
        <div class="restore-preview">
          <h5>Contents</h5>
          <div class="restore-row"><span>Users</span><span>${(t.users||[]).length}</span></div>
          <div class="restore-row"><span>Locations</span><span>${(t.locations||[]).length}</span></div>
          <div class="restore-row"><span>Shift Templates</span><span>${(t.shift_templates||[]).length}</span></div>
          <div class="restore-row"><span>Template Days</span><span>${(t.template_days||[]).length}</span></div>
          <div class="restore-row"><span>Pattern Template Days</span><span>${(t.template_pattern_days||[]).length}</span></div>
          <div class="restore-row"><span>Shifts</span><span>${(t.shifts||[]).length}</span></div>
          <div class="restore-row"><span>Preferences</span><span>${(t.app_preferences||[]).length}</span></div>
        </div>
        <div style="padding:10px 14px;background:rgba(0,82,204,.06);border:1px solid rgba(0,82,204,.2);border-radius:var(--r-md);font-size:12px;color:var(--brand);margin-bottom:16px">
          Restore is <strong>additive</strong>: existing records will be updated with values from the backup, and records not present in the backup will not be touched. No data will be deleted.
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-primary" id="backupRestoreConfirmBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.73"/></svg>
            Restore Now
          </button>
          <button class="btn btn-secondary" id="backupRestoreCancelBtn">Cancel</button>
          <span style="font-size:12px;color:var(--text-3)">Export a fresh backup first if unsure</span>
        </div>`

      document.getElementById('backupRestoreCancelBtn').addEventListener('click', () => {
        previewArea.style.display = 'none'
        previewArea.innerHTML = ''
        fileInput.value = ''
      })
      document.getElementById('backupRestoreConfirmBtn').addEventListener('click', () => {
        doRestore(ev.target.result)
      })
    }
    reader.readAsText(file)
  }

  // ── Send restore to server ──────────────────────────────────────────────────
  async function doRestore(rawJson) {
    const previewArea = document.getElementById('backupPreviewArea')
    const resultArea  = document.getElementById('backupResultArea')

    previewArea.innerHTML = `<div class="backup-progress">
      <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".25"/><path d="M21 12a9 9 0 00-9-9"/></svg>
      Restoring — writing to database. Do not close this page…
    </div>`

    try {
      const resp = await fetch('/api/backup/restore', {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain' },
        body:    rawJson,
        credentials: 'include',
      })
      const data = await resp.json()
      if (!resp.ok) throw new Error(data.error || 'Restore failed')

      const s = data.stats || {}
      previewArea.style.display = 'none'
      resultArea.style.display  = 'block'
      resultArea.innerHTML = `
        <div class="backup-result-ok">
          <div style="font-weight:700;color:var(--green,#0a7c41);margin-bottom:10px;font-size:13px">✓ Restore complete</div>
          <div class="restore-preview" style="margin-bottom:0">
            <h5>Restored</h5>
            <div class="restore-row"><span>Users</span><span>${s.users ?? 0}</span></div>
            <div class="restore-row"><span>Locations</span><span>${s.locations ?? 0}</span></div>
            <div class="restore-row"><span>Shift Templates</span><span>${s.templates ?? 0}</span></div>
            <div class="restore-row"><span>Template Days</span><span>${s.templateDays ?? 0}</span></div>
            <div class="restore-row"><span>Shifts</span><span>${s.shifts ?? 0}</span></div>
          </div>
          <div style="margin-top:12px;font-size:12px;color:var(--text-2)">
            Source: ${escHtml(data.instance || 'unknown')} · Exported ${data.exported_at ? new Date(data.exported_at).toLocaleString() : ''}
          </div>
          <button class="btn btn-secondary btn-sm" onclick="location.reload()" style="margin-top:12px">Reload page</button>
        </div>`
    } catch (err) {
      previewArea.style.display = 'none'
      resultArea.style.display  = 'block'
      resultArea.innerHTML = `<div class="backup-result-err"><strong>Restore failed</strong><br>${escHtml(err.message)}</div>`
    }
  }
}

async function signOutEverywhere() {
  if (!confirm('This will invalidate all active sessions across every device and browser, including this one. Continue?')) return
  try {
    await api('/api/auth/revoke-all', { method: 'POST' })
    window.location.href = '/login.html'
  } catch (err) { toast(err.message, 'error') }
}

function openDeleteAccountModal() {
  const existing = document.getElementById('deleteAccountModal')
  if (existing) existing.remove()
  const modal = document.createElement('div')
  modal.id = 'deleteAccountModal'
  modal.className = 'modal-overlay'
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" style="color:var(--red)">Delete My Account</h3>
        <button class="modal-close" onclick="document.getElementById('deleteAccountModal').remove()">✕</button>
      </div>
      <div class="modal-body">
        <div style="padding:12px 14px;background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.25);border-radius:var(--r-md);font-size:13px;color:var(--red);margin-bottom:16px;line-height:1.5">
          <strong>This action is permanent and cannot be undone.</strong> Your account, all shifts, and calendar tokens will be deleted immediately.
        </div>
        <div class="form-group">
          <label class="form-label">Confirm your password</label>
          <input type="password" class="form-input" id="deleteAccountPw" placeholder="Enter your password to confirm" autocomplete="current-password">
        </div>
        <div id="deleteAccountErr" style="display:none;color:var(--red);font-size:12px;margin-top:4px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="document.getElementById('deleteAccountModal').remove()">Cancel</button>
        <button class="btn btn-sm" style="background:var(--red);color:#fff;border-color:var(--red)" onclick="doDeleteAccount()">Delete my account</button>
      </div>
    </div>`
  document.body.appendChild(modal)
  modal.classList.add('open')
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove() })
  setTimeout(() => document.getElementById('deleteAccountPw')?.focus(), 50)
}

async function doDeleteAccount() {
  const pw  = document.getElementById('deleteAccountPw').value
  const err = document.getElementById('deleteAccountErr')
  if (!pw) { err.style.display = 'block'; err.textContent = 'Password is required.'; return }
  err.style.display = 'none'
  try {
    await api('/api/auth/account', { method: 'DELETE', body: { password: pw } })
    window.location.href = '/login.html'
  } catch (e) { err.style.display = 'block'; err.textContent = e.message }
}

              <rect x="13" y="16" width="10" height="1.5" rx=".75" fill="white"/>

              <rect x="13" y="22" width="8" height="1.5" rx=".75" fill="white"/>
            </svg>
          </div>
          <div>
            <div style="font-size:20px;font-weight:800;letter-spacing:-.03em">ForgeShift</div>
            <div style="font-size:13px;color:var(--text-3);margin-top:2px">Self-hosted shift rota management · ${escHtml(cfg.version)}</div>
          </div>
        </div>
        <p style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:16px">
          ForgeShift is a lightweight, self-hosted workforce scheduling application. It lets teams manage
          shift rotas, create reusable templates, and subscribe to their schedule via iCal — all without
          any cloud dependency or third-party services.
        </p>
        <p style="font-size:13px;color:var(--text-2);line-height:1.6">
          Designed to be deployed on a single server, ForgeShift keeps your data local and under your control.
        </p>
      </div>
    </div>
    <div class="card section-card">
      <div class="card-header"><h3 class="card-title">Tech Stack</h3></div>
      <div class="card-body">
        <table style="width:100%;font-size:13px;border-collapse:collapse">
          ${[
            ['Frontend',  'Vanilla HTML, CSS, JavaScript'],
            ['Backend',   'Node.js · Express'],
            ['Database',  'SQLite (better-sqlite3)'],
            ['Auth',      'Session-based · HMAC-SHA256 pepper'],
            ['Calendar',  'iCal feed (ical-generator)'],
            ['Email',     'Nodemailer (optional SMTP)'],
            ['Deployment','Docker · PM2 · Proxmox LXC'],
          ].map(([k,v]) => `
            <tr>
              <td style="color:var(--text-3);padding:10px 0;width:140px;border-bottom:1px solid var(--border)">${k}</td>
              <td style="padding:10px 0;border-bottom:1px solid var(--border);font-weight:500">${v}</td>
            </tr>`).join('')}
        </table>
      </div>
    </div>
    <div class="card section-card">
      <div class="card-header"><h3 class="card-title">Licence &amp; Source</h3></div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--text-2);line-height:1.6">
          ForgeShift is open-source software, part of the <strong>Forge</strong> suite of self-hosted tools.
          Source code and deployment instructions are available on GitHub.
        </p>
      </div>
    </div>`
}

// Close modals on overlay click
['editUserModal','locModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => { if (e.target.id === id) document.getElementById(id).classList.remove('open') })
})

init()
</script>
</body>
</html>
