<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeShift — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="9" fill="#4f46e5"/>
        <path d="M10 26V10h10l6 6v10H10z" fill="rgba(255,255,255,.25)"/>
        <path d="M20 10l6 6h-6V10z" fill="rgba(255,255,255,.5)"/>
        <rect x="13" y="16" width="10" height="1.5" rx=".75" fill="white"/>
        <rect x="13" y="19" width="7" height="1.5" rx=".75" fill="white"/>
        <rect x="13" y="22" width="8" height="1.5" rx=".75" fill="white"/></svg>
      <span class="auth-logo-text">ForgeShift</span>
    </div>
    <h1 class="auth-title">Reset password</h1>
    <p class="auth-subtitle">Enter your email and we'll send a reset link</p>
    <div class="auth-error" id="fpError"></div>
    <div class="auth-success" id="fpSuccess"></div>
    <div id="fpForm">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" class="form-input" id="email" placeholder="you@example.com">
      </div>
      <button class="btn btn-primary auth-btn" onclick="doForgot()">Send reset link</button>
    </div>
    <div class="auth-link"><a href="/login.html">← Back to sign in</a></div>
  </div>
</div>
<script>
  const t = localStorage.getItem('fs-theme') || 'light'
  if (t !== 'light') document.documentElement.setAttribute('data-theme', t)

  async function doForgot() {
    const err = document.getElementById('fpError')
    const ok  = document.getElementById('fpSuccess')
    err.classList.remove('show'); ok.classList.remove('show')
    const email = document.getElementById('email').value.trim()
    if (!email) { err.textContent = 'Email is required'; err.classList.add('show'); return }
    try {
      const r = await fetch('/api/auth/forgot-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email }) })
      const d = await r.json()
      ok.textContent = 'If an account exists for that email, a reset link has been sent.'
      ok.classList.add('show')
      document.getElementById('fpForm').style.display = 'none'
      // Dev: show resetUrl if returned
      if (d.resetUrl) {
        const hint = document.createElement('p')
        hint.style.cssText = 'margin-top:12px;font-size:11px;color:var(--text-3);word-break:break-all'
        hint.textContent = '(Dev) Reset URL: ' + d.resetUrl
        document.getElementById('fpSuccess').after(hint)
      }
    } catch {
      err.textContent = 'Connection error'; err.classList.add('show')
    }
  }
</script>
</body>
</html>
