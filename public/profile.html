<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeShift — My Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>
    (function(){
      var t = localStorage.getItem("fs-theme") || "system"
      if (t === "system") {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.setAttribute("data-theme","dark")
      } else if (t !== "light") {
        document.documentElement.setAttribute("data-theme", t)
      }
    })()
  </script>
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <main class="page-content" style="display:flex;flex-direction:column;align-items:center">
      <div style="width:100%;max-width:560px">
      <div class="page-header">
        <h1 class="page-title">My Profile</h1>
      </div>
      <div style="display:grid;gap:20px">

        <!-- Profile Info -->
        <div class="card">
          <div class="card-header"><h3 class="card-title">Profile</h3></div>
          <div class="card-body">
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
              <div style="position:relative;flex-shrink:0">
                <div class="avatar avatar-xl" id="profileAvatar"></div>
                <label for="avatarInput" style="position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--surface)" title="Change photo">
                  <svg viewBox="0 0 20 20" fill="white" width="12" height="12"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
                </label>
                <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
              </div>
              <div>
                <div style="font-size:18px;font-weight:800" id="profileName"></div>
                <div style="font-size:13px;color:var(--text-3)" id="profileEmail"></div>
                <span class="badge badge-blue" style="margin-top:6px" id="profileRole"></span>
                <div style="margin-top:8px">
                  <button class="btn btn-ghost btn-sm" id="removeAvatarBtn" style="font-size:11px;color:var(--red);display:none" onclick="removeAvatar()">Remove photo</button>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Display name</label>
              <input type="text" class="form-input" id="editName">
            </div>
            <div class="form-group">
              <label class="form-label">Accent colour</label>
              <div id="profileColourPicker"></div>
            </div>
            <button class="btn btn-primary btn-sm" onclick="saveProfile()">Save changes</button>
          </div>
        </div>

        <!-- Change Password -->
        <div class="card">
          <div class="card-header"><h3 class="card-title">Change Password</h3></div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">Current password</label>
              <input type="password" class="form-input" id="curPw" placeholder="••••••••">
            </div>
            <div class="form-group">
              <label class="form-label">New password</label>
              <div style="position:relative">
                <input type="password" class="form-input" id="newPw" placeholder="••••••••" style="padding-right:40px" oninput="updatePasswordIndicator(pwIndicator, this.value)">
                <button type="button" onclick="(function(){var i=document.getElementById('newPw');i.type=i.type==='text'?'password':'text'})()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px" title="Show/hide">
                  <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
                </button>
              </div>
              <div id="pwIndicatorWrap" style="margin-top:8px"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm new password</label>
              <input type="password" class="form-input" id="newPw2" placeholder="••••••••">
            </div>
            <button class="btn btn-primary btn-sm" onclick="changePassword()">Update password</button>
          </div>
        </div>

        <!-- iCal Feed -->
        <div class="card">
          <div class="card-header"><h3 class="card-title">Calendar Subscription</h3></div>
          <div class="card-body">
            <p style="font-size:13px;color:var(--text-3);margin-bottom:16px">
              Subscribe to your shift rota in any calendar app (Google Calendar, Apple Calendar, Outlook) via iCal.
            </p>
            <div id="icalContent">Loading…</div>
          </div>
        </div>

      </div><!-- /grid -->
      </div><!-- /max-width wrapper -->
    </main>
</div><!-- /app-shell -->

<script src="/js/shell.js"></script>
<script src="/js/password-policy.js"></script>
<script>
'use strict'

let cfg = null
let profileColour = '#4f46e5'
let pwIndicator = null

function renderAvatar(u) {
  const el = document.getElementById('profileAvatar')
  el.style.background = u.color || '#4f46e5'
  if (u.avatar) {
    const img = document.createElement('img')
    img.src = u.avatar
    img.alt = u.name || ''
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:inherit'
    el.textContent = ''
    el.appendChild(img)
  } else {
    el.textContent = u.initials || (u.name || '?').slice(0,2).toUpperCase()
  }
  const removeBtn = document.getElementById('removeAvatarBtn')
  if (removeBtn) removeBtn.style.display = u.avatar ? 'inline-flex' : 'none'
}

async function init() {
  cfg = await loadConfig()
  if (!cfg) return
  renderShell(cfg, 'profile')
  if (cfg.passwordPolicy) setPasswordPolicy(cfg.passwordPolicy)

  pwIndicator = document.getElementById('pwIndicatorWrap')

  const u = cfg.user
  renderAvatar(u)
  document.getElementById('profileName').textContent = u.name
  document.getElementById('profileEmail').textContent = u.email
  document.getElementById('profileRole').textContent = u.role
  document.getElementById('editName').value = u.name

  profileColour = u.color || '#4f46e5'
  const picker = document.getElementById('profileColourPicker')
  renderColourPicker(picker, profileColour, v => { profileColour = v })

  loadIcal()
}

async function uploadAvatar(input) {
  const file = input.files[0]
  if (!file) return
  if (file.size > 4 * 1024 * 1024) { toast('Image must be under 4 MB', 'error'); return }
  const fd = new FormData()
  fd.append('avatar', file)
  try {
    const r = await fetch('/api/users/me/avatar', { method: 'POST', body: fd })
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || 'Upload failed')
    cfg.user.avatar = d.avatar
    renderAvatar(cfg.user)
    _config = null
    toast('Photo updated', 'success')
  } catch (err) { toast(err.message, 'error') }
  input.value = ''
}

async function removeAvatar() {
  if (!confirm('Remove your profile photo?')) return
  try {
    const r = await fetch('/api/users/me/avatar', { method: 'DELETE' })
    if (!r.ok) throw new Error('Failed to remove photo')
    cfg.user.avatar = null
    renderAvatar(cfg.user)
    _config = null
    toast('Photo removed', 'success')
  } catch (err) { toast(err.message, 'error') }
}

async function saveProfile() {
  const name = document.getElementById('editName').value.trim()
  if (!name) { toast('Name is required', 'error'); return }
  try {
    const r = await api('/api/auth/profile', { method: 'PATCH', body: { name, color: profileColour } })
    cfg.user.name     = r.user.name
    cfg.user.initials = r.user.initials
    cfg.user.color    = r.user.color
    renderAvatar(cfg.user)
    document.getElementById('profileName').textContent = r.user.name
    toast('Profile saved', 'success')
    _config = null
  } catch (err) { toast(err.message, 'error') }
}

async function changePassword() {
  const cur  = document.getElementById('curPw').value
  const npw  = document.getElementById('newPw').value
  const npw2 = document.getElementById('newPw2').value
  if (!cur || !npw)       { toast('All fields are required', 'error'); return }
  if (npw !== npw2)       { toast('Passwords do not match', 'error'); return }
  const v = validatePasswordClient(npw)
  if (!v.ok)              { toast(v.errors[0], 'error'); return }
  try {
    await api('/api/auth/profile', { method: 'PATCH', body: { currentPassword: cur, newPassword: npw } })
    toast('Password updated', 'success')
    document.getElementById('curPw').value  = ''
    document.getElementById('newPw').value  = ''
    document.getElementById('newPw2').value = ''
    if (pwIndicator) pwIndicator.innerHTML = ''
  } catch (err) { toast(err.message, 'error') }
}

async function loadIcal() {
  try {
    const data = await api('/api/ical/token')
    const el = document.getElementById('icalContent')
    el.innerHTML = `
      <div class="form-group">
        <label class="form-label">Feed URL</label>
        <div style="display:flex;gap:8px">
          <input type="text" class="form-input" value="${data.feedUrl}" readonly id="icalUrl" style="font-size:11px;font-family:var(--mono)">
          <button class="btn btn-secondary btn-sm" onclick="copyIcal()">Copy</button>
        </div>
        <p class="form-hint">Paste this URL into your calendar app to subscribe to your shifts.</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="${data.feedUrl}" class="btn btn-secondary btn-sm" download>⬇ Download .ics</a>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="regenerateIcal()">Regenerate token</button>
      </div>`
  } catch (err) {
    document.getElementById('icalContent').textContent = 'Failed to load iCal token'
  }
}

function copyIcal() {
  const url = document.getElementById('icalUrl').value
  navigator.clipboard.writeText(url).then(() => toast('URL copied!', 'success'))
}

async function regenerateIcal() {
  if (!confirm('Regenerate iCal token? Your current subscription URL will stop working.')) return
  try {
    await api('/api/ical/token', { method: 'DELETE' })
    await loadIcal()
    toast('Token regenerated', 'success')
  } catch (err) { toast(err.message, 'error') }
}

init()
</script>
</body>
</html>
