<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ForgeShift — Templates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/png" href="/icons/app-icon-light-1024.png?v=20260429" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/icons/app-icon-dark-1024.png?v=20260429" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/icons/app-icon-light-1024.png?v=20260429">
  <link rel="manifest" id="appManifest" href="/manifest-light.json?v=20260429">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>
    (function(){
      var t = localStorage.getItem("fs-theme") || "system"
      if (t === "system") {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.setAttribute("data-theme","dark")
      } else if (t !== "light") {
        document.documentElement.setAttribute("data-theme", t)
      }
    })()
  </script>
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <main class="page-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Templates</h1>
          <p class="page-subtitle">Create reusable weekly rotas or flexible shift patterns</p>
        </div>
        <div style="display:flex;gap:8px" id="adminActions"></div>
      </div>
      <div id="groupFilterBar" style="display:none;margin-bottom:20px"></div>
      <div id="templateGrid">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg>
          <h3>No templates yet</h3>
          <p>Create a template to quickly apply weekly rotas or flexible shift patterns</p>
        </div>
      </div>
    </main>
</div>

<!-- Template Modal -->
<div class="modal-overlay" id="tmplModal">
  <div class="modal" style="max-width:min(96vw,980px)">
    <div class="modal-header">
      <h3 class="modal-title" id="tmplModalTitle">New Template</h3>
      <button class="modal-close" onclick="closeTmplModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Template name</label>
        <input type="text" class="form-input" id="tmplName" placeholder="e.g. Standard Week">
      </div>
      <div class="form-group">
        <label class="form-label">Description (optional)</label>
        <input type="text" class="form-input" id="tmplDesc" placeholder="Describe this template…">
      </div>
      <div class="form-group">
        <label class="form-label">Template type</label>
        <select class="form-select" id="tmplType" onchange="onTemplateTypeChange(this.value)">
          <option value="weekly">Weekly rota</option>
          <option value="pattern">Flexible pattern</option>
        </select>
      </div>
      <div class="form-group" id="tmplCycleLengthRow" style="display:none">
        <label class="form-label">Pattern length (days)</label>
        <input type="number" class="form-input" id="tmplCycleLength" min="1" max="42" value="7" onchange="onPatternLengthChange(this.value)">
      </div>
      <div class="form-group" id="tmplGroupRow">
        <label class="form-label">Organisation</label>
        <select class="form-select" id="tmplGroup">
          <option value="">— None (visible to all) —</option>
        </select>
      </div>
      <h4 style="margin:16px 0 12px;font-size:13px" id="dayEditorHeading">Configure each day</h4>
      <div id="copyDayBar" style="display:none;margin-bottom:10px"></div>
      <div class="day-editor-wrap"><div class="day-editor-grid" id="dayEditorGrid"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeTmplModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTmpl()">Save template</button>
    </div>
  </div>
</div>

<!-- Apply Template Modal -->
<div class="modal-overlay" id="applyModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Apply Template</h3>
      <button class="modal-close" onclick="closeApplyModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-3);font-size:13px;margin-bottom:16px" id="applyModalCopy">Apply this template to one or more team members.</p>
      <div class="form-group">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <label class="form-label" style="margin:0">Team members</label>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="applySelectAll(true)" style="font-size:11px;padding:2px 8px">All</button>
            <button class="btn btn-ghost btn-sm" onclick="applySelectAll(false)" style="font-size:11px;padding:2px 8px">None</button>
          </div>
        </div>
        <div id="applyUserList" style="max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:4px"></div>
      </div>
      <div class="form-group">
        <label class="form-label" id="applyDateLabel">Week starting (Monday)</label>
        <input type="date" class="form-input" id="applyWeekStart">
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none">
          <input type="checkbox" id="applySkipHolidays" checked style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0">
          <span style="font-size:13px;color:var(--text-2)">Skip bank holidays <span style="color:var(--text-3)">(days that fall on a bank holiday will not be created)</span></span>
        </label>
      </div>
      <div id="applyProgress" style="display:none;padding:8px 0">
        <div id="applyProgressText" style="font-size:13px;color:var(--text-2);margin-bottom:6px"></div>
        <div style="width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden">
          <div id="applyProgressBar" style="height:100%;background:var(--brand);border-radius:3px;transition:width .2s ease;width:0%"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeApplyModal()">Cancel</button>
      <button class="btn btn-primary" id="applyBtn" onclick="doApplyTmpl()">Apply template</button>
    </div>
  </div>
</div>

<script src="/js/prefs.js"></script>
<script src="/js/shell.js"></script>
<script>
'use strict'

let cfg = null
let templates = []
let groups = []
let locations = []
let users = []
let teams = []
let editingTmplId = null
let applyingTmplId = null
let applyingTmplType = 'weekly'
let activeGroupFilter = 'all'
let templateType = 'weekly'
let patternLength = 7
let dayConfigs = {} // day index -> { location_id, start_time, end_time, notes, note_color, is_off }
let excludedDays = new Set() // day indices excluded from this template

const TEMPLATE_TYPE_WEEKLY = 'weekly'
const TEMPLATE_TYPE_PATTERN = 'pattern'
const MAX_PATTERN_DAYS = 42
const DAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']
const DAY_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
const DEFAULT_TEMPLATE_COLOUR = '#4f46e5'

function getTemplateType(value) {
  return value === TEMPLATE_TYPE_PATTERN ? TEMPLATE_TYPE_PATTERN : TEMPLATE_TYPE_WEEKLY
}

function getTemplateCycleLength(type = templateType, cycleLength = patternLength) {
  if (getTemplateType(type) !== TEMPLATE_TYPE_PATTERN) return 7
  const parsed = parseInt(cycleLength, 10)
  if (!Number.isInteger(parsed)) return 7
  return Math.min(MAX_PATTERN_DAYS, Math.max(1, parsed))
}

function getTemplateSlotCount(type = templateType, cycleLength = patternLength) {
  return getTemplateType(type) === TEMPLATE_TYPE_PATTERN
    ? getTemplateCycleLength(type, cycleLength)
    : 7
}

function getTemplateDayIndex(day) {
  const idx = day?.day_index ?? day?.day_of_week
  return Number.isInteger(idx) ? idx : parseInt(idx, 10)
}

function getTemplateDayLabel(index, type = templateType, short = false) {
  if (getTemplateType(type) === TEMPLATE_TYPE_PATTERN) return short ? `D${index + 1}` : `Day ${index + 1}`
  return short ? DAY_SHORT[index] : DAY_FULL[index]
}

function syncTemplateEditorMode() {
  const normalizedType = getTemplateType(templateType)
  templateType = normalizedType
  patternLength = getTemplateCycleLength(normalizedType, patternLength)

  const typeEl = document.getElementById('tmplType')
  if (typeEl) typeEl.value = normalizedType

  const cycleRow = document.getElementById('tmplCycleLengthRow')
  if (cycleRow) cycleRow.style.display = normalizedType === TEMPLATE_TYPE_PATTERN ? '' : 'none'

  const cycleEl = document.getElementById('tmplCycleLength')
  if (cycleEl) cycleEl.value = patternLength

  const heading = document.getElementById('dayEditorHeading')
  if (heading) heading.textContent = normalizedType === TEMPLATE_TYPE_PATTERN
    ? 'Configure each pattern day'
    : 'Configure each day'
}

function pruneTemplateEditorState() {
  const slotCount = getTemplateSlotCount()
  Object.keys(dayConfigs).forEach(key => {
    if (parseInt(key, 10) >= slotCount) delete dayConfigs[key]
  })
  excludedDays = new Set([...excludedDays].filter(idx => idx < slotCount))
}

function onTemplateTypeChange(value) {
  closeCopyDayMenu()
  templateType = getTemplateType(value)
  if (templateType !== TEMPLATE_TYPE_PATTERN) patternLength = 7
  syncTemplateEditorMode()
  pruneTemplateEditorState()
  renderDayEditor()
}

function onPatternLengthChange(value) {
  closeCopyDayMenu()
  patternLength = getTemplateCycleLength(TEMPLATE_TYPE_PATTERN, value)
  syncTemplateEditorMode()
  pruneTemplateEditorState()
  renderDayEditor()
}

async function init() {
  cfg = await loadConfig()
  if (!cfg) return
  renderShell(cfg, 'templates')
  // loadUsers must complete before loadTeams — loadTeams filters users to team scope for shift_leads
  await loadUsers()
  await Promise.all([loadLocations(), loadTeams(), loadGroups(), loadTemplates()])

  if (cfg.user.role === 'admin' || cfg.user.role === 'manager') {
    document.getElementById('adminActions').innerHTML = `
      <button class="btn btn-primary" onclick="openCreateTmpl()">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        New Template
      </button>`
  }
}

async function loadGroups() {
  try {
    groups = await api('/api/organisations')
  } catch { groups = [] }
}

async function loadLocations() {
  locations = await api('/api/locations')
}

async function loadUsers() {
  if (cfg.user.role === 'member') { users = [cfg.user]; return }
  const allUsers = await api('/api/users')
  if (cfg.user.role === 'shift_lead') {
    users = allUsers.filter(u => u.is_active && (u.role === 'member' || u.role === 'shift_lead'))
  } else {
    users = allUsers.filter(u => u.is_active)
  }
}

async function loadTeams() {
  if (cfg.user.role !== 'shift_lead') return
  try { teams = await api('/api/teams') } catch { teams = [] }
  const teamMemberIds = new Set([cfg.user.id])
  teams.forEach(t => (t.members || []).forEach(m => { if (m.is_active) teamMemberIds.add(m.id) }))
  users = users.filter(u => teamMemberIds.has(u.id))
}

async function loadTemplates() {
  templates = await api('/api/templates')
  renderGroupFilterBar()
  renderTemplateGrid()
}

function renderGroupFilterBar() {
  const bar = document.getElementById('groupFilterBar')
  // Only show bar if there are groups to filter
  if (!groups.length) { bar.style.display = 'none'; return }
  bar.style.display = 'flex'
  bar.style.cssText = 'display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:20px'

  const allCount = templates.length
  const pills = [{ id: 'all', name: 'All', count: allCount }]
  groups.forEach(g => {
    const count = templates.filter(t => t.org_id === g.id).length
    pills.push({ id: g.id, name: g.name, count })
  })
  // Add unassigned pill if any unassigned templates exist (admin only, informational)
  const ungroupedCount = templates.filter(t => !t.org_id).length
  if ((cfg.user.role === 'admin' || cfg.user.role === 'manager') && ungroupedCount > 0) {
    pills.push({ id: 'ungrouped', name: 'Unassigned', count: ungroupedCount })
  }

  bar.innerHTML = pills.map(p => {
    const active = activeGroupFilter === p.id
    return `<button onclick="setGroupFilter('${p.id}')" style="
      display:inline-flex;align-items:center;gap:5px;
      padding:5px 12px;border-radius:20px;font-size:12px;font-weight:${active?'600':'500'};
      border:1px solid ${active?'var(--blue)':'var(--border)'};
      background:${active?'var(--blue)':'var(--surface)'};
      color:${active?'#fff':'var(--text-2)'};
      cursor:pointer;transition:all .15s
    ">
      ${p.name}
      <span style="
        font-size:10px;padding:0 5px;border-radius:10px;
        background:${active?'rgba(255,255,255,.25)':'var(--surface-2)'};
        color:${active?'#fff':'var(--text-3)'}
      ">${p.count}</span>
    </button>`
  }).join('')
}

function setGroupFilter(groupId) {
  activeGroupFilter = groupId
  renderGroupFilterBar()
  renderTemplateGrid()
}

function renderTemplateCard(t) {
  const type = getTemplateType(t.template_type)
  const cycleLength = getTemplateCycleLength(type, t.cycle_length)
  const dayMap = {}
  ;(t.days||[]).forEach(d => {
    const idx = getTemplateDayIndex(d)
    if (Number.isInteger(idx)) dayMap[idx] = d
  })

  const previewCount = type === TEMPLATE_TYPE_PATTERN ? Math.min(cycleLength, 7) : 7
  const extraCount = type === TEMPLATE_TYPE_PATTERN ? Math.max(0, cycleLength - previewCount) : 0
  const previewColumns = previewCount + (extraCount ? 1 : 0)

  const dayCells = Array.from({ length: previewCount }, (_, i) => {
    const d = dayMap[i]
    const label = getTemplateDayLabel(i, type, true)
    if (!d) return `<div class="template-day-cell"><div class="day-abbr">${label}</div><div class="day-loc">—</div></div>`
    const loc = d.location_id ? locations.find(l => l.id === d.location_id) : null
    const locName = loc?.name || (d.is_off ? 'Off' : '—')
    const swatchColor = pickColourValue(loc?.color, d.note_color)
    return `<div class="template-day-cell">
      <div class="day-abbr">${label}</div>
      <div class="day-loc" title="${locName}">${locName}</div>
      ${renderInlineColourSwatch(swatchColor, { size: 8, title: swatchColor || 'No colour', className: 'day-swatch' })}
    </div>`
  }).join('')

  const moreCell = extraCount
    ? `<div class="template-day-cell">
        <div class="day-abbr">+${extraCount}</div>
        <div class="day-loc">more</div>
      </div>`
    : ''
  const typeBadge = type === TEMPLATE_TYPE_PATTERN
    ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(0,82,204,.08);border:1px solid rgba(0,82,204,.18);color:var(--brand);margin-top:3px">
        ${cycleLength}-day pattern
      </span>`
    : ''

  const groupBadge = t.org_name
    ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-3);margin-top:3px">
        <svg viewBox="0 0 20 20" fill="currentColor" width="9" height="9"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
        ${t.org_name}
      </span>`
    : ''

  const adminBtns = (cfg.user.role === 'admin' || cfg.user.role === 'manager') ? `
    <div style="display:flex;gap:4px">
      <button class="btn btn-secondary btn-sm" onclick="openApplyTmpl('${t.id}')">Apply</button>
      <button class="btn btn-ghost btn-sm btn-icon" onclick="duplicateTmpl('${t.id}')" title="Duplicate template">
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M7 9a2 2 0 012-2h6a2 2 0 012 2v6a2 2 0 01-2 2H9a2 2 0 01-2-2V9z"/><path d="M5 3a2 2 0 00-2 2v6a2 2 0 002 2V5h8a2 2 0 00-2-2H5z"/></svg>
      </button>
      <button class="btn btn-ghost btn-sm btn-icon" onclick="openEditTmpl('${t.id}')" title="Edit">
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
      </button>
      <button class="btn btn-ghost btn-sm btn-icon" onclick="deleteTmpl('${t.id}')" title="Delete" style="color:var(--red)">
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      </button>
    </div>` : cfg.user.role === 'shift_lead' ? `
    <div style="display:flex;gap:4px">
      <button class="btn btn-secondary btn-sm" onclick="openApplyTmpl('${t.id}')">Apply</button>
    </div>` : ''

  // Last-applied date
  let lastAppliedBadge = ''
  if (t.last_applied_at) {
    const then = new Date(t.last_applied_at + 'Z')
    const diffMs = Date.now() - then.getTime()
    const diffDays = Math.floor(diffMs / 86400000)
    const label = diffDays === 0 ? 'today' : diffDays === 1 ? 'yesterday' : `${diffDays}d ago`
    lastAppliedBadge = `<span style="font-size:10px;color:var(--text-3);display:flex;align-items:center;gap:3px;margin-top:3px">
      <svg viewBox="0 0 20 20" fill="currentColor" width="9" height="9"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
      Last applied ${label}
    </span>`
  }

  return `<div class="template-card">
    <div class="template-card-header">
      <div>
        <div class="template-card-title">${t.name}</div>
        ${t.description ? `<div style="font-size:11px;color:var(--text-3);margin-top:2px">${t.description}</div>` : ''}
        ${typeBadge}
        ${groupBadge}
        ${lastAppliedBadge}
      </div>
      ${adminBtns}
    </div>
    <div class="template-days-row" style="grid-template-columns:repeat(${previewColumns},1fr)">${dayCells}${moreCell}</div>
  </div>`
}

function renderTemplateGrid() {
  const grid = document.getElementById('templateGrid')
  grid.className = 'template-grid'

  // Filter by active group
  let visible = templates
  if (activeGroupFilter === 'ungrouped') {
    visible = templates.filter(t => !t.org_id)
  } else if (activeGroupFilter !== 'all') {
    visible = templates.filter(t => t.org_id === activeGroupFilter)
  }

  if (!templates.length) {
    grid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;opacity:.4"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12z"/></svg>
      <h3>No templates yet</h3>
      <p>${(cfg.user.role==='admin'||cfg.user.role==='manager')?'Click "New Template" to get started':cfg.user.role==='shift_lead'?'No templates have been created yet — ask a manager or admin to create one':'No templates have been created yet'}</p>
    </div>`
    return
  }

  if (!visible.length) {
    grid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;opacity:.4"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
      <h3>No templates in this group</h3>
      <p>No templates have been assigned to this group yet</p>
    </div>`
    return
  }

  // When viewing 'all', render grouped sections if groups exist
  if (activeGroupFilter === 'all' && groups.length > 0) {
    let html = ''
    // Ungrouped first (if any)
    const ungrouped = visible.filter(t => !t.org_id)
    // Then each group in order
    const grouped = groups.map(g => ({
      group: g,
      items: visible.filter(t => t.org_id === g.id)
    })).filter(x => x.items.length > 0)

    // If there are multiple sections, show section headings
    const showHeadings = grouped.length > 0 && (ungrouped.length > 0 || grouped.length > 1)

    if (showHeadings && ungrouped.length > 0) {
      html += `<div style="grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-bottom:4px;margin-top:4px">
        <span style="font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em">Ungrouped</span>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>`
      html += ungrouped.map(t => renderTemplateCard(t)).join('')
    }

    grouped.forEach(({ group, items }) => {
      if (showHeadings) {
        html += `<div style="grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-bottom:4px;margin-top:${html?'16':'4'}px">
          <span style="font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em">${group.name}</span>
          <div style="flex:1;height:1px;background:var(--border)"></div>
        </div>`
      }
      html += items.map(t => renderTemplateCard(t)).join('')
    })

    if (!showHeadings) {
      // Just flat list — no groups have templates yet or only one group
      html = visible.map(t => renderTemplateCard(t)).join('')
    }

    grid.innerHTML = html
  } else {
    grid.innerHTML = visible.map(t => renderTemplateCard(t)).join('')
  }
}

// ── Template Editor ────────────────────────────────────────────────────────────
function renderGroupSelect(selectedId) {
  const row = document.getElementById('tmplGroupRow')
  const el  = document.getElementById('tmplGroup')
  if (!el || !row) return
  // Only admins can assign org; hide the field for others
  if (cfg.user.role !== 'admin' || groups.length === 0) { row.style.display = 'none'; return }
  row.style.display = ''
  el.innerHTML = '<option value="">— None (visible to all) —</option>' +
    groups.map(g => `<option value="${g.id}"${g.id === selectedId ? ' selected' : ''}>${g.name}</option>`).join('')
}

function openCreateTmpl() {
  editingTmplId = null
  templateType = TEMPLATE_TYPE_WEEKLY
  patternLength = 7
  dayConfigs = {}
  excludedDays = new Set()
  document.getElementById('tmplModalTitle').textContent = 'New Template'
  document.getElementById('tmplName').value = ''
  document.getElementById('tmplDesc').value = ''
  renderGroupSelect(null)
  syncTemplateEditorMode()
  renderDayEditor()
  document.getElementById('tmplModal').classList.add('open')
}

function openEditTmpl(id) {
  const t = templates.find(x => x.id === id)
  if (!t) return
  editingTmplId = id
  templateType = getTemplateType(t.template_type)
  patternLength = getTemplateCycleLength(templateType, t.cycle_length)
  dayConfigs = {}
  excludedDays = new Set()
  const slotCount = getTemplateSlotCount(templateType, patternLength)
  const existingDayNums = new Set((t.days || []).map(getTemplateDayIndex))
  for (let i = 0; i < slotCount; i++) {
    if (!existingDayNums.has(i)) excludedDays.add(i)
  }
  ;(t.days || []).forEach(d => {
    const idx = getTemplateDayIndex(d)
    if (Number.isInteger(idx)) dayConfigs[idx] = { ...d, day_index: idx }
  })
  document.getElementById('tmplModalTitle').textContent = 'Edit Template'
  document.getElementById('tmplName').value = t.name
  document.getElementById('tmplDesc').value = t.description || ''
  renderGroupSelect(t.org_id || null)
  syncTemplateEditorMode()
  renderDayEditor()
  document.getElementById('tmplModal').classList.add('open')
}

function closeTmplModal() {
  closeCopyDayMenu()
  document.getElementById('tmplModal').classList.remove('open')
}

function renderDayEditor() {
  const grid = document.getElementById('dayEditorGrid')
  const slotCount = getTemplateSlotCount()
  syncTemplateEditorMode()
  grid.style.gridTemplateColumns = `repeat(${slotCount}, minmax(130px, 1fr))`
  grid.style.minWidth = `${Math.max(7, slotCount) * 130}px`
  grid.innerHTML = ''
  for (let i = 0; i < slotCount; i++) {
    const cfg_day = dayConfigs[i] || { note_color: DEFAULT_TEMPLATE_COLOUR, is_off: 0 }
    const isExcluded = excludedDays.has(i)
    const cell = document.createElement('div')
    cell.className = 'day-editor-cell' + (isExcluded ? ' day-excluded' : '')
    cell.id = `dc_cell_${i}`
    cell.innerHTML = `
      <div class="day-editor-cell-header" id="dc_hdr_${i}">
        <span class="day-label">${getTemplateDayLabel(i)}</span>
        <div style="display:flex;gap:4px;align-items:center">
          ${!isExcluded ? `<button class="day-copy-btn" id="dc_copybtn_${i}" title="Copy this day to other days…">
            <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15">
              <path d="M7 3.5A1.5 1.5 0 018.5 2h3.879a1.5 1.5 0 011.06.44l3.122 3.12A1.5 1.5 0 0117 6.622V12.5a1.5 1.5 0 01-1.5 1.5h-1v-3.379a3 3 0 00-.879-2.121L10.5 5.379A3 3 0 008.379 4.5H7v-1z"/>
              <path d="M4.5 6A1.5 1.5 0 003 7.5v9A1.5 1.5 0 004.5 18h7a1.5 1.5 0 001.5-1.5v-5.879a1.5 1.5 0 00-.44-1.06L9.44 6.439A1.5 1.5 0 008.378 6H4.5z"/>
            </svg>
          </button>` : ''}
          <button class="day-exclude-btn${isExcluded ? ' excluded' : ''}" id="dc_excl_${i}" title="${isExcluded ? 'Include this day' : 'Exclude this day (no shift created)'}">
            ${isExcluded
              ? `<svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd"/></svg>`
              : `<svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>`}
          </button>
        </div>
      </div>
      ${isExcluded
        ? `<div class="day-excluded-body"><span>Not included in template</span></div>`
        : `<div class="day-editor-cell-body">
        <div class="form-group" style="margin-bottom:8px">
          <select class="form-select" id="dc_loc_${i}" style="font-size:11px;padding:5px 8px">
            <option value="">No location</option>
            ${locations.map(l=>`<option value="${l.id}"${cfg_day.location_id===l.id?' selected':''}>${l.name}</option>`).join('')}
          </select>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px">
          <input type="time" class="form-input" id="dc_start_${i}" value="${cfg_day.start_time||''}" style="font-size:11px;padding:5px 6px" placeholder="Start">
          <input type="time" class="form-input" id="dc_end_${i}" value="${cfg_day.end_time||''}" style="font-size:11px;padding:5px 6px" placeholder="End">
        </div>
        <textarea class="form-textarea" id="dc_notes_${i}" rows="2" style="font-size:11px;min-height:48px" placeholder="Notes…">${cfg_day.notes||''}</textarea>
        <div style="margin-top:6px" id="dc_colours_${i}"></div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
          <label class="toggle" style="width:32px;height:18px">
            <input type="checkbox" id="dc_off_${i}"${cfg_day.is_off?' checked':''}>
            <span class="toggle-slider"></span>
          </label>
          <span style="font-size:10px;color:var(--text-3)">Day off</span>
        </div>
      </div>`}
    `
    grid.appendChild(cell)

    // Wire up exclude button
    const exclBtn = document.getElementById(`dc_excl_${i}`)
    exclBtn.addEventListener('click', e => {
      e.stopPropagation()
      toggleDayExclusion(i)
    })

    if (!isExcluded) {
      // Wire up copy button
      const copyBtn = document.getElementById(`dc_copybtn_${i}`)
      copyBtn.addEventListener('click', e => {
        e.stopPropagation()
        openCopyDayMenu(i)
      })

      // Colour picker
      const colContainer = document.getElementById(`dc_colours_${i}`)
      let thisColour = resolveColourValue(cfg_day.note_color, DEFAULT_TEMPLATE_COLOUR)
      renderColourPicker(colContainer, thisColour, v => { thisColour = v; if (!dayConfigs[i]) dayConfigs[i] = {}; dayConfigs[i].note_color = v }, { allowNone: true })
      if (!dayConfigs[i]) dayConfigs[i] = {}
      dayConfigs[i].note_color = thisColour
    }
  }
}

function toggleDayExclusion(dayIdx) {
  closeCopyDayMenu()
  if (excludedDays.has(dayIdx)) {
    excludedDays.delete(dayIdx)
  } else {
    excludedDays.add(dayIdx)
  }
  renderDayEditor()
}

// ── Copy day (inline bar — no floating/positioning needed) ─────────────────────
let _copyDdSrc = null

function openCopyDayMenu(srcDay) {
  // Toggle off if clicking the same day's button again
  if (_copyDdSrc === srcDay) { closeCopyDayMenu(); return }
  _copyDdSrc = srcDay

  // Mark active button
  for (let i = 0; i < getTemplateSlotCount(); i++) {
    document.getElementById(`dc_copybtn_${i}`)?.classList.toggle('active', i === srcDay)
  }

  const bar = document.getElementById('copyDayBar')
  const targets = Array.from({ length: getTemplateSlotCount() }, (_, i) => i).filter(i => i !== srcDay)
  bar.innerHTML = `
    <span class="copy-day-bar-label">Copy <strong>${getTemplateDayLabel(srcDay)}</strong> to:</span>
    <div class="copy-day-bar-pills">
      ${targets.map(i => `<button class="copy-day-pill" data-target="${i}">${getTemplateDayLabel(i)}</button>`).join('')}
      <button class="copy-day-pill all" data-target="all">All other days</button>
    </div>
    <button class="copy-day-bar-close" title="Close">✕</button>`

  bar.querySelectorAll('.copy-day-pill').forEach(b => {
    b.addEventListener('click', () => {
      const t = b.dataset.target
      if (t === 'all') copyDayToAll(srcDay)
      else copyDayTo(srcDay, parseInt(t))
    })
  })
  bar.querySelector('.copy-day-bar-close').addEventListener('click', closeCopyDayMenu)
  bar.style.display = 'flex'
}

function closeCopyDayMenu() {
  _copyDdSrc = null
  for (let i = 0; i < getTemplateSlotCount(); i++) {
    document.getElementById(`dc_copybtn_${i}`)?.classList.remove('active')
  }
  const bar = document.getElementById('copyDayBar')
  bar.style.display = 'none'
  bar.innerHTML = ''
}

function snapshotDay(dayIdx) {
  if (!dayConfigs[dayIdx]) dayConfigs[dayIdx] = {}
  dayConfigs[dayIdx].location_id = document.getElementById(`dc_loc_${dayIdx}`)?.value || null
  dayConfigs[dayIdx].start_time  = document.getElementById(`dc_start_${dayIdx}`)?.value || null
  dayConfigs[dayIdx].end_time    = document.getElementById(`dc_end_${dayIdx}`)?.value || null
  dayConfigs[dayIdx].notes       = document.getElementById(`dc_notes_${dayIdx}`)?.value.trim() || null
  dayConfigs[dayIdx].is_off      = document.getElementById(`dc_off_${dayIdx}`)?.checked || false
  return { ...dayConfigs[dayIdx] }
}

function applyDaySnapshot(snap, targetIdx) {
  dayConfigs[targetIdx] = { ...snap, day_index: targetIdx }
  const locEl = document.getElementById(`dc_loc_${targetIdx}`)
  if (locEl) locEl.value = snap.location_id || ''
  const startEl = document.getElementById(`dc_start_${targetIdx}`)
  if (startEl) startEl.value = snap.start_time || ''
  const endEl = document.getElementById(`dc_end_${targetIdx}`)
  if (endEl) endEl.value = snap.end_time || ''
  const notesEl = document.getElementById(`dc_notes_${targetIdx}`)
  if (notesEl) notesEl.value = snap.notes || ''
  const offEl = document.getElementById(`dc_off_${targetIdx}`)
  if (offEl) offEl.checked = !!snap.is_off
  const colContainer = document.getElementById(`dc_colours_${targetIdx}`)
  if (colContainer) {
    const colour = resolveColourValue(snap.note_color, DEFAULT_TEMPLATE_COLOUR)
    dayConfigs[targetIdx].note_color = colour
    colContainer.innerHTML = ''
    renderColourPicker(colContainer, colour, v => { dayConfigs[targetIdx].note_color = v }, { allowNone: true })
  }
}

function copyDayTo(srcIdx, targetIdx) {
  closeCopyDayMenu()
  const snap = snapshotDay(srcIdx)
  applyDaySnapshot(snap, targetIdx)
  toast(`${getTemplateDayLabel(srcIdx)} copied to ${getTemplateDayLabel(targetIdx)}`, 'success', 2000)
}

function copyDayToAll(srcIdx) {
  closeCopyDayMenu()
  const snap = snapshotDay(srcIdx)
  for (let i = 0; i < getTemplateSlotCount(); i++) {
    if (i !== srcIdx) applyDaySnapshot(snap, i)
  }
  toast(`${getTemplateDayLabel(srcIdx)} copied to all days`, 'success', 2000)
}

// ── Save / Delete ──────────────────────────────────────────────────────────────
async function saveTmpl() {
  const name = document.getElementById('tmplName').value.trim()
  if (!name) { toast('Template name is required', 'error'); return }
  const currentType = getTemplateType(document.getElementById('tmplType')?.value || templateType)
  const currentCycleLength = currentType === TEMPLATE_TYPE_PATTERN
    ? getTemplateCycleLength(currentType, document.getElementById('tmplCycleLength')?.value || patternLength)
    : 7

  const days = []
  for (let i = 0; i < getTemplateSlotCount(currentType, currentCycleLength); i++) {
    if (excludedDays.has(i)) continue
    const dc = dayConfigs[i] || {}
    days.push({
      [currentType === TEMPLATE_TYPE_PATTERN ? 'day_index' : 'day_of_week']: i,
      location_id: document.getElementById(`dc_loc_${i}`)?.value || null,
      start_time:  document.getElementById(`dc_start_${i}`)?.value || null,
      end_time:    document.getElementById(`dc_end_${i}`)?.value || null,
      notes:       document.getElementById(`dc_notes_${i}`)?.value.trim() || null,
      note_color:  resolveColourValue(dc.note_color, DEFAULT_TEMPLATE_COLOUR),
      is_off:      document.getElementById(`dc_off_${i}`)?.checked || false,
    })
  }

  const org_id = document.getElementById('tmplGroup')?.value || null
  const body = {
    name,
    description: document.getElementById('tmplDesc').value.trim(),
    org_id,
    template_type: currentType,
    cycle_length: currentCycleLength,
    days,
  }

  try {
    if (editingTmplId) {
      await api(`/api/templates/${editingTmplId}`, { method: 'PUT', body })
      toast('Template updated', 'success')
    } else {
      await api('/api/templates', { method: 'POST', body })
      toast('Template created', 'success')
    }
    closeTmplModal()
    await loadTemplates()
  } catch (err) {
    toast(err.message, 'error')
  }
}

function deleteTmpl(id) {
  const t = templates.find(x => x.id === id)
  if (!t) return
  showConfirm(`Delete template "${t.name}"?`, 'This cannot be undone.', async () => {
    try {
      await api(`/api/templates/${id}`, { method: 'DELETE' })
      toast('Template deleted', 'success')
      await loadTemplates()
    } catch (err) {
      toast(err.message, 'error')
    }
  })
}

function showConfirm(title, body, onConfirm) {
  document.getElementById('confirmModal')?.remove()
  const modal = document.createElement('div')
  modal.id = 'confirmModal'
  modal.className = 'modal-overlay open'
  modal.innerHTML = `
    <div class="modal" style="max-width:360px">
      <div class="modal-header"><h3 class="modal-title">${title}</h3></div>
      <div class="modal-body" style="padding-top:12px">
        <p style="font-size:13px;color:var(--text-3)">${body}</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>
        <button class="btn btn-danger" id="confirmOkBtn">Delete</button>
      </div>
    </div>`
  document.body.appendChild(modal)
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove() })
  document.getElementById('confirmCancelBtn').addEventListener('click', () => modal.remove())
  document.getElementById('confirmOkBtn').addEventListener('click', () => { modal.remove(); onConfirm() })
  setTimeout(() => document.getElementById('confirmOkBtn')?.focus(), 50)
}

async function duplicateTmpl(id) {
  const t = templates.find(x => x.id === id)
  if (!t) return
  const newName = `${t.name} (Copy)`
  const type = getTemplateType(t.template_type)
  const cycleLength = getTemplateCycleLength(type, t.cycle_length)
  try {
    await api('/api/templates', {
      method: 'POST',
      body: {
        name: newName,
        description: t.description || '',
        org_id: t.org_id || null,
        template_type: type,
        cycle_length: cycleLength,
        days: (t.days || []).map(d => ({
          [type === TEMPLATE_TYPE_PATTERN ? 'day_index' : 'day_of_week']: getTemplateDayIndex(d),
          location_id: d.location_id || null,
          start_time:  d.start_time  || null,
          end_time:    d.end_time    || null,
          notes:       d.notes       || null,
          note_color:  resolveColourValue(d.note_color, DEFAULT_TEMPLATE_COLOUR),
          is_off:      d.is_off      || false,
        }))
      }
    })
    toast(`Duplicated as "${newName}"`, 'success')
    await loadTemplates()
  } catch (err) {
    toast(err.message, 'error')
  }
}

// ── Apply Template ─────────────────────────────────────────────────────────────
function _buildApplyUserList() {
  const container = document.getElementById('applyUserList')
  container.innerHTML = users.map(u =>
    `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 2px;border-radius:4px">
      <input type="checkbox" class="apply-user-cb" data-uid="${u.id}"
        style="width:15px;height:15px;accent-color:var(--accent);flex-shrink:0">
      <span style="font-size:13px;color:var(--text-1)">${u.name}</span>
    </label>`
  ).join('')
  // Pre-check first user
  const first = container.querySelector('.apply-user-cb')
  if (first) first.checked = true
}

function applySelectAll(checked) {
  document.querySelectorAll('.apply-user-cb').forEach(cb => { cb.checked = checked })
}

function setApplyDateMeta(type) {
  const normalizedType = getTemplateType(type)
  applyingTmplType = normalizedType
  document.getElementById('applyDateLabel').textContent = normalizedType === TEMPLATE_TYPE_PATTERN
    ? 'Start date'
    : 'Week starting (Monday)'
  document.getElementById('applyModalCopy').textContent = normalizedType === TEMPLATE_TYPE_PATTERN
    ? 'Apply this pattern template to one or more team members from a chosen start date.'
    : 'Apply this weekly template to one or more team members for a specific week.'
}

function openApplyTmpl(id) {
  const template = templates.find(x => x.id === id)
  if (!template) return
  applyingTmplId = id
  setApplyDateMeta(template.template_type)
  const d = new Date()
  if (applyingTmplType === TEMPLATE_TYPE_WEEKLY) {
    const day = d.getDay()
    const toMon = (day === 0) ? -6 : 1 - day
    d.setDate(d.getDate() + toMon)
  }
  document.getElementById('applyWeekStart').value = toDateStr(d)
  document.getElementById('applyProgress').style.display = 'none'
  _buildApplyUserList()
  document.getElementById('applyModal').classList.add('open')
}

function closeApplyModal() { document.getElementById('applyModal').classList.remove('open') }

async function doApplyTmpl() {
  const selectedDate  = document.getElementById('applyWeekStart').value
  const skip_holidays = document.getElementById('applySkipHolidays').checked
  const selectedIds   = [...document.querySelectorAll('.apply-user-cb:checked')].map(cb => cb.dataset.uid)
  if (!selectedIds.length) { toast('Please select at least one team member', 'error'); return }
  if (!selectedDate) {
    toast(applyingTmplType === TEMPLATE_TYPE_PATTERN ? 'Please select a start date' : 'Please select a week', 'error')
    return
  }

  const btn = document.getElementById('applyBtn')
  btn.disabled = true
  const progressWrap = document.getElementById('applyProgress')
  const progressText = document.getElementById('applyProgressText')
  const progressBar  = document.getElementById('applyProgressBar')
  progressWrap.style.display = ''
  progressText.textContent = `Applying to 0 / ${selectedIds.length}…`
  progressBar.style.width = '0%'

  let applied = 0; let skipped = 0; let errors = 0
  for (let i = 0; i < selectedIds.length; i++) {
    const pct = Math.round(((i) / selectedIds.length) * 100)
    progressText.textContent = `Applying to ${i + 1} / ${selectedIds.length}…`
    progressBar.style.width = pct + '%'
    try {
      const body = {
        template_id: applyingTmplId,
        user_id: selectedIds[i],
        skip_holidays,
      }
      if (applyingTmplType === TEMPLATE_TYPE_PATTERN) body.start_date = selectedDate
      else body.week_start = selectedDate
      const r = await api('/api/shifts/apply-template', {
        method: 'POST',
        body,
      })
      applied += r.applied; skipped += r.skipped
    } catch { errors++ }
  }
  progressBar.style.width = '100%'

  setTimeout(() => {
    btn.disabled = false
    progressWrap.style.display = 'none'
    progressBar.style.width = '0%'
    const msg = `Template applied to ${selectedIds.length - errors} user${selectedIds.length - errors !== 1 ? 's' : ''} — ${applied} shifts created${skipped ? `, ${skipped} skipped (holiday)` : ''}${errors ? `, ${errors} failed` : ''}`
    toast(msg, errors > 0 ? 'error' : 'success', 4000)
    closeApplyModal()
    loadTemplates()  // refresh so last-applied date updates
  }, 300)
}

// Close modals on overlay click
document.getElementById('tmplModal').addEventListener('click', e => { if (e.target === document.getElementById('tmplModal')) closeTmplModal() })
document.getElementById('applyModal').addEventListener('click', e => { if (e.target === document.getElementById('applyModal')) closeApplyModal() })

init()
