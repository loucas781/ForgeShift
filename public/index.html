<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeShift — Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    (function(){
      var t = localStorage.getItem("fs-theme") || "system"
      if (t === "system") {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.setAttribute("data-theme","dark")
      } else if (t !== "light") {
        document.documentElement.setAttribute("data-theme", t)
      }
    })()
  </script>
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <main class="page-content" style="padding:0;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;">
      <div class="cal-wrapper">
        <!-- Toolbar -->
        <div class="cal-toolbar">
          <div class="cal-nav">
            <button class="cal-nav-btn" id="prevBtn" title="Previous">&#8249;</button>
            <button class="cal-today-btn" onclick="goToday()">Today</button>
            <button class="cal-nav-btn" id="nextBtn" title="Next">&#8250;</button>
          </div>
          <h2 class="cal-title" id="calTitle">Loading…</h2>
          <div id="userFilterWrap" style="display:none">
            <select class="cal-user-filter" id="teamFilter" onchange="renderView()">
              <option value="">My shifts</option>
            </select>
          </div>
          <div class="cal-view-tabs" style="margin-left:auto">
            <button class="cal-view-tab active" id="tabMonth" onclick="setView('month')">
              <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13" class="cal-view-tab-icon"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
              <span>Month</span>
            </button>
            <button class="cal-view-tab" id="tabWeek" onclick="setView('week')">
              <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13" class="cal-view-tab-icon"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
              <span>Week</span>
            </button>
          </div>
        </div>
        <!-- Grid -->
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </main>
</div>

<!-- Shift Modal -->
<div class="modal-overlay" id="shiftModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Shift</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="adminUserField" style="display:none" class="form-group">
        <label class="form-label">Team member</label>
        <select class="form-select" id="modalUser"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" class="form-input" id="modalDate">
      </div>
      <div class="form-group">
        <label class="form-label">Location</label>
        <select class="form-select" id="modalLocation">
          <option value="">— No location —</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label class="form-label">Start time</label>
          <input type="time" class="form-input" id="modalStart">
        </div>
        <div class="form-group">
          <label class="form-label">End time</label>
          <input type="time" class="form-input" id="modalEnd">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-textarea" id="modalNotes" placeholder="Add any notes for this day…" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Shift colour <span style="font-weight:400;color:var(--text-3);font-size:11px">(used when no location colour is set)</span></label>
        <div id="modalColourPicker"></div>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px">
        <label class="toggle">
          <input type="checkbox" id="modalIsOff">
          <span class="toggle-slider"></span>
        </label>
        <span class="form-label" style="margin:0">Day off / leave</span>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px">
        <label class="toggle">
          <input type="checkbox" id="modalIsOncall">
          <span class="toggle-slider"></span>
        </label>
        <span class="form-label" style="margin:0">On-call</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="deleteShiftBtn" style="display:none;margin-right:auto" onclick="deleteShift()">Delete</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveShift()">Save shift</button>
    </div>
  </div>
</div>

<!-- Task Assignment Modal -->
<div class="modal-overlay" id="taskAssignModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="taskAssignModalTitle">Assign Task</h3>
      <button class="modal-close" onclick="closeTaskAssignModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-3);font-size:13px;margin-bottom:16px">Assign a task list to a team member for one or more days this week.</p>
      <div class="form-group">
        <label class="form-label">Team member</label>
        <select class="form-select" id="taUser"></select>
      </div>
      <div class="form-group">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <label class="form-label" style="margin:0">Days</label>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="taSelectDays('weekdays')" style="font-size:11px;padding:2px 8px">Weekdays</button>
            <button class="btn btn-ghost btn-sm" onclick="taSelectDays('all')" style="font-size:11px;padding:2px 8px">All week</button>
            <button class="btn btn-ghost btn-sm" onclick="taSelectDays('none')" style="font-size:11px;padding:2px 8px">Clear</button>
          </div>
        </div>
        <div id="taDayPicker" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Task list</label>
        <select class="form-select" id="taTaskList">
          <option value="">— Select a task list —</option>
        </select>
      </div>
      <!-- Current assignments for the selected user across this week -->
      <div id="taCurrentAssignments" style="display:none;margin-top:4px">
        <label class="form-label" style="margin-bottom:6px">Already assigned this week</label>
        <div id="taAssignmentList" style="display:flex;flex-direction:column;gap:4px"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeTaskAssignModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTaskAssignment()">Add assignment</button>
    </div>
  </div>
</div>

<!-- Task Detail Popover -->
<div id="taskDetailPopover" style="display:none;position:fixed;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px 16px;min-width:220px;max-width:320px;pointer-events:none">
  <div id="taskDetailName" style="font-weight:700;font-size:14px;margin-bottom:4px"></div>
  <div id="taskDetailUser" style="font-size:12px;color:var(--text-3);margin-bottom:8px"></div>
  <div id="taskDetailDesc" style="font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:8px;display:none"></div>
  <div id="taskDetailLocation" style="font-size:12px;color:var(--text-3);display:none"></div>
</div>

<script src="/js/shell.js"></script>
<script src="/js/prefs.js"></script>
<script>
'use strict'

let cfg = null
// Helper: true for admin and shift_lead (both can manage shifts/assignments)
function canManage() { return cfg && (cfg.user.role === 'admin' || cfg.user.role === 'shift_lead') }
let prefs = null
let view = 'month'
let currentDate = new Date()
let shifts = []
let locations = []
let users = []
let taskLists = []
let taskAssignments = []
let editingShiftId = null
let selectedColour = '#4f46e5'

// Copy/paste state
let copiedShift = null   // { location_id, start_time, end_time, notes, note_color, is_off }

// Holiday map cache: { year: { 'YYYY-MM-DD': [{name, emoji}] } }
let _holidayCache = {}

async function init() {
  cfg = await loadConfig()
  if (!cfg) return
  renderShell(cfg, 'calendar')
  prefs = await loadPrefs()

  view = prefs.defaultView || 'month'

  if (cfg.user.role === 'admin' || cfg.user.role === 'shift_lead') {
    document.getElementById('userFilterWrap').style.display = 'block'
    document.getElementById('adminUserField').style.display = 'block'
  }

  await Promise.all([loadLocations(), loadUsers(), loadTeams(), loadTaskLists()])
  renderView()

  document.getElementById('prevBtn').addEventListener('click', prev)
  document.getElementById('nextBtn').addEventListener('click', next)

  // Context menu: dismiss on outside click
  document.addEventListener('click', () => dismissContextMenu())
}

async function loadLocations() {
  locations = await api('/api/locations')
  const sel = document.getElementById('modalLocation')
  locations.forEach(l => {
    const o = document.createElement('option')
    o.value = l.id; o.textContent = l.name
    sel.appendChild(o)
  })
}

async function loadUsers() {
  if (cfg.user.role === 'member') { users = [cfg.user]; return }
  // admin and shift_lead both load users — backend scopes appropriately for shift_lead via teams
  const allUsers = await api('/api/users')
  if (cfg.user.role === 'shift_lead') {
    // Get team members from the shift_lead's own teams (loaded in loadTeams)
    // We'll populate after teams load; for now load all active members + self
    users = allUsers.filter(u => u.is_active && (u.role === 'member' || u.id === cfg.user.id))
  } else {
    users = allUsers
  }
  const msel = document.getElementById('modalUser')
  users.filter(u => u.is_active).forEach(u => {
    const o = document.createElement('option'); o.value = u.id; o.textContent = u.name
    msel.appendChild(o)
  })
  // Also populate task assignment user select
  const tasel = document.getElementById('taUser')
  users.filter(u => u.is_active).forEach(u => {
    const o = document.createElement('option'); o.value = u.id; o.textContent = u.name
    tasel.appendChild(o)
  })
}

let teams = []
async function loadTeams() {
  if (cfg.user.role === 'member') return
  try { teams = await api('/api/teams') } catch { teams = [] }

  // For shift_lead: refine the user list to only members across their teams
  if (cfg.user.role === 'shift_lead' && teams.length) {
    const teamMemberIds = new Set()
    teamMemberIds.add(cfg.user.id)
    teams.forEach(t => (t.members || []).forEach(m => { if (m.is_active) teamMemberIds.add(m.id) }))
    // Re-filter users to only those in scope, and repopulate selects
    const allUsers = users  // already loaded in loadUsers
    users = allUsers.filter(u => teamMemberIds.has(u.id))
    const msel = document.getElementById('modalUser')
    msel.innerHTML = ''
    users.forEach(u => {
      const o = document.createElement('option'); o.value = u.id; o.textContent = u.name
      msel.appendChild(o)
    })
    const tasel = document.getElementById('taUser')
    tasel.innerHTML = ''
    users.forEach(u => {
      const o = document.createElement('option'); o.value = u.id; o.textContent = u.name
      tasel.appendChild(o)
    })
  }

  const sel = document.getElementById('teamFilter')
  while (sel.options.length > 1) sel.remove(1)
  const allOpt = document.createElement('option')
  allOpt.value = 'all'; allOpt.textContent = cfg.user.role === 'admin' ? 'All shifts' : 'All my teams'
  sel.appendChild(allOpt)
  teams.forEach(t => {
    const o = document.createElement('option')
    o.value = 'team:' + t.id
    o.textContent = t.name + (t.member_count > 0 ? ' (' + t.member_count + ')' : '')
    sel.appendChild(o)
  })
}

async function loadTaskLists() {
  if (!cfg.featureTasks) return
  try { taskLists = await api('/api/tasks/lists') } catch { taskLists = [] }
  // Populate task assignment modal select
  const sel = document.getElementById('taTaskList')
  if (sel) {
    while (sel.options.length > 1) sel.remove(1)
    taskLists.forEach(t => {
      const o = document.createElement('option'); o.value = t.id; o.textContent = t.name
      sel.appendChild(o)
    })
  }
}

// ── Holiday map ────────────────────────────────────────────────────────────────
function getHolidayMap(year) {
  if (_holidayCache[year]) return _holidayCache[year]
  const enabled = prefs?.holidays || []
  _holidayCache[year] = buildHolidayMap(year, enabled)
  return _holidayCache[year]
}

function invalidateHolidayCache() { _holidayCache = {} }

// ── Data loading ───────────────────────────────────────────────────────────────
async function loadShifts() {
  const weekStart = prefs?.weekStartDay ?? 1
  let start, end
  if (view === 'month') {
    const year  = currentDate.getFullYear()
    const month = currentDate.getMonth()
    const first = new Date(year, month, 1)
    const last  = new Date(year, month + 1, 0)
    const startOffset = (first.getDay() - weekStart + 7) % 7
    start = new Date(year, month, 1 - startOffset)
    const lastDay = last.getDay()
    const endOffset = (weekStart + 6 - lastDay + 7) % 7
    end = new Date(year, month, last.getDate() + endOffset)
  } else {
    start = startOfWeek(currentDate, weekStart)
    end   = new Date(start); end.setDate(end.getDate() + 6)
  }
  const params = new URLSearchParams({ start: toDateStr(start), end: toDateStr(end) })
  const filterVal = document.getElementById('teamFilter')?.value || ''
  const role = cfg.user.role

  if (role === 'member') {
    params.set('user_id', cfg.user.id)
  } else if (role === 'admin' || role === 'shift_lead') {
    if (filterVal === '') {
      // No filter selected — show own shifts only
      params.set('user_id', cfg.user.id)
    } else if (filterVal === 'all') {
      // Show all shifts in scope (backend enforces scope for shift_lead)
    } else if (filterVal.startsWith('team:')) {
      const teamId = filterVal.slice(5)
      const team = teams.find(t => t.id === teamId)
      if (team && team.members.length) {
        const fetches = team.members.filter(m => m.is_active).map(m => {
          const p = new URLSearchParams({ start: toDateStr(start), end: toDateStr(end), user_id: m.id })
          return api('/api/shifts?' + p)
        })
        shifts = (await Promise.all(fetches)).flat()
        return
      }
    }
  }
  shifts = await api('/api/shifts?' + params)
}

async function loadTaskAssignments() {
  const weekStart = prefs?.weekStartDay ?? 1
  let start, end
  if (view === 'month') {
    const year  = currentDate.getFullYear()
    const month = currentDate.getMonth()
    const first = new Date(year, month, 1)
    const last  = new Date(year, month + 1, 0)
    const startOffset = (first.getDay() - weekStart + 7) % 7
    start = new Date(year, month, 1 - startOffset)
    const lastDay = last.getDay()
    const endOffset = (weekStart + 6 - lastDay + 7) % 7
    end = new Date(year, month, last.getDate() + endOffset)
  } else {
    start = startOfWeek(currentDate, weekStart)
    end   = new Date(start); end.setDate(end.getDate() + 6)
  }
  const params = new URLSearchParams({ start: toDateStr(start), end: toDateStr(end) })
  if (cfg.user.role === 'member') params.set('user_id', cfg.user.id)
  try { taskAssignments = await api('/api/tasks/assignments?' + params) } catch { taskAssignments = [] }
}

async function renderView() {
  await loadShifts()
  if (cfg.featureTasks && taskLists.length) await loadTaskAssignments()
  updateTitle()
  if (view === 'month') renderMonth()
  else renderWeek()
  document.getElementById('tabMonth').className = 'cal-view-tab' + (view==='month'?' active':'')
  document.getElementById('tabWeek').className  = 'cal-view-tab' + (view==='week'?' active':'')
  // Update copy indicator
  updatePasteHint()
}

function updateTitle() {
  const weekStart = prefs?.weekStartDay ?? 1
  if (view === 'month') {
    document.getElementById('calTitle').textContent = MONTH_NAMES[currentDate.getMonth()] + ' ' + currentDate.getFullYear()
  } else {
    const ws = startOfWeek(currentDate, weekStart)
    const we = new Date(ws); we.setDate(we.getDate() + 6)
    document.getElementById('calTitle').textContent =
      ws.getDate() + ' ' + MONTH_NAMES[ws.getMonth()].slice(0,3) + ' – ' +
      we.getDate() + ' ' + MONTH_NAMES[we.getMonth()].slice(0,3) + ' ' + we.getFullYear()
  }
}

// ── Month render ───────────────────────────────────────────────────────────────
function renderMonth() {
  const grid       = document.getElementById('calGrid')
  const today      = toDateStr(new Date())
  const year       = currentDate.getFullYear()
  const month      = currentDate.getMonth()
  const first      = new Date(year, month, 1)
  const last       = new Date(year, month + 1, 0)
  const weekStart  = prefs?.weekStartDay ?? 1
  const showWkNums = prefs?.showWeekNumbers ?? false
  const compact    = prefs?.compactChips ?? false
  const holidays   = getHolidayMap(year)

  const startOffset = (first.getDay() - weekStart + 7) % 7
  const totalCells  = Math.ceil((startOffset + last.getDate()) / 7) * 7

  const shiftMap = {}
  shifts.forEach(s => { if (!shiftMap[s.date]) shiftMap[s.date] = []; shiftMap[s.date].push(s) })

  // Task assignment map: date -> [assignment, ...]
  const taskMap = {}
  taskAssignments.forEach(a => {
    if (!taskMap[a.date]) taskMap[a.date] = []
    taskMap[a.date].push(a)
  })

  // Build ordered day abbreviations starting from weekStart
  const allAbbr = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
  const dayAbbrs = Array.from({length:7}, (_,i) => allAbbr[(weekStart + i) % 7])

  let html = '<div class="cal-month' + (compact?' compact-chips':'') + (showWkNums?' has-weeknums':'') + '">'

  // Week number header gutter
  if (showWkNums) html += '<div class="cal-wknum-header"></div>'
  dayAbbrs.forEach(d => { html += '<div class="cal-day-header">' + d + '</div>' })

  for (let i = 0; i < totalCells; i++) {
    const d  = new Date(year, month, 1 - startOffset + i)
    const ds = toDateStr(d)
    const isCurrentMonth = d.getMonth() === month
    const isToday        = ds === today
    const dayShifts      = shiftMap[ds] || []
    const dayHols        = holidays[ds] || []

    // Week number at start of each row
    if (showWkNums && i % 7 === 0) {
      html += '<div class="cal-wknum">' + _isoWeekNumber(d) + '</div>'
    }

    // Task banner — shown on every day that has assignments (or + Task prompt for managers)
    let taskBannerHtml = ''
    if (cfg.featureTasks && taskLists.length) {
      const dayAssignments = taskMap[ds] || []
      const clickAttr = canManage()
        ? `onclick="event.stopPropagation();openTaskAssignModal('${ds}')"`
        : ''
      if (dayAssignments.length) {
        taskBannerHtml = dayAssignments.map(a => {
          const safeData = encodeURIComponent(JSON.stringify(a))
          return `<div class="cal-task-banner${canManage() ? ' clickable' : ''}" style="background:${a.task_list_color||'#0052cc'}22;border-left:3px solid ${a.task_list_color||'#0052cc'};color:${a.task_list_color||'#0052cc'}" ` +
            `onmouseenter="showTaskPopover(event,decodeData('${safeData}'))" onmouseleave="hideTaskPopover()" ${canManage() ? clickAttr : ''}>` +
            (canManage() ? `<span class="task-banner-user">${a.user_name?.split(' ')[0]}: </span>` : '') +
            `<span>${a.task_list_name}</span></div>`
        }).join('')
      } else if (canManage()) {
        taskBannerHtml = `<div class="cal-task-banner task-banner-empty" ${clickAttr} title="Assign task for this day">+ Task</div>`
      }
    }

    const hasPaste = copiedShift && dayShifts.length === 0

    html += '<div class="cal-cell' +
      (isCurrentMonth ? '' : ' other-month') +
      (isToday ? ' today' : '') +
      (dayHols.length ? ' is-holiday' : '') +
      (hasPaste ? ' can-paste' : '') +
      '" data-date="' + ds + '" onclick="handleCellClick(\'' + ds + '\')">'
    html += '<div class="cal-cell-date">' + d.getDate() + '</div>'

    // Holiday label(s) — pinned, non-interactive, behind shifts
    if (dayHols.length) {
      const names = dayHols.map(h => h.emoji + ' ' + h.name).join(' · ')
      html += '<div class="cal-holiday-label" title="' + names + '">' + names + '</div>'
    }

    // Task banner (first column of week only)
    if (taskBannerHtml) html += taskBannerHtml

    // Shift chips
    dayShifts.forEach(s => {
      const color = s.location_color || s.note_color || '#4f46e5'
      const label = s.is_off ? '🏖️ Off' : s.is_oncall ? '📟 On-call' : (s.location_name || 'Shift')
      const name  = canManage() && s.user_name ? s.user_name.split(' ')[0] + ': ' : ''
      html += '<div class="cal-shift-chip' + (s.is_off ? ' is-off' : '') + (s.is_oncall ? ' is-oncall' : '') +
        '" style="background:' + color + '"' +
        ' title="' + (s.user_name || '') + ': ' + label + '"' +
        ' onclick="event.stopPropagation();openEditModal(\'' + s.id + '\')"' +
        ' oncontextmenu="event.preventDefault();event.stopPropagation();showShiftContextMenu(event,\'' + s.id + '\')">' +
        name + label + '</div>'
    })

    // Paste hint
    if (hasPaste) {
      html += '<div class="cal-paste-hint" onclick="event.stopPropagation();pasteShift(\'' + ds + '\')">📋 Paste</div>'
    }

    html += '</div>'
  }
  html += '</div>'
  grid.innerHTML = html
}

// ── Week render ────────────────────────────────────────────────────────────────
function renderWeek() {
  const grid      = document.getElementById('calGrid')
  const today     = toDateStr(new Date())
  const weekStart = prefs?.weekStartDay ?? 1
  const ws        = startOfWeek(currentDate, weekStart)
  const year      = ws.getFullYear()
  const holidays  = getHolidayMap(year)

  const shiftMap = {}
  shifts.forEach(s => { if (!shiftMap[s.date]) shiftMap[s.date] = []; shiftMap[s.date].push(s) })

  // Task assignment map for this week: date -> [assignments]
  const taskMap = {}
  if (cfg.featureTasks) {
    taskAssignments.forEach(a => {
      if (!taskMap[a.date]) taskMap[a.date] = []
      taskMap[a.date].push(a)
    })
  }
  // Check if any day in this week has tasks (to decide whether to show the row)
  const weekHasTasks = cfg.featureTasks && (
    taskLists.length > 0 || Object.keys(taskMap).some(d => d >= toDateStr(ws) && d <= toDateStr(new Date(ws.getTime() + 6*86400000)))
  )

  let html = `<div class="cal-week">`
  html += `<div style="border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface-2);padding:10px 4px;"></div>`
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(d.getDate() + i)
    const ds = toDateStr(d)
    const isToday  = ds === today
    const hdrHols  = holidays[ds] || []
    html += `<div class="cal-week-day-header${isToday?' today':''}${hdrHols.length?' is-holiday':''}" style="border-right:1px solid var(--border)">
      <div class="day-name">${DAY_ABBR[d.getDay()]}</div>
      <div class="day-num">${d.getDate()}</div>
    </div>`
  }

  // Task row for week view — one cell per day
  if (cfg.featureTasks && (weekHasTasks || canManage())) {
    html += `<div style="border-right:1px solid var(--border);background:var(--surface-2);padding:4px 4px;font-size:10px;color:var(--text-3);display:flex;align-items:center;justify-content:center">Tasks</div>`
    for (let i = 0; i < 7; i++) {
      const d  = new Date(ws); d.setDate(d.getDate() + i)
      const ds = toDateStr(d)
      const dayAssignments = taskMap[ds] || []
      const clickAttr = canManage() && taskLists.length
        ? `onclick="event.stopPropagation();openTaskAssignModal('${ds}')"`
        : ''
      html += `<div style="border-right:1px solid var(--border);padding:4px 6px;display:flex;flex-direction:column;gap:2px">`
      if (dayAssignments.length) {
        dayAssignments.forEach(a => {
          const safeData = encodeURIComponent(JSON.stringify(a))
          html += `<div class="cal-task-banner week-task-banner${canManage() ? ' clickable' : ''}" style="background:${a.task_list_color||'#0052cc'}22;border-left:3px solid ${a.task_list_color||'#0052cc'};color:${a.task_list_color||'#0052cc'}" ` +
            `onmouseenter="showTaskPopover(event,decodeData('${safeData}'))" onmouseleave="hideTaskPopover()" ${canManage() ? clickAttr : ''}>` +
            (canManage() ? `<span class="task-banner-user">${a.user_name?.split(' ')[0]}: </span>` : '') +
            `<span>${a.task_list_name}</span></div>`
        })
      } else if (canManage() && taskLists.length) {
        html += `<div class="cal-task-banner week-task-banner task-banner-empty" ${clickAttr} title="Assign task for this day">+ Task</div>`
      }
      html += `</div>`
    }
  }

  html += `<div class="cal-week-time-col" style="padding:8px 4px;font-size:11px;color:var(--text-3)">`
  for (let h = 7; h <= 21; h++) html += `<div style="height:40px;padding-top:2px">${h}:00</div>`
  html += `</div>`
  for (let i = 0; i < 7; i++) {
    const d  = new Date(ws); d.setDate(d.getDate() + i)
    const ds = toDateStr(d)
    const dayShifts = shiftMap[ds] || []
    const dayHols   = holidays[ds] || []
    const hasPaste  = copiedShift && dayShifts.length === 0
    html += `<div class="cal-week-day-col${hasPaste?' can-paste':''}${dayHols.length?' is-holiday':''}" onclick="handleCellClick('${ds}')">`
    html += `<div class="cal-week-shifts">`
    // Holiday label — pinned at top of day column, non-interactive
    if (dayHols.length) {
      const names = dayHols.map(h => h.emoji + ' ' + h.name).join(' · ')
      html += `<div class="cal-holiday-label week-holiday-label" title="${names}">${names}</div>`
    }
    dayShifts.forEach(s => {
      const color = s.location_color || s.note_color || '#4f46e5'
      const label = s.is_off ? '🏖️ Day Off' : s.is_oncall ? '📟 On-call' : (s.location_name || 'Shift')
      const time  = s.start_time && s.end_time ? `${s.start_time}–${s.end_time}` : ''
      html += `<div class="cal-week-shift-card${s.is_oncall?' is-oncall':''}" style="background:${color}"
        onclick="event.stopPropagation();openEditModal('${s.id}')"
        oncontextmenu="event.preventDefault();event.stopPropagation();showShiftContextMenu(event,'${s.id}')">
        <div class="shift-loc">${canManage()?(s.user_name?.split(' ')[0]+': '):''}${label}</div>
        ${time ? `<div class="shift-time">${time}</div>` : ''}
        ${s.notes ? `<div class="shift-notes">${s.notes.slice(0,60)}${s.notes.length>60?'…':''}</div>` : ''}
      </div>`
    })
    if (hasPaste) {
      html += `<div class="cal-paste-hint" onclick="event.stopPropagation();pasteShift('${ds}')">📋 Paste shift</div>`
    }
    html += `</div></div>`
  }
  html += `</div>`
  grid.innerHTML = html
}

// ── ISO week number helper ─────────────────────────────────────────────────────
function _isoWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()))
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7))
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1))
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7)
}

// ── Nav ────────────────────────────────────────────────────────────────────────
function prev() {
  if (view === 'month') currentDate.setMonth(currentDate.getMonth() - 1)
  else currentDate.setDate(currentDate.getDate() - 7)
  renderView()
}
function next() {
  if (view === 'month') currentDate.setMonth(currentDate.getMonth() + 1)
  else currentDate.setDate(currentDate.getDate() + 7)
  renderView()
}
function goToday() { currentDate = new Date(); renderView() }
function setView(v) { view = v; renderView() }

// ── Cell click — aware of paste mode ──────────────────────────────────────────
function handleCellClick(date) {
  dismissContextMenu()
  if (copiedShift) {
    // Paste if the day is empty; otherwise open create modal pre-filled
    const dayHasShift = shifts.some(s => s.date === date)
    if (!dayHasShift) { pasteShift(date); return }
  }
  openCreateModal(date)
}

// ── Copy / Paste ───────────────────────────────────────────────────────────────
function copyShift(id) {
  const s = shifts.find(x => x.id === id)
  if (!s) return
  copiedShift = {
    location_id: s.location_id,
    start_time:  s.start_time,
    end_time:    s.end_time,
    notes:       s.notes,
    note_color:  s.note_color,
    is_off:      s.is_off,
  }
  if (canManage()) copiedShift.user_id = s.user_id
  updatePasteHint()
  renderView()
  toast('Shift copied — click an empty day to paste', 'success', 2500)
}

async function pasteShift(date) {
  if (!copiedShift) return
  try {
    await api('/api/shifts', { method: 'POST', body: { ...copiedShift, date } })
    toast('Shift pasted', 'success')
    renderView()
  } catch (err) {
    toast(err.message, 'error')
  }
}

function clearCopy() {
  copiedShift = null
  updatePasteHint()
  renderView()
}

function updatePasteHint() {
  let hint = document.getElementById('copyPasteHint')
  if (copiedShift) {
    if (!hint) {
      hint = document.createElement('div')
      hint.id = 'copyPasteHint'
      hint.className = 'cal-copy-hint'
      hint.innerHTML = `<svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13"><path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/><path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z"/></svg>
        Paste mode — click any empty day &nbsp;
        <button onclick="clearCopy()" style="background:none;border:none;color:inherit;cursor:pointer;font-weight:700;padding:0;opacity:.7;font-size:13px">✕ Cancel</button>`
      document.querySelector('.cal-toolbar').appendChild(hint)
    }
  } else if (hint) {
    hint.remove()
  }
}

// ── Context menu ───────────────────────────────────────────────────────────────
function showShiftContextMenu(e, id) {
  dismissContextMenu()
  const menu = document.createElement('div')
  menu.id = 'shiftContextMenu'
  menu.className = 'cal-context-menu'
  menu.style.top  = e.clientY + 'px'
  menu.style.left = e.clientX + 'px'
  menu.innerHTML = `
    <button class="ctx-item" onclick="copyShift('${id}');dismissContextMenu()">
      <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/><path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z"/></svg>
      Copy shift
    </button>
    <button class="ctx-item" onclick="openEditModal('${id}');dismissContextMenu()">
      <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
      Edit shift
    </button>
    <div class="ctx-sep"></div>
    <button class="ctx-item ctx-danger" onclick="quickDeleteShift('${id}');dismissContextMenu()">
      <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      Delete shift
    </button>`
  document.body.appendChild(menu)
  // Nudge if off-screen
  const r = menu.getBoundingClientRect()
  if (r.right  > window.innerWidth)  menu.style.left = (e.clientX - r.width)  + 'px'
  if (r.bottom > window.innerHeight) menu.style.top  = (e.clientY - r.height) + 'px'
}

function dismissContextMenu() {
  document.getElementById('shiftContextMenu')?.remove()
}

async function quickDeleteShift(id) {
  if (!confirm('Delete this shift?')) return
  try {
    await api(`/api/shifts/${id}`, { method: 'DELETE' })
    toast('Shift deleted', 'success')
    renderView()
  } catch (err) { toast(err.message, 'error') }
}

// ── Modal ──────────────────────────────────────────────────────────────────────
function openCreateModal(date) {
  editingShiftId = null
  selectedColour = '#4f46e5'
  document.getElementById('modalTitle').textContent = 'Add Shift'
  document.getElementById('modalDate').value  = date
  document.getElementById('modalLocation').value = ''
  // Pre-fill default times from prefs
  document.getElementById('modalStart').value = prefs?.defaultShiftStart || ''
  document.getElementById('modalEnd').value   = prefs?.defaultShiftEnd   || ''
  document.getElementById('modalNotes').value = ''
  document.getElementById('modalIsOff').checked = false
  document.getElementById('modalIsOncall').checked = false
  document.getElementById('deleteShiftBtn').style.display = 'none'
  if (canManage()) document.getElementById('modalUser').value = ''
  setupColourPicker()
  document.getElementById('shiftModal').classList.add('open')
}

function openEditModal(id) {
  const s = shifts.find(x => x.id === id)
  if (!s) return
  editingShiftId = id
  selectedColour = s.note_color || '#4f46e5'
  document.getElementById('modalTitle').textContent = 'Edit Shift'
  document.getElementById('modalDate').value  = s.date
  document.getElementById('modalLocation').value = s.location_id || ''
  document.getElementById('modalStart').value = s.start_time || ''
  document.getElementById('modalEnd').value   = s.end_time || ''
  document.getElementById('modalNotes').value = s.notes || ''
  document.getElementById('modalIsOff').checked = !!s.is_off
  document.getElementById('modalIsOncall').checked = !!s.is_oncall
  document.getElementById('deleteShiftBtn').style.display = 'flex'
  if (canManage()) document.getElementById('modalUser').value = s.user_id
  setupColourPicker()
  document.getElementById('shiftModal').classList.add('open')
}

function setupColourPicker() {
  const el = document.getElementById('modalColourPicker')
  el.innerHTML = ''
  renderColourPicker(el, selectedColour, v => { selectedColour = v })
}

function closeModal() {
  document.getElementById('shiftModal').classList.remove('open')
}

async function saveShift() {
  const body = {
    date:        document.getElementById('modalDate').value,
    location_id: document.getElementById('modalLocation').value || null,
    start_time:  document.getElementById('modalStart').value || null,
    end_time:    document.getElementById('modalEnd').value || null,
    notes:       document.getElementById('modalNotes').value.trim() || null,
    note_color:  selectedColour,
    is_off:      document.getElementById('modalIsOff').checked,
    is_oncall:   document.getElementById('modalIsOncall').checked,
  }
  if (canManage()) {
    body.user_id = document.getElementById('modalUser').value || cfg.user.id
  }
  try {
    if (editingShiftId) {
      await api(`/api/shifts/${editingShiftId}`, { method: 'PUT', body })
      toast('Shift updated', 'success')
    } else {
      await api('/api/shifts', { method: 'POST', body })
      toast('Shift added', 'success')
    }
    closeModal()
    renderView()
  } catch (err) {
    toast(err.message, 'error')
  }
}

async function deleteShift() {
  if (!editingShiftId) return
  if (!confirm('Delete this shift?')) return
  try {
    await api(`/api/shifts/${editingShiftId}`, { method: 'DELETE' })
    toast('Shift deleted', 'success')
    closeModal()
    renderView()
  } catch (err) {
    toast(err.message, 'error')
  }
}

document.getElementById('shiftModal').addEventListener('click', e => {
  if (e.target === document.getElementById('shiftModal')) closeModal()
})

document.getElementById('taskAssignModal').addEventListener('click', e => {
  if (e.target === document.getElementById('taskAssignModal')) closeTaskAssignModal()
})

// ── Popover helpers ────────────────────────────────────────────────────────────
function decodeData(encoded) {
  try { return JSON.parse(decodeURIComponent(encoded)) } catch { return null }
}
let _popoverTimer = null
function showTaskPopover(event, a) {
  if (!a) return
  clearTimeout(_popoverTimer)
  const pop = document.getElementById('taskDetailPopover')
  document.getElementById('taskDetailName').textContent = a.task_list_name || ''
  document.getElementById('taskDetailUser').textContent = a.user_name || ''
  const descEl = document.getElementById('taskDetailDesc')
  if (a.task_list_description) {
    descEl.textContent = a.task_list_description
    descEl.style.display = ''
  } else {
    descEl.style.display = 'none'
  }
  const locEl = document.getElementById('taskDetailLocation')
  if (a.location_name) {
    locEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${a.location_color||'#888'};flex-shrink:0"></span>${a.location_name}</span>`
    locEl.style.display = ''
  } else {
    locEl.style.display = 'none'
  }
  // Position near the cursor
  const x = Math.min(event.clientX + 12, window.innerWidth - 340)
  const y = Math.min(event.clientY + 12, window.innerHeight - 160)
  pop.style.left = x + 'px'
  pop.style.top  = y + 'px'
  pop.style.display = ''
}
function hideTaskPopover() {
  _popoverTimer = setTimeout(() => {
    document.getElementById('taskDetailPopover').style.display = 'none'
  }, 80)
}

// ── Task Assignment Modal ──────────────────────────────────────────────────────
// _taWeekDates: array of 7 date strings [Mon..Sun] for the current modal week
let _taWeekDates = []

function openTaskAssignModal(dateStr, userId) {
  // Derive the Monday of the week containing dateStr
  const clicked  = new Date(dateStr)
  const dow      = clicked.getDay()
  const toMon    = dow === 0 ? -6 : 1 - dow
  const monday   = new Date(clicked); monday.setDate(monday.getDate() + toMon)

  // Build the 7 dates for this week (Mon–Sun) as date strings
  _taWeekDates = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday); d.setDate(d.getDate() + i); return toDateStr(d)
  })

  // Title: week range
  const we = new Date(monday); we.setDate(we.getDate() + 6)
  document.getElementById('taskAssignModalTitle').textContent =
    'Assign Task — ' + monday.getDate() + ' ' + MONTH_NAMES[monday.getMonth()].slice(0,3) +
    ' – ' + we.getDate() + ' ' + MONTH_NAMES[we.getMonth()].slice(0,3)

  // Populate user select value
  const sel = document.getElementById('taUser')
  if (userId && sel) sel.value = userId

  // Build day-of-week pill checkboxes
  _buildDayPicker(dateStr)

  // Reset task list
  const taSel = document.getElementById('taTaskList')
  if (taSel) taSel.value = ''

  // Render existing assignments for user across this week
  _renderCurrentAssignments(sel ? sel.value : null)
  if (sel) sel.onchange = () => _renderCurrentAssignments(sel.value)

  document.getElementById('taskAssignModal').classList.add('open')
}

const _DAY_ABBRS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']

function _buildDayPicker(preselectedDate) {
  const container = document.getElementById('taDayPicker')
  container.innerHTML = _taWeekDates.map((ds, i) => {
    const checked = ds === preselectedDate
    const isWeekend = i >= 5  // Sat, Sun
    return `<label style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;user-select:none">
      <input type="checkbox" class="ta-day-cb" data-date="${ds}" ${checked ? 'checked' : ''}
        style="display:none" onchange="_updateDayPillStyle(this)">
      <span class="ta-day-pill" data-date="${ds}"
        style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;
               border:2px solid ${checked ? 'var(--accent)' : 'var(--border)'};
               background:${checked ? 'var(--accent)' : 'transparent'};
               color:${checked ? '#fff' : (isWeekend ? 'var(--text-3)' : 'var(--text-1)')};
               font-size:11px;font-weight:600;transition:all .15s;cursor:pointer"
        onclick="_toggleDayPill('${ds}')">
        ${_DAY_ABBRS[i]}<br><span style="font-size:10px;font-weight:400">${new Date(ds + 'T00:00:00').getDate()}</span>
      </span>
    </label>`
  }).join('')
}

function _toggleDayPill(ds) {
  const cb = document.querySelector(`.ta-day-cb[data-date="${ds}"]`)
  if (!cb) return
  cb.checked = !cb.checked
  _updateDayPillStyle(cb)
}

function _updateDayPillStyle(cb) {
  const pill = document.querySelector(`.ta-day-pill[data-date="${cb.dataset.date}"]`)
  if (!pill) return
  const i = _taWeekDates.indexOf(cb.dataset.date)
  const isWeekend = i >= 5
  pill.style.border      = `2px solid ${cb.checked ? 'var(--accent)' : 'var(--border)'}`
  pill.style.background  = cb.checked ? 'var(--accent)' : 'transparent'
  pill.style.color       = cb.checked ? '#fff' : (isWeekend ? 'var(--text-3)' : 'var(--text-1)')
}

function taSelectDays(mode) {
  _taWeekDates.forEach((ds, i) => {
    const cb = document.querySelector(`.ta-day-cb[data-date="${ds}"]`)
    if (!cb) return
    if      (mode === 'all')      cb.checked = true
    else if (mode === 'weekdays') cb.checked = i < 5
    else if (mode === 'none')     cb.checked = false
    _updateDayPillStyle(cb)
  })
}

function _renderCurrentAssignments(userId) {
  const container = document.getElementById('taCurrentAssignments')
  const list      = document.getElementById('taAssignmentList')
  const existing  = taskAssignments.filter(a =>
    _taWeekDates.includes(a.date) && (!userId || a.user_id === userId)
  )
  if (!existing.length) { container.style.display = 'none'; return }
  container.style.display = ''
  // Group by date for readability
  const byDate = {}
  existing.forEach(a => { if (!byDate[a.date]) byDate[a.date] = []; byDate[a.date].push(a) })
  list.innerHTML = _taWeekDates.filter(ds => byDate[ds]).map(ds => {
    const dayLabel = _DAY_ABBRS[_taWeekDates.indexOf(ds)]
    return byDate[ds].map(a =>
      `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;background:${a.task_list_color||'#0052cc'}18;border-left:3px solid ${a.task_list_color||'#0052cc'}">
        <span style="font-size:13px;color:${a.task_list_color||'#0052cc'};font-weight:600">${dayLabel} — ${a.task_list_name}</span>
        <button style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--text-3);padding:0 2px;line-height:1" title="Remove"
          onclick="removeTaskAssignment('${a.id}','${ds}','${a.user_id}')">✕</button>
      </div>`
    ).join('')
  }).join('')
}

function closeTaskAssignModal() {
  const sel = document.getElementById('taUser')
  if (sel) sel.onchange = null
  document.getElementById('taskAssignModal').classList.remove('open')
}

async function removeTaskAssignment(id, dateStr, userId) {
  try {
    await api(`/api/tasks/assignments/${id}`, { method: 'DELETE' })
    toast('Assignment removed', 'success')
    await renderView()
    // Re-open on same week (use any date from that week)
    openTaskAssignModal(dateStr, userId)
  } catch (err) { toast(err.message, 'error') }
}

async function saveTaskAssignment() {
  const user_id      = document.getElementById('taUser').value
  const task_list_id = document.getElementById('taTaskList').value
  if (!user_id)       { toast('Please select a team member', 'error'); return }
  if (!task_list_id)  { toast('Please select a task list', 'error'); return }

  const dates = _taWeekDates.filter(ds => {
    const cb = document.querySelector(`.ta-day-cb[data-date="${ds}"]`)
    return cb && cb.checked
  })
  if (!dates.length) { toast('Please select at least one day', 'error'); return }

  try {
    await api('/api/tasks/assignments/bulk', { method: 'POST', body: { user_id, task_list_id, dates } })
    toast(dates.length === 1 ? 'Task assigned' : `Task assigned for ${dates.length} days`, 'success')
    await renderView()
    // Re-open so they can keep adding
    openTaskAssignModal(dates[0], user_id)
  } catch (err) { toast(err.message, 'error') }
}

init()
