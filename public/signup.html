<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ForgeShift — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/png" href="/icons/app-icon-light-1024.png?v=20260429c" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/icons/app-icon-dark-1024.png?v=20260429c" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/icons/app-icon-light-1024.png?v=20260429c">
  <link rel="shortcut icon" type="image/png" href="/icons/app-icon-light-1024.png?v=20260429c">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260429c">
  <link rel="icon" type="image/png" href="/favicon.png?v=20260429c" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/app-icon-light-1024.png?v=20260429c">
  <script>
    (function(){
      var t = localStorage.getItem('fs-theme') || 'system'
      if (t === 'system') { if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark') }
      else if (t !== 'light') document.documentElement.setAttribute('data-theme', t)
    })()
  </script>
  <script src="/js/password-policy.js"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img id="authLogoImg" class="auth-logo-img" src="/icons/app-icon-light-1024.png?v=20260429c" alt="ForgeShift">
      <span class="auth-logo-text">ForgeShift</span>
    </div>

    <div id="mainForm">
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Get started with ForgeShift</p>

      <div class="auth-error" id="signupError"></div>

      <div class="form-group">
        <label class="form-label">Full name</label>
        <input type="text" class="form-input" id="name" placeholder="Jane Smith" autocomplete="name" autofocus>
        <div class="form-error" id="err-name" style="display:none"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" class="form-input" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="form-error" id="err-email" style="display:none"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input type="password" class="form-input" id="password" placeholder="Create a password" autocomplete="new-password" style="padding-right:40px">
          <button type="button" onclick="togglePw('password','eye1')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px" title="Show/hide">
            <svg id="eye1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div id="pwIndicator"></div>
        <div class="form-error" id="err-password" style="display:none"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <div style="position:relative">
          <input type="password" class="form-input" id="password2" placeholder="Repeat password" autocomplete="new-password" style="padding-right:40px">
          <button type="button" onclick="togglePw('password2','eye2')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px" title="Show/hide">
            <svg id="eye2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="form-error" id="err-confirm" style="display:none"></div>
      </div>

      <button class="btn btn-primary auth-btn" id="submitBtn" onclick="doSignup()">Create account</button>
      <div class="auth-link">Already have an account? <a href="/login.html">Sign in</a></div>
    </div>

    <div id="disabledState" style="display:none;text-align:center;padding:20px 0">
      <div style="width:44px;height:44px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" width="20" height="20"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </div>
      <h2 style="margin-bottom:8px">Registration closed</h2>
      <p style="font-size:13px;color:var(--text-3);margin-bottom:20px">New accounts must be created by an admin. Please contact your ForgeShift administrator.</p>
      <a href="/login.html" class="btn btn-primary auth-btn" style="justify-content:center">Back to Sign In</a>
    </div>

    <div style="text-align:center;margin-top:16px;font-size:11px;color:var(--text-3);white-space:normal;word-break:break-word;overflow:visible;text-overflow:clip" id="versionFooter">
      ForgeShift <span style="font-weight:700">v...</span>
    </div>
  </div>
</div>
<script>
  function togglePw(inputId, iconId) {
    const inp = document.getElementById(inputId)
    inp.type = inp.type === 'text' ? 'password' : 'text'
  }

  function fieldErr(id, msg) {
    const el = document.getElementById('err-' + id)
    if (!el) return
    el.textContent = msg
    el.style.display = msg ? 'block' : 'none'
  }

  function applyAuthThemeAndIcons(theme) {
    const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
    if (theme === 'light') document.documentElement.removeAttribute('data-theme')
    else if (isDark) document.documentElement.setAttribute('data-theme', 'dark')
    else document.documentElement.removeAttribute('data-theme')
    const href = isDark ? '/icons/app-icon-dark-1024.png?v=20260429c' : '/icons/app-icon-light-1024.png?v=20260429c'
    const appleTouch = document.querySelector('link[rel="apple-touch-icon"]')
    if (appleTouch) appleTouch.setAttribute('href', href)
    const logo = document.getElementById('authLogoImg')
    if (logo) logo.setAttribute('src', href)
    let runtimeIcon = document.getElementById('runtimeAppIcon')
    if (!runtimeIcon) {
      runtimeIcon = document.createElement('link')
      runtimeIcon.id = 'runtimeAppIcon'
      runtimeIcon.rel = 'icon'
      runtimeIcon.type = 'image/png'
      document.head.appendChild(runtimeIcon)
    }
    runtimeIcon.setAttribute('href', href)
  }

  // Attach live indicator
  ;(function setupAuthThemeWatcher() {
    const theme = localStorage.getItem('fs-theme') || 'system'
    applyAuthThemeAndIcons(theme)
    (function() {
      const mq = window.matchMedia('(prefers-color-scheme: dark)')
      const onThemeChange = () => {
        const liveTheme = localStorage.getItem('fs-theme') || 'system'
        if (liveTheme === 'system') applyAuthThemeAndIcons('system')
      }
      if (typeof mq.addEventListener === 'function') mq.addEventListener('change', onThemeChange)
      else if (typeof mq.addListener === 'function') mq.addListener(onThemeChange)
    })()
  })()

  const footer = document.getElementById('versionFooter')
  const footerEnvColor = (env) => env === 'staging' ? '#d97706' : env === 'development' ? '#6554c0' : '#0a7c41'
  const inferEnvFromHost = () => {
    const host = (window.location.hostname || '').toLowerCase()
    return host.includes('staging') ? 'staging' : (host.includes('dev') || host.includes('develop') || host.includes('localhost') || host === '') ? 'development' : 'production'
  }
  function setFooter(env, version) {
    if (!footer) return
    const envLabel = String(env || inferEnvFromHost()).toUpperCase()
    const versionLabel = String(version || '...')
    footer.innerHTML = `ForgeShift <span style="color:${footerEnvColor(envLabel.toLowerCase())};font-weight:700">${envLabel}</span> v${versionLabel}`
  }

  setFooter(inferEnvFromHost(), '...')

  // Attach password strength indicator if helper is available.
  // This must not block footer/env rendering.
  const pwInput = document.getElementById('password')
  if (pwInput && typeof createPasswordIndicator === 'function' && typeof updatePasswordIndicator === 'function') {
    const indicator = createPasswordIndicator()
    const host = document.getElementById('pwIndicator')
    if (host) {
      host.appendChild(indicator)
      pwInput.addEventListener('input', () => updatePasswordIndicator(indicator, pwInput.value))
    }
  }

  async function init() {
    try {
      const r = await fetch('/api/config')
      const d = await r.json()
      if (d.user) { window.location.href = '/'; return }
      if (d.passwordPolicy) setPasswordPolicy(d.passwordPolicy)
      if (!d.allowSignup) {
        document.getElementById('mainForm').style.display = 'none'
        document.getElementById('disabledState').style.display = 'block'
      }
      setFooter(d.appEnv, d.version)
    } catch {
      setFooter(inferEnvFromHost(), 'unknown')
    }
  }
  init()

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doSignup() })

  async function doSignup() {
    const btn = document.getElementById('submitBtn')
    const err = document.getElementById('signupError')
    err.classList.remove('show')
    ;['name','email','password','confirm'].forEach(f => fieldErr(f, ''))

    const name  = document.getElementById('name').value.trim()
    const email = document.getElementById('email').value.trim()
    const pw    = document.getElementById('password').value
    const pw2   = document.getElementById('password2').value
    let valid   = true

    if (!name)  { fieldErr('name', 'Full name is required.'); valid = false }
    if (!email) { fieldErr('email', 'Email is required.'); valid = false }
    else if (!/\S+@\S+\.\S+/.test(email)) { fieldErr('email', 'Enter a valid email address.'); valid = false }
    if (!pw) { fieldErr('password', 'Password is required.'); valid = false }
    else if (typeof validatePasswordClient === 'function') {
      const pv = validatePasswordClient(pw)
      if (!pv.ok) { fieldErr('password', pv.errors.join(' ')); valid = false }
    }
    if (pw && pw !== pw2) { fieldErr('confirm', 'Passwords do not match.'); valid = false }
    if (!valid) return

    btn.disabled = true; btn.textContent = 'Creating account…'
    try {
      const r = await fetch('/api/auth/signup', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name, email, password: pw })
      })
      const d = await r.json()
      if (!r.ok) { err.textContent = d.error || 'Signup failed'; err.classList.add('show'); return }
      window.location.href = '/'
    } catch {
      err.textContent = 'Connection error — please try again'
      err.classList.add('show')
    } finally { btn.disabled = false; btn.textContent = 'Create account' }
  }
</script>
</body>
</html>
