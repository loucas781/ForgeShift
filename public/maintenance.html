<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeShift — Maintenance Mode</title>
  <style>
    :root {
      --bg-1:#0b1638;
      --bg-2:#0f1e4a;
      --card:#1f2b45;
      --border:#304362;
      --text:#e6edf8;
      --text-muted:#a8b4cb;
      --brand:#4f46e5;
      --warn:#f59e0b;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% -10%, #1a2f73 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 100%, #0f275f 0%, transparent 60%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card {
      width:min(560px, 100%);
      background:color-mix(in oklab, var(--card) 92%, black 8%);
      border:1px solid var(--border);
      border-radius:18px;
      padding:28px;
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }
    .badge {
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:#f8e7b6;
      background:rgba(245,158,11,.14);
      border:1px solid rgba(245,158,11,.35);
      border-radius:999px;
      padding:6px 10px;
    }
    h1 {
      font-size:30px;
      margin:14px 0 8px;
      letter-spacing:-.02em;
    }
    p {
      margin:0;
      color:var(--text-muted);
      line-height:1.6;
      font-size:15px;
    }
    .cta {
      margin-top:20px;
      display:inline-block;
      padding:11px 16px;
      border-radius:10px;
      border:1px solid var(--border);
      color:var(--text);
      text-decoration:none;
      background:rgba(79,70,229,.22);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Maintenance Mode</div>
    <h1>ForgeShift is temporarily unavailable</h1>
    <p>The system is currently in maintenance mode while administrators perform setup and updates. Please try again shortly.</p>
    <a class="cta" href="/login.html">Back to sign in</a>
  </main>
</body>
</html>
