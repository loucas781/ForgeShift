<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeShift — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="9" fill="#4f46e5"/>
        <path d="M10 26V10h10l6 6v10H10z" fill="rgba(255,255,255,.25)"/>
        <path d="M20 10l6 6h-6V10z" fill="rgba(255,255,255,.5)"/>
        <rect x="13" y="16" width="10" height="1.5" rx=".75" fill="white"/>
        <rect x="13" y="19" width="7" height="1.5" rx=".75" fill="white"/>
        <rect x="13" y="22" width="8" height="1.5" rx=".75" fill="white"/></svg>
      <span class="auth-logo-text">ForgeShift</span>
    </div>
    <h1 class="auth-title">Set new password</h1>
    <p class="auth-subtitle">Enter and confirm your new password</p>
    <div class="auth-error" id="rpError"></div>
    <div class="auth-success" id="rpSuccess"></div>
    <div id="rpForm">
      <div class="form-group">
        <label class="form-label">New password</label>
        <input type="password" class="form-input" id="password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input type="password" class="form-input" id="password2" placeholder="••••••••">
      </div>
      <button class="btn btn-primary auth-btn" onclick="doReset()">Set password</button>
    </div>
    <div class="auth-link"><a href="/login.html">Back to sign in</a></div>
  </div>
</div>
<script>
  const t = localStorage.getItem('fs-theme') || 'light'
  if (t !== 'light') document.documentElement.setAttribute('data-theme', t)

  let sessionKey = null

  async function init() {
    const params = new URLSearchParams(window.location.search)
    const token  = params.get('token')
    if (!token) { showError('Invalid or missing reset token. Please request a new reset link.'); return }
    try {
      const r = await fetch('/api/auth/validate-reset-token', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token })
      })
      const d = await r.json()
      if (!r.ok) { showError(d.error || 'Invalid token'); return }
      sessionKey = d.sessionKey
    } catch {
      showError('Connection error')
    }
  }
  init()

  function showError(msg) {
    const e = document.getElementById('rpError')
    e.textContent = msg; e.classList.add('show')
    document.getElementById('rpForm').style.display = 'none'
  }

  async function doReset() {
    const err = document.getElementById('rpError')
    const ok  = document.getElementById('rpSuccess')
    err.classList.remove('show'); ok.classList.remove('show')
    const pw  = document.getElementById('password').value
    const pw2 = document.getElementById('password2').value
    if (!pw) { err.textContent = 'Password is required'; err.classList.add('show'); return }
    if (pw !== pw2) { err.textContent = 'Passwords do not match'; err.classList.add('show'); return }
    if (!sessionKey) { err.textContent = 'Session expired — please request a new reset link.'; err.classList.add('show'); return }
    try {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sessionKey, password: pw })
      })
      const d = await r.json()
      if (!r.ok) { err.textContent = d.error || 'Reset failed'; err.classList.add('show'); return }
      ok.textContent = 'Password updated! Redirecting to sign in…'; ok.classList.add('show')
      document.getElementById('rpForm').style.display = 'none'
      setTimeout(() => window.location.href = '/login.html', 2000)
    } catch {
      err.textContent = 'Connection error'; err.classList.add('show')
    }
  }
</script>
</body>
</html>
