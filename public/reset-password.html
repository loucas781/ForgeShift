<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ForgeShift — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/png" href="/icons/app-icon-light-1024.png?v=20260429" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/icons/app-icon-dark-1024.png?v=20260429" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/icons/app-icon-light-1024.png?v=20260429">
  <script src="/js/password-policy.js"></script>
  <script>
    (function(){
      var t = localStorage.getItem('fs-theme') || 'system'
      if (t === 'system') { if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark') }
      else if (t !== 'light') document.documentElement.setAttribute('data-theme', t)
    })()
  </script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="9" fill="#4f46e5"/>
        <path d="M10 26V10h10l6 6v10H10z" fill="rgba(255,255,255,.25)"/>
        <path d="M20 10l6 6h-6V10z" fill="rgba(255,255,255,.5)"/>
        <rect x="13" y="16" width="10" height="1.5" rx=".75" fill="white"/>
        <rect x="13" y="19" width="7" height="1.5" rx=".75" fill="white"/>
        <rect x="13" y="22" width="8" height="1.5" rx=".75" fill="white"/></svg>
      <span class="auth-logo-text">ForgeShift</span>
    </div>

    <div id="loadingState" style="text-align:center;padding:20px">
      <div style="font-size:13px;color:var(--text-3)">Verifying reset link…</div>
    </div>

    <div id="invalidState" style="display:none">
      <h1 class="auth-title">Link Expired</h1>
      <div class="auth-error show" id="invalidMsg">This reset link is invalid or has expired.</div>
      <a href="/forgot-password.html" class="btn btn-primary auth-btn" style="justify-content:center;margin-top:8px">Request a new link</a>
    </div>

    <div id="resetForm" style="display:none">
      <h1 class="auth-title">Set new password</h1>
      <p class="auth-subtitle" id="resetFor"></p>
      <div class="auth-error" id="rpError"></div>
      <div class="form-group">
        <label class="form-label">New password</label>
        <div style="position:relative">
          <input type="password" class="form-input" id="password" placeholder="••••••••" autocomplete="new-password" style="padding-right:40px">
          <button type="button" onclick="togglePw()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px" title="Show/hide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div id="pwIndicator" style="margin-top:6px"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input type="password" class="form-input" id="password2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn btn-primary auth-btn" id="submitBtn" onclick="doReset()">Set password</button>
    </div>

    <div id="successState" style="display:none;text-align:center">
      <div style="font-size:40px;margin-bottom:12px">✅</div>
      <h2 style="margin-bottom:8px">Password updated!</h2>
      <p style="font-size:13px;color:var(--text-3);margin-bottom:20px">Your password has been changed successfully.</p>
      <a href="/login.html" class="btn btn-primary auth-btn" style="justify-content:center">Sign in</a>
    </div>

    <div class="auth-link"><a href="/login.html">← Back to sign in</a></div>
  </div>
</div>
<script>
  let sessionKey = null

  // Set up live password indicator once the DOM is ready
  document.addEventListener('DOMContentLoaded', () => {
    const pwInput   = document.getElementById('password')
    const indicator = createPasswordIndicator()
    document.getElementById('pwIndicator').appendChild(indicator)
    pwInput.addEventListener('input', () => updatePasswordIndicator(indicator, pwInput.value))
  })

  function togglePw() {
    const inp = document.getElementById('password')
    inp.type = inp.type === 'text' ? 'password' : 'text'
  }

  async function init() {
    const params = new URLSearchParams(window.location.search)
    const token  = params.get('token')
    if (!token) { showInvalid('No reset token provided.'); return }

    try {
      const r = await fetch('/api/auth/reset-password/validate?token=' + encodeURIComponent(token))
      const d = await r.json()
      if (!r.ok || !d.sessionKey) { showInvalid(d.error || 'Invalid or expired reset link.'); return }
      sessionKey = d.sessionKey
      document.getElementById('resetFor').textContent = 'Setting new password for ' + (d.email || '')
      showState('resetForm')

      // Load policy so the indicator shows correct rules
      try {
        const cfg = await fetch('/api/config').then(r => r.json())
        if (cfg.passwordPolicy) setPasswordPolicy(cfg.passwordPolicy)
        // Re-render indicator with updated policy
        const pwInput = document.getElementById('password')
        const ind = document.getElementById('pwIndicator').firstChild
        if (ind) updatePasswordIndicator(ind, pwInput.value)
      } catch {}
    } catch {
      showInvalid('Connection error. Please try again.')
    }
  }

  function showState(id) {
    ['loadingState','invalidState','resetForm','successState'].forEach(s => {
      document.getElementById(s).style.display = s === id ? 'block' : 'none'
    })
  }

  function showInvalid(msg) {
    document.getElementById('invalidMsg').textContent = msg
    showState('invalidState')
  }

  async function doReset() {
    const err = document.getElementById('rpError')
    err.classList.remove('show')
    const pw  = document.getElementById('password').value
    const pw2 = document.getElementById('password2').value
    if (!pw)       { err.textContent = 'Password is required.'; err.classList.add('show'); return }
    if (pw !== pw2){ err.textContent = 'Passwords do not match.'; err.classList.add('show'); return }
    if (!sessionKey){ err.textContent = 'Session expired — please request a new link.'; err.classList.add('show'); return }

    const btn = document.getElementById('submitBtn')
    btn.disabled = true; btn.textContent = 'Saving…'
    try {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sessionKey, password: pw })
      })
      const d = await r.json()
      if (!r.ok) { err.textContent = d.error || 'Failed to reset password.'; err.classList.add('show'); return }
      showState('successState')
    } catch {
      err.textContent = 'Connection error.'; err.classList.add('show')
    } finally { btn.disabled = false; btn.textContent = 'Set password' }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doReset() })
  init()
</script>
</body>
</html>
