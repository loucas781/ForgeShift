name: Bump Build Version

on:
  push:
    branches:
      - main
      - develop
      - staging
    # Ignore pushes that are only the version bump itself
    paths-ignore:
      - 'version.json'

jobs:
  bump-version:
    name: Bump Build Counter
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated version.json back

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch with a token so the push back works
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version
        env:
          GITHUB_SHA:       ${{ github.sha }}
          GITHUB_REF_NAME:  ${{ github.ref_name }}
          # Set VERSION_BUMP to "patch", "minor", or "major" to also bump semver.
          # Leave unset to only increment the build counter.
          VERSION_BUMP:     ''
        run: node scripts/bump-version.js

      - name: Commit updated version.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: bump build [skip ci]"
          git push

      - name: Print version
        run: cat version.json
